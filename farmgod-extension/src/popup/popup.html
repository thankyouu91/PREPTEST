<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body{font:12px/1.45 system-ui,sans-serif;width:290px;margin:0;padding:12px;color:#222;}
  h1{font-size:13px;margin:0 0 8px;}
  p{margin:0 0 10px;color:#555;}
  label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;}
  select,input{font:inherit;}
  button{font:inherit;padding:4px 8px;cursor:pointer;}
  .row{display:flex;gap:6px;margin-top:10px;}
  .note{font-size:11px;color:#666;border-top:1px solid #ddd;padding-top:8px;margin-top:12px;}
  #status{font-size:11px;color:#2a7;min-height:14px;margin-top:6px;}
</style>
</head>
<body>
  <h1>FarmGod Planner</h1>
  <p>Open the loot assistant on a Tribal Wars world; the panel appears above the farm list.</p>

  <label>Language
    <select id="language">
      <option value="auto">Auto</option>
      <option value="int">English</option>
      <option value="vi">Tiếng Việt</option>
      <option value="nl">Nederlands</option>
    </select>
  </label>

  <label>Parallel requests
    <input id="concurrency" type="number" min="1" max="8" step="1" style="width:56px">
  </label>

  <div class="row">
    <button id="save">Save</button>
    <button id="clear">Clear stored plans</button>
  </div>
  <div id="status"></div>

  <div class="note">
    Planning is automatic. Sending is not: each attack needs its own click or
    Enter press, the same as using the loot assistant by hand.
  </div>

  <script src="popup.js"></script>
</body>
</html>
