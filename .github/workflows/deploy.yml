# Claude → GitHub → AWS.
#
# A commit lands on the working branch, GitHub runs the whole gate, and only a
# green gate is allowed to reach the server.
#
# Three things worth knowing:
#
#  · **Auto-deploy is ON.** DEPLOY_ON_PUSH was set to true on 2026-08-21, so
#    every commit that passes the gate goes to production without anybody
#    pressing anything. It ships to be turned OFF, because "every commit goes
#    straight to production" has to be somebody's decision rather than a side
#    effect of merging a workflow file. Turning it back off is one variable:
#    Settings → Secrets and variables → Actions → Variables.
#
#  · **What reaches the instance is the commit the gate tested**, passed as
#    DEPLOY_SHA, not the branch tip. The gate takes about seven minutes, and
#    the tip can move inside that window — it did, on the first green run: the
#    gate tested 29084b3 and the log read "Deployed 1fc578c". Following the tip
#    is how untested code reaches production under a green tick.
#
#  · **No AWS keys in GitHub.** The deploy job assumes an IAM role over OIDC,
#    so the credential is minted for one run and expires with it. And it
#    reaches the instance through Systems Manager rather than SSH: no key
#    material anywhere, no port 22 open, and AWS records who ran what.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this deploy is being run by hand
        required: false
        default: manual
  push:
    branches: [claude/prep-test-platform-design-fpiuqn]

concurrency:
  # One deploy at a time, and a newer commit cancels an older queued one — but
  # never cancels a deploy already talking to the instance.
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    name: The gate
    runs-on: ubuntu-latest
    services:
      postgres:
        # scripts/test-pg-schema.mjs loads the translated schema into a REAL
        # PostgreSQL and compares what the two engines built. Without this it
        # skips loudly, which is honest but is not the check.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prep_schema_check
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgres://postgres:postgres@127.0.0.1:5432/prep_schema_check
      # The gate resets the administrator password when this is unset, which on
      # a shared runner would mean a different one every run. Fixed here: the
      # database is thrown away with the runner.
      ADMIN_PASSWORD: ci-only-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      # This container has Chromium pre-installed and pins
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD; a GitHub runner does not, so the
      # browser half of the suite needs one fetched here.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify

  deploy:
    name: To the instance
    needs: check
    runs-on: ubuntu-latest
    # Never on a pull request, never from a fork, and never at all until the
    # role and the instance are configured. `vars.DEPLOY_ON_PUSH` is the switch
    # that turns an hourly commit into an hourly deploy.
    if: >-
      vars.AWS_ROLE_ARN != '' && vars.EC2_INSTANCE_ID != '' &&
      (github.event_name == 'workflow_dispatch' || vars.DEPLOY_ON_PUSH == 'true')
    permissions:
      id-token: write        # to mint the OIDC token the role trusts
      contents: read
    # Load-bearing in two ways, not decoration.
    #
    # It is where the branch restriction lives: Settings -> Environments ->
    # production -> Deployment branches and tags. AWS cannot enforce that,
    # because declaring an environment REPLACES the ref in the OIDC subject
    # claim (see deploy/github-oidc-trust-policy.json), so the trust policy
    # pins the environment and GitHub pins which branches may use it.
    #
    # It is also where a required reviewer goes, if this should ever pause for
    # a human before touching the server.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: The subject claim AWS is about to be shown
        # Printed BEFORE the assume, and read out of the REAL token rather than
        # composed from context the way the step below it does.
        #
        # "Not authorized to perform sts:AssumeRoleWithWebIdentity" never says
        # which claim disagreed. The trust policy pins one string; this is that
        # string as GitHub actually mints it. Comparing the two takes seconds;
        # guessing at it has now cost two separate debugging sessions.
        #
        # It matters because the value is not stable. A repository opted in to
        # immutable subject claims starts carrying numeric ids —
        # repo:owner@123/name@456:environment:production — and a trust policy
        # that worked last week stops matching with nothing on either side
        # having been edited.
        #
        # Only `sub` and `aud` are printed. The token itself is a credential
        # and is passed to node on stdin, never as an argument and never echoed.
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | node -e '
              let raw = "";
              process.stdin.on("data", d => { raw += d; });
              process.stdin.on("end", () => {
                const token = JSON.parse(raw).value;
                const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url"));
                console.log("sub: " + claims.sub);
                console.log("aud: " + claims.aud);
                console.log("");
                console.log("The trust policy condition must equal the sub above, exactly.");
              });
            '

      - name: Assume the deploy role
        # AWS's own action. Pin it to a commit SHA rather than a tag if you
        # want the supply chain nailed down; a tag can be moved.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-deploy-${{ github.run_id }}

      - name: Say which identity was used
        # Not the token — the value GitHub puts in its `sub` claim, composed
        # from the same context. When an assume-role fails with "Not authorized
        # to perform sts:AssumeRoleWithWebIdentity", this line and the trust
        # policy are the two strings to compare, and having one of them printed
        # turns a guessing game into a diff.
        if: always()
        run: |
          echo "subject claim should be: repo:${{ github.repository }}:environment:production"
          echo "(a repository created after 2026-07-15, or opted in to immutable"
          echo " subject claims, carries numeric ids: repo:owner@1234/name@5678:environment:production)"

      - name: Run the deploy on the instance
        # The command itself is deploy/ec2-deploy.sh, in this repository, so
        # what runs on the server is reviewable in a diff like everything else.
        #
        # The three variables describe the instance as it ACTUALLY is, which is
        # not how the script's defaults assume. It was installed by hand long
        # before this pipeline existed: a checkout in the ubuntu user's home,
        # run by PM2 rather than systemd, with the database beside it in
        # data/prep.sqlite. The first deploy through here failed with exit 127
        # looking for /opt/vpet-prep, and the honest fix is to deploy to where
        # the application and its accounts already live rather than to install
        # a second copy beside them. deploy/survey.sh is what established all
        # three; re-run it if the box is ever rebuilt.
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7} by ${GITHUB_ACTOR}" \
            --parameters commands="[\"APP_DIR=/home/ubuntu/PREPTEST APP_USER=ubuntu PM2_APP=preptest DEPLOY_SHA=${GITHUB_SHA} bash /home/ubuntu/PREPTEST/deploy/ec2-deploy.sh\"]" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $COMMAND_ID"

          # send-command returns immediately; the deploy has not happened yet.
          # Wait for it, then print what the instance actually said — a deploy
          # whose output nobody sees is a deploy nobody can debug.
          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}"
          WAITED=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'StandardOutputContent' --output text
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query 'Status' --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "::error::deploy finished as $STATUS"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi
          exit $WAITED

# ---------------------------------------------------------------------------
# What has to exist before this does anything
#
# Repository → Settings → Secrets and variables → Actions → Variables:
#
#   AWS_ROLE_ARN      arn:aws:iam::<account>:role/<role for GitHub OIDC>
#   AWS_REGION        ap-southeast-1
#   EC2_INSTANCE_ID   i-0123456789abcdef0
#   DEPLOY_ON_PUSH    true, once you want every commit on this branch deployed
#
# These are VARIABLES, not secrets: none of them is one. An account id and an
# instance id are identifiers, and putting them in the secret store only means
# nobody can read the workflow log to see which instance was deployed to.
#
# On the AWS side, three things:
#
#   1. An OIDC provider for token.actions.githubusercontent.com.
#   2. A role that trusts it — deploy/github-oidc-trust-policy.json, ready to
#      paste. It pins the repository AND the environment. It cannot pin the
#      branch, because an `environment:` job's subject claim has no ref in it;
#      the branch restriction goes on the environment in GitHub instead.
#   3. That role's permissions — deploy/github-oidc-permissions.json. SendCommand
#      on one instance and one document, and nothing else.
#   4. The instance needs the SSM agent running and an instance profile with
#      AmazonSSMManagedInstanceCore.
#
# Check what is really configured, rather than what was intended:
#
#   aws iam get-role --role-name <name> \
#     --query 'Role.AssumeRolePolicyDocument.Statement[].Condition' --output json
# ---------------------------------------------------------------------------
