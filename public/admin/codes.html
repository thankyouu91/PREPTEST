<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codes · VPET Prep admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
  <!-- Song ngữ: đặt ngôn ngữ (mặc định tiếng Việt) trước khi vẽ trang -->
  <script src="/i18n.js"></script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="codes" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-10">

      <section class="mb-7" aria-labelledby="h-batches">
        <div class="flex items-baseline gap-3 mb-3">
          <h2 id="h-batches" class="text-lg font-extrabold tracking-tight">Code batches</h2>
          <span class="text-[13.5px] text-muted font-semibold">Codes issued together for one class or one intake</span>
        </div>
        <div id="batches" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div class="card p-5"><div class="skeleton h-5 w-2/3 mb-3"></div><div class="skeleton h-4 w-1/2"></div></div>
        </div>
      </section>

      <div class="flex flex-wrap items-center gap-2.5 mb-5">
        <div class="flex gap-2 flex-wrap">
          <button type="button" class="chip" data-f="" aria-pressed="true">All</button>
          <button type="button" class="chip" data-f="unused" aria-pressed="false">Unused</button>
          <button type="button" class="chip" data-f="redeemed" aria-pressed="false">Activated</button>
          <button type="button" class="chip" data-f="revoked" aria-pressed="false">Revoked</button>
        </div>
        <label class="relative ms-auto min-w-[200px]">
          <span class="sr-only">Search codes</span>
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none" id="search-icon"></span>
          <input id="q" type="search" class="input ps-10 py-2.5" placeholder="Search by code…">
        </label>
      </div>

      <p class="text-[13.5px] font-semibold text-muted mb-3" id="count">Loading…</p>
      <div id="list"><div class="card p-5 grid gap-3.5">
        <div class="skeleton h-6 w-11/12"></div><div class="skeleton h-6 w-full"></div><div class="skeleton h-6 w-4/5"></div>
      </div></div>
      <div class="flex justify-center gap-2.5 mt-6" id="pager"></div>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
(async () => {
  await AD.mount({ title: 'Codes', subtitle: 'Issue a batch for a class, or bind one code to a single account' });
  AD.qs('#search-icon').innerHTML = AD.icon('search', 'w-[18px] h-[18px]');
  AD.qs('#page-actions').innerHTML =
    '<button type="button" id="btn-export" class="btn btn-ghost btn-sm">' + AD.icon('download', 'w-4 h-4') + '<span class="hidden sm:inline">Export CSV</span></button>' +
    '<button type="button" id="btn-issue" class="btn btn-primary btn-sm">' + AD.icon('plus', 'w-4 h-4') + 'Issue codes</button>';

  let families = [], tests = [], PLAN_LIST = [];
  try {
    const cat = await AD.get('/catalog');
    families = cat.families; tests = cat.tests; PLAN_LIST = cat.plans || [];
  } catch (e) {}
  try {
    const all = await AD.get('/admin/tests');
    tests = all.items;
  } catch (e) {}

  const state = { status: '', q: '', offset: 0, limit: 30, batch: '' };
  const preUser = new URLSearchParams(location.search).get('user');

  AD.qsa('[data-f]').forEach(b => b.addEventListener('click', () => {
    state.status = b.getAttribute('data-f'); state.offset = 0; state.batch = '';
    AD.qsa('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    load();
  }));
  let t = null;
  AD.qs('#q').addEventListener('input', e => {
    state.q = e.target.value.trim(); state.offset = 0;
    clearTimeout(t); t = setTimeout(load, 250);
  });

  async function loadBatches() {
    try {
      const { items } = await AD.get('/admin/batches');
      AD.qs('#batches').innerHTML = items.length
        ? items.slice(0, 6).map(b => {
            const pct = b.total ? Math.round(b.used / b.total * 100) : 0;
            return '<article class="card p-5">' +
              '<div class="flex items-start gap-2.5">' +
                '<span class="min-w-0"><b class="block truncate">' + AD.esc(b.name) + '</b>' +
                '<span class="block text-[12.5px] text-muted mt-0.5 truncate">' + AD.esc(b.label) + '</span></span>' +
                '<span class="badge badge-muted ms-auto shrink-0">' + b.total + ' codes</span>' +
              '</div>' +
              '<div class="flex items-center justify-between text-[12.5px] font-bold mt-4 mb-1.5">' +
                '<span class="text-muted">Used</span><span>' + b.used + '/' + b.total + '</span></div>' +
              '<div class="meter"><i data-w="' + pct + '"></i></div>' +
              '<div class="flex gap-2 mt-4">' +
                '<button type="button" class="btn btn-ghost btn-sm flex-1" data-batch="' + b.id + '">View codes</button>' +
                '<a class="btn btn-ghost btn-sm" href="/api/admin/codes/export?batch=' + b.id + '" aria-label="Download this batch as CSV">' + AD.icon('download', 'w-4 h-4') + '</a>' +
              '</div>' +
            '</article>';
          }).join('')
        : '<div class="card p-6 sm:col-span-2 lg:col-span-3 text-center text-[14px] text-muted">No batches yet. Issue two or more codes at once and they form one.</div>';
      AD.qsa('#batches .meter > i[data-w]').forEach(el =>
        requestAnimationFrame(() => el.style.setProperty('--w', el.getAttribute('data-w') + '%')));
      AD.qsa('[data-batch]').forEach(b => b.addEventListener('click', () => {
        state.batch = b.getAttribute('data-batch'); state.status = ''; state.offset = 0;
        AD.qsa('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x.getAttribute('data-f') === '')));
        load();
        AD.qs('#count').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }));
    } catch (e) {
      AD.qs('#batches').innerHTML = '<div class="sm:col-span-2 lg:col-span-3">' + AD.errorBox(e.message) + '</div>';
    }
  }

  const statusBadge = c => {
    if (c.status === 'redeemed') return '<span class="badge badge-ok">Activated</span>';
    if (c.status === 'revoked') return '<span class="badge badge-muted">Revoked</span>';
    const left = AD.daysUntil(c.expiresAt);
    if (left !== null && left < 0) return '<span class="badge badge-hl">Expired</span>';
    /* An unused code that already carries an account was reserved to that
       student at issue: only they can activate it. */
    if (c.user) return '<span class="badge badge-hl">Reserved</span>';
    return '<span class="badge badge-muted">Unused</span>';
  };

  async function load() {
    const p = new URLSearchParams({ limit: state.limit, offset: state.offset });
    if (state.status) p.set('status', state.status);
    if (state.q) p.set('q', state.q);
    if (state.batch) p.set('batch', state.batch);
    try {
      const r = await AD.get('/admin/codes?' + p);
      AD.qs('#count').textContent = r.total
        ? AD.num(r.total) + ' codes' + (state.batch ? ' in this batch' : '') + ' · showing ' + (r.offset + 1) + '-' + Math.min(r.offset + r.limit, r.total)
        : 'No codes match';
      if (!r.items.length) {
        AD.qs('#list').innerHTML = AD.emptyBox('ticket', 'No codes match',
          'Issue codes for a class, or change the filter to see others.',
          '<button type="button" class="btn btn-primary btn-md" data-empty-issue>Issue codes</button>');
        const b = AD.qs('[data-empty-issue]');
        if (b) b.addEventListener('click', openIssue);
        AD.qs('#pager').innerHTML = '';
        return;
      }
      AD.qs('#list').innerHTML =
        '<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-[14px]">' +
        '<thead><tr class="text-[12px] uppercase tracking-wide text-muted border-b border-line bg-surface">' +
          '<th class="text-left font-bold px-5 py-3">Code</th>' +
          '<th class="text-left font-bold px-4 py-3">Unlocks</th>' +
          '<th class="text-left font-bold px-4 py-3 hidden lg:table-cell">Student</th>' +
          '<th class="text-left font-bold px-4 py-3 hidden sm:table-cell">Expires</th>' +
          '<th class="text-left font-bold px-4 py-3">Status</th>' +
          '<th class="px-5 py-3"><span class="sr-only">Actions</span></th>' +
        '</tr></thead><tbody>' +
        r.items.map(c =>
          '<tr class="border-b border-line last:border-0">' +
            '<td class="px-5 py-3.5"><code class="font-bold tracking-wide">' + AD.esc(c.code) + '</code></td>' +
            '<td class="px-4 py-3.5 truncate max-w-[220px]">' + AD.esc(c.label) + '</td>' +
            '<td class="px-4 py-3.5 hidden lg:table-cell text-muted truncate max-w-[180px]">' +
              (c.user ? AD.esc(c.user.name) : '—') + '</td>' +
            '<td class="px-4 py-3.5 hidden sm:table-cell text-muted whitespace-nowrap">' + AD.date(c.expiresAt) + '</td>' +
            '<td class="px-4 py-3.5">' + statusBadge(c) + '</td>' +
            '<td class="px-5 py-3.5 text-right whitespace-nowrap">' +
              '<button type="button" class="p-2 rounded-full text-muted hover:text-ink transition" data-copy="' + AD.esc(c.code) + '" aria-label="Copy the code">' + AD.icon('copy', 'w-4 h-4') + '</button>' +
              (c.status === 'revoked' ? '' :
                '<button type="button" class="p-2 rounded-full text-muted hover:text-danger transition" data-revoke="' + c.id + '" aria-label="Revoke the code">' + AD.icon('x', 'w-4 h-4') + '</button>') +
            '</td>' +
          '</tr>').join('') +
        '</tbody></table></div></div>';

      AD.qsa('[data-copy]').forEach(b => b.addEventListener('click', () => {
        navigator.clipboard && navigator.clipboard.writeText(b.getAttribute('data-copy'))
          .then(() => AD.toast('Code copied')).catch(() => AD.toast('Could not copy', 'error'));
      }));
      AD.qsa('[data-revoke]').forEach(b => b.addEventListener('click', async () => {
        if (!await AD.confirm('Revoke this code?', 'It will no longer unlock anything. The action is recorded in the audit log.', 'Revoke')) return;
        try { await AD.post('/admin/codes/' + b.getAttribute('data-revoke') + '/revoke'); AD.toast('Code revoked'); load(); loadBatches(); }
        catch (e) { AD.toast(e.message, 'error'); }
      }));

      const pages = Math.ceil(r.total / r.limit);
      const cur = Math.floor(r.offset / r.limit) + 1;
      AD.qs('#pager').innerHTML = pages > 1
        ? '<button type="button" class="btn btn-ghost btn-sm" data-page="prev" ' + (cur === 1 ? 'disabled' : '') + '>Previous</button>' +
          '<span class="text-[13.5px] font-bold text-muted self-center px-2">Trang ' + cur + '/' + pages + '</span>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-page="next" ' + (cur === pages ? 'disabled' : '') + '>Sau</button>'
        : '';
      AD.qsa('[data-page]').forEach(b => b.addEventListener('click', () => {
        state.offset = Math.max(0, state.offset + (b.getAttribute('data-page') === 'next' ? state.limit : -state.limit));
        load();
      }));
    } catch (e) {
      AD.qs('#list').innerHTML = AD.errorBox(e.message, 'retry');
      AD.qs('#retry').addEventListener('click', load);
    }
  }

  /* ---------- Issuing codes ---------- */
  async function openIssue() {
    const in6mo = new Date(Date.now() + 180 * 86400000).toISOString().slice(0, 10);
    const mm = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">Issue unlock codes</h3>' +
      '<p class="text-muted text-[14px] mt-1.5">Sell a batch to a class, or bind one code to a single account.</p>' +
      '<div class="grid gap-4 mt-5">' +
        /* The plan decides what the holder gets and for how long, so it is asked first.
           There is no silent default: the server refuses a code with no plan outright,
           rather than letting the mistake surface when a student redeems it. */
        '<div><label class="label" for="i-plan">Plan</label>' +
          '<select class="input" id="i-plan">' +
            (PLAN_LIST.length
              ? PLAN_LIST.map(p => '<option value="' + AD.esc(p.id) + '">' +
                  AD.esc(p.name + ' · ' + AD.months(p.months) + ' · ' + p.price.toLocaleString('vi-VN') + 'đ') +
                  '</option>').join('')
              : '<option value="">The price list could not be loaded — reload the page</option>') +
          '</select>' +
          '<p class="help mt-1.5">Sets the term, the number of sittings, and access to self-study.</p></div>' +
        /* A dropdown rather than a row of chips: one line, and it scales as exams grow. */
        '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' +
          '<div><label class="label" for="i-type">What it unlocks</label>' +
            '<select class="input" id="i-type">' +
              '<option value="family">A whole exam</option>' +
              '<option value="test">One specific test</option>' +
              '<option value="bundle">Several exams (combo)</option>' +
            '</select></div>' +
          '<div><label class="label" for="i-mode">Issue to</label>' +
            '<select class="input" id="i-mode">' +
              '<option value="batch">A batch — many codes</option>' +
              '<option value="account">One account — bound to a student</option>' +
            '</select></div>' +
        '</div>' +
        '<div id="ref-box"></div>' +

        /* Batch fields — many codes handed out, redeemed first come. */
        '<div id="batch-box"><div class="grid gap-4">' +
          '<div class="grid grid-cols-2 gap-4">' +
            '<div><label class="label" for="i-qty">How many codes</label>' +
              '<input class="input" id="i-qty" type="number" min="1" max="500" value="10"></div>' +
            '<div><label class="label" for="i-exp">Expires</label>' +
              '<input class="input" id="i-exp" type="date" value="' + in6mo + '"></div>' +
          '</div>' +
          '<div><label class="label" for="i-name">Batch name <span class="font-medium text-muted">(left blank, one is chosen for you)</span></label>' +
            '<input class="input" id="i-name" placeholder="e.g. IELTS class K63, intake 1"></div>' +
        '</div></div>' +

        /* Account fields — one code bound to a named student. */
        '<div id="account-box" class="hidden"><div class="grid gap-4">' +
          '<div><label class="label" for="i-acct-q">Find the account</label>' +
            '<input class="input" id="i-acct-q" type="search" placeholder="Search by email or name…" autocomplete="off">' +
            '<div id="i-acct-results" class="mt-2 grid gap-1.5"></div>' +
            '<p class="help mt-1.5">The account must already exist and have a phone number on file.</p></div>' +
          '<div id="i-acct-chosen" class="hidden"></div>' +
          '<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">' +
            '<div><label class="label" for="i-when">When</label>' +
              '<select class="input" id="i-when">' +
                '<option value="reserve">Reserve it — they activate it</option>' +
                '<option value="now">Activate now — access starts today</option>' +
              '</select></div>' +
            '<div><label class="label" for="i-acct-exp">Activation deadline</label>' +
              '<input class="input" id="i-acct-exp" type="date" value="' + in6mo + '"></div>' +
          '</div>' +
          '<p class="help" id="i-when-help">Reserved: only this account can activate it, and the term starts when they do.</p>' +
        '</div></div>' +

        '<div class="banner banner-error" id="i-err"><span id="i-err-text"></span></div>' +
        '<div class="flex gap-2.5"><button type="button" id="i-go" class="btn btn-primary btn-md flex-1">Issue</button>' +
          '<button type="button" data-close class="btn btn-ghost btn-md">Cancel</button></div>' +
      '</div>', { wide: true });

    const $ = sel => mm.el.querySelector(sel);
    let chosenUser = null;

    /* ----- What it unlocks (family / test / combo) ----- */
    const refBox = $('#ref-box');
    function renderRef() {
      const type = $('#i-type').value;
      if (type === 'family') {
        refBox.innerHTML = '<label class="label" for="i-ref">Exam</label><select class="input" id="i-ref">' +
          families.map(f => '<option value="' + f.id + '">' + AD.esc(f.name) + '</option>').join('') + '</select>';
      } else if (type === 'test') {
        refBox.innerHTML = '<label class="label" for="i-ref">Test</label><select class="input" id="i-ref">' +
          tests.map(t2 => '<option value="' + AD.esc(t2.id) + '">' + AD.esc((t2.familyName || t2.familyId || '').toUpperCase() + ' · ' + t2.title) + '</option>').join('') + '</select>';
      } else {
        refBox.innerHTML = '<p class="label">Choose two or more exams</p><div class="flex flex-wrap gap-2" id="i-bundle">' +
          families.map(f => '<button type="button" class="chip" data-family="' + f.id + '" data-b="' + f.id + '" aria-pressed="false">' + AD.esc(f.name) + '</button>').join('') + '</div>';
        AD.qsa('[data-b]', refBox).forEach(b => b.addEventListener('click', () =>
          b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true')));
      }
    }
    renderRef();
    $('#i-type').addEventListener('change', renderRef);

    /* ----- Batch vs one account ----- */
    function renderMode() {
      const account = $('#i-mode').value === 'account';
      $('#batch-box').classList.toggle('hidden', account);
      $('#account-box').classList.toggle('hidden', !account);
    }
    $('#i-mode').addEventListener('change', renderMode);
    $('#i-when').addEventListener('change', () => {
      $('#i-when-help').textContent = $('#i-when').value === 'now'
        ? 'Activate now: access starts today and runs for the plan’s term.'
        : 'Reserved: only this account can activate it, and the term starts when they do.';
    });

    /* ----- Account picker ----- */
    function showChosen() {
      const box = $('#i-acct-chosen');
      if (!chosenUser) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      box.classList.remove('hidden');
      box.innerHTML =
        '<div class="card bg-brand-soft border-0 p-3 flex items-center gap-3">' +
          '<span class="min-w-0"><b class="block truncate">' + AD.esc(chosenUser.name || chosenUser.email) + '</b>' +
            '<span class="block text-[12.5px] text-muted truncate">' + AD.esc(chosenUser.email) +
              ' · ' + AD.esc(chosenUser.phone || 'no phone') + '</span></span>' +
          '<button type="button" class="btn btn-ghost btn-sm ms-auto shrink-0" id="i-acct-clear">Change</button>' +
        '</div>';
      $('#i-acct-clear').addEventListener('click', () => { chosenUser = null; showChosen(); $('#i-acct-q').focus(); });
    }
    function pick(u) {
      chosenUser = u; $('#i-acct-results').innerHTML = ''; $('#i-acct-q').value = ''; showChosen();
    }
    let searchT = null;
    $('#i-acct-q').addEventListener('input', () => {
      const term = $('#i-acct-q').value.trim();
      clearTimeout(searchT);
      if (term.length < 2) { $('#i-acct-results').innerHTML = ''; return; }
      searchT = setTimeout(async () => {
        try {
          const r = await AD.get('/admin/users?limit=8&q=' + encodeURIComponent(term));
          $('#i-acct-results').innerHTML = r.items.length
            ? r.items.map((u, i) => {
                const ok = !!u.phone;
                return '<button type="button" class="w-full text-left card p-2.5 flex items-center gap-3 ' +
                    (ok ? 'hover:border-brand' : 'opacity-70') + '" ' + (ok ? 'data-pick="' + i + '"' : 'disabled') + '>' +
                  '<span class="min-w-0"><b class="block truncate text-[14px]">' + AD.esc(u.name || u.email) + '</b>' +
                    '<span class="block text-[12px] text-muted truncate">' + AD.esc(u.email) +
                      ' · ' + (ok ? AD.esc(u.phone) : 'no phone — can’t bind') + '</span></span>' +
                  (ok ? '' : '<span class="badge badge-muted ms-auto shrink-0">no phone</span>') +
                '</button>';
              }).join('')
            : '<p class="text-[13px] text-muted px-1">No account matches. They may need to register first.</p>';
          AD.qsa('[data-pick]', $('#i-acct-results')).forEach(btn =>
            btn.addEventListener('click', () => pick(r.items[+btn.getAttribute('data-pick')])));
        } catch (e) {
          $('#i-acct-results').innerHTML = '<p class="text-[13px] text-danger px-1">' + AD.esc(e.message) + '</p>';
        }
      }, 250);
    });

    /* When a code was requested for a specific student (from their page), open
       straight into account mode with them chosen. */
    if (preUser) {
      $('#i-mode').value = 'account'; renderMode();
      try {
        const d = await AD.get('/admin/users/' + preUser);
        pick({ id: d.user.id, name: d.user.name, email: d.user.email, phone: d.user.phone });
        if (!d.user.phone) AD.toast('That account has no phone on file — add one before binding a code', 'error');
      } catch (e) {}
    }

    $('#i-go').addEventListener('click', async () => {
      const err = $('#i-err');
      err.classList.remove('show');
      const fail = msg => { $('#i-err-text').textContent = msg; err.classList.add('show'); };

      const type = $('#i-type').value;
      let ref = '';
      if (type === 'bundle') {
        ref = AD.qsa('[data-b][aria-pressed="true"]', mm.el).map(x => x.getAttribute('data-b')).join(',');
        if (ref.split(',').filter(Boolean).length < 2) return fail('A combo needs at least two exams.');
      } else {
        ref = $('#i-ref').value;
      }

      const account = $('#i-mode').value === 'account';
      const body = { planId: $('#i-plan').value, unlockType: type, unlockRef: ref };
      if (account) {
        if (!chosenUser) return fail('Find and choose the account to bind the code to.');
        if (!chosenUser.phone) return fail('That account has no phone number on file. Add one first.');
        body.userId = chosenUser.id;
        body.qty = 1;
        body.reserve = $('#i-when').value === 'reserve';
        body.expiresAt = $('#i-acct-exp').value;
      } else {
        body.qty = +$('#i-qty').value || 1;
        body.expiresAt = $('#i-exp').value;
        body.batchName = $('#i-name').value;
      }

      const btn = $('#i-go');
      btn.disabled = true;
      btn.innerHTML = AD.icon('loader', 'w-4 h-4 animate-spin-slow') + 'Issuing';
      try {
        const r = await AD.post('/admin/codes', body);
        mm.close();
        showResult(r.created, r.batchId, r.boundTo, r.reserved);
        load(); loadBatches();
      } catch (e) {
        btn.disabled = false; btn.textContent = 'Issue';
        fail(e.message);
      }
    });
  }

  function showResult(codes, batchId, boundTo, reserved) {
    /* One code bound to an account reads differently from a batch: say whose it is
       and whether they still have to activate it, rather than "issued 1 code". */
    const bound = boundTo
      ? '<h3 class="text-lg font-extrabold tracking-tight mt-4">' +
          (reserved ? 'Reserved a code for ' : 'Activated a code for ') + AD.esc(boundTo.name || boundTo.email) + '</h3>' +
        '<p class="text-muted text-[14px] mt-1.5">' +
          (reserved
            ? 'Send it to them — only this account can activate it, and the term starts when they do.'
            : 'Access is on now. Keep the code as their receipt.') + '</p>'
      : '<h3 class="text-lg font-extrabold tracking-tight mt-4">Issued ' + codes.length + ' code' + (codes.length === 1 ? '' : 's') + '</h3>' +
        '<p class="text-muted text-[14px] mt-1.5">Copy them, or download the CSV to send out.</p>';
    const mm = AD.modal(
      '<div class="text-center">' +
        '<span class="w-14 h-14 rounded-full bg-accent-soft text-accent-strong inline-flex items-center justify-center mx-auto">' +
          AD.icon('check', 'w-7 h-7') + '</span>' + bound +
      '</div>' +
      '<pre class="card bg-brand-soft border-0 p-4 mt-5 max-h-52 overflow-y-auto text-[13px] font-bold tracking-wide whitespace-pre-wrap break-all">' +
        AD.esc(codes.join('\n')) + '</pre>' +
      '<div class="flex flex-wrap gap-2.5 mt-5">' +
        '<button type="button" id="r-copy" class="btn btn-primary btn-md flex-1">' + AD.icon('copy', 'w-4 h-4') + (codes.length === 1 ? 'Copy the code' : 'Copy them all') + '</button>' +
        (batchId ? '<a class="btn btn-ghost btn-md" href="/api/admin/codes/export?batch=' + batchId + '">' + AD.icon('download', 'w-4 h-4') + 'Download CSV</a>' : '') +
        '<button type="button" data-close class="btn btn-ghost btn-md">Close</button>' +
      '</div>', { wide: true });
    mm.el.querySelector('#r-copy').addEventListener('click', () => {
      navigator.clipboard && navigator.clipboard.writeText(codes.join('\n'))
        .then(() => AD.toast('Copied ' + codes.length + ' code' + (codes.length === 1 ? '' : 's'))).catch(() => AD.toast('Could not copy', 'error'));
    });
  }

  AD.qs('#btn-issue').addEventListener('click', openIssue);
  AD.qs('#btn-export').addEventListener('click', () => {
    const p = new URLSearchParams();
    if (state.status) p.set('status', state.status);
    if (state.batch) p.set('batch', state.batch);
    location.href = '/api/admin/codes/export?' + p;
  });

  if (preUser) {
    AD.toast('Issuing a code for the selected student');
    openIssue();
  }
  loadBatches();
  load();
})();
</script>
</body>
</html>
