<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tổng quan · Quản trị VPET Prep</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/pjs-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="reports" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-8" id="page">

      <!-- Chọn kỳ báo cáo -->
      <div class="flex flex-wrap items-center gap-3">
        <span class="text-[13px] font-bold text-muted">Kỳ báo cáo</span>
        <div id="period" class="flex gap-1.5" role="group" aria-label="Chọn kỳ báo cáo">
          <button type="button" class="chip" data-days="7">7 ngày</button>
          <button type="button" class="chip" data-days="30" aria-current="page">30 ngày</button>
          <button type="button" class="chip" data-days="90">90 ngày</button>
        </div>
        <span id="period-note" class="text-[12.5px] text-muted font-medium ms-auto"></span>
      </div>

      <div id="loading" class="mt-6">
        <div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-5">
          <div class="card p-5"><div class="skeleton h-4 w-24 mb-4"></div><div class="skeleton h-8 w-20 mb-3"></div><div class="skeleton h-3 w-28"></div></div>
          <div class="card p-5"><div class="skeleton h-4 w-24 mb-4"></div><div class="skeleton h-8 w-20 mb-3"></div><div class="skeleton h-3 w-28"></div></div>
          <div class="card p-5 hidden sm:block"><div class="skeleton h-4 w-24 mb-4"></div><div class="skeleton h-8 w-20 mb-3"></div><div class="skeleton h-3 w-28"></div></div>
          <div class="card p-5 hidden xl:block"><div class="skeleton h-4 w-24 mb-4"></div><div class="skeleton h-8 w-20 mb-3"></div><div class="skeleton h-3 w-28"></div></div>
        </div>
        <div class="card p-6 mt-6"><div class="skeleton h-5 w-40 mb-6"></div><div class="skeleton h-44 w-full"></div></div>
      </div>
      <div id="content" hidden class="mt-6"></div>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
(async () => {
  await AD.mount({ title: 'Tổng quan', subtitle: 'Việc cần làm, tăng trưởng, phễu học viên và nội dung' });

  const KY = { 7: '7 ngày', 30: '30 ngày', 90: '90 ngày' };
  let days = 30;

  /* ---------- Ô chỉ số, kèm so sánh với kỳ trước ---------- */
  function delta(k) {
    if (k.delta === null) {
      return '<span class="text-[12.5px] text-muted font-semibold">kỳ trước chưa có số</span>';
    }
    const len = k.delta === 0 ? 'khong' : (k.delta > 0 ? 'tang' : 'giam');
    const mui = k.delta > 0 ? '▲' : (k.delta < 0 ? '▼' : '■');
    return '<span class="delta delta-' + len + '">' + mui + ' ' + Math.abs(k.delta) + '%</span>';
  }

  const stat = (label, value, k, sub, icon, tone) =>
    '<div class="card p-5">' +
      '<div class="flex items-start justify-between gap-3">' +
        '<span class="text-[12.5px] font-bold uppercase tracking-wide text-muted">' + AD.esc(label) + '</span>' +
        '<span class="w-9 h-9 rounded-xl inline-flex items-center justify-center shrink-0 ' +
          (tone === 'accent' ? 'bg-accent-soft text-accent-strong' : 'bg-brand-soft text-brand-strong') + '">' +
          AD.icon(icon, 'w-[18px] h-[18px]') + '</span>' +
      '</div>' +
      '<p class="text-[30px] font-extrabold tracking-tight leading-none mt-3">' + AD.esc(value) + '</p>' +
      '<div class="flex flex-wrap items-center gap-x-2 gap-y-1 mt-2">' +
        (k ? delta(k) : '') +
        '<span class="text-[12.5px] text-muted font-medium">' + AD.esc(sub) + '</span>' +
      '</div>' +
    '</div>';

  /* ---------- Biểu đồ cột (SVG nội bộ, không thư viện) ---------- */
  function chart(series, key, color) {
    const w = 720, h = 170, pad = 26, n = series.length;
    const max = Math.max(1, ...series.map(s => s[key]));
    const bw = (w - pad * 2) / n;
    const buoc = Math.max(1, Math.round(n / 6));   // 90 ngày thì nhãn thưa ra
    const bars = series.map((s, i) => {
      const bh = Math.round((s[key] / max) * (h - pad * 2));
      const x = pad + i * bw + bw * 0.18;
      const y = h - pad - bh;
      return '<rect x="' + x.toFixed(1) + '" y="' + (bh ? y : h - pad - 2) + '" width="' + Math.max(bw * 0.64, 1.2).toFixed(1) +
        '" height="' + Math.max(bh, 2) + '" rx="2" fill="' + color + '" opacity="' + (bh ? 1 : .28) + '">' +
        '<title>' + s.day + ': ' + s[key] + '</title></rect>';
    }).join('');
    const labels = series.map((s, i) =>
      (i % buoc === 0 || i === n - 1)
        ? '<text x="' + (pad + i * bw + bw / 2).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle" ' +
          'font-size="10" fill="var(--color-muted)">' + s.day.slice(8) + '/' + s.day.slice(5, 7) + '</text>'
        : '').join('');
    return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="w-full" role="img" aria-label="Biểu đồ hoạt động theo ngày">' +
      '<line x1="' + pad + '" y1="' + (h - pad) + '" x2="' + (w - pad) + '" y2="' + (h - pad) +
      '" stroke="var(--color-border)" stroke-width="1.5"/>' + bars + labels +
      '<text x="' + pad + '" y="16" font-size="11" font-weight="700" fill="var(--color-muted)">Cao nhất: ' + max + '</text>' +
      '</svg>';
  }

  /* ---------- Việc cần làm ---------- */
  const SEV_NHAN = { cao: 'Khẩn', vua: 'Nên làm', thap: 'Dọn dẹp' };
  const SEV_BADGE = { cao: 'badge-danger', vua: 'badge-hl', thap: 'badge-muted' };

  function todoList(todo) {
    if (!todo.length) {
      return '<div class="flex items-start gap-3">' +
        '<span class="w-9 h-9 rounded-full bg-accent-soft text-accent-strong shrink-0 inline-flex items-center justify-center">' +
          AD.icon('check', 'w-[18px] h-[18px]') + '</span>' +
        '<p class="text-[14.5px] text-muted leading-relaxed">Không có việc nào đang chờ. Nội dung đủ, code còn hạn, học viên không ai bị kẹt.</p>' +
      '</div>';
    }
    return '<ul class="grid gap-3">' + todo.map(t =>
      '<li class="rounded-xl border border-line px-4 py-3.5">' +
        '<div class="flex flex-wrap items-center gap-2">' +
          '<span class="badge ' + SEV_BADGE[t.sev] + '">' + SEV_NHAN[t.sev] + '</span>' +
          '<b class="text-[14.5px] font-extrabold tracking-tight">' + AD.esc(t.title) + '</b>' +
        '</div>' +
        '<p class="text-[13px] text-muted font-medium mt-1.5">' + AD.esc(t.detail) + '</p>' +
        '<a href="' + AD.esc(t.href) + '" class="inline-flex items-center gap-1 text-[13px] font-bold text-brand-strong hover:underline mt-2">' +
          AD.esc(t.cta) + AD.icon('arrowRight', 'w-4 h-4') + '</a>' +
      '</li>').join('') + '</ul>';
  }

  /* ---------- Phễu học viên ---------- */
  function funnelBlock(funnel) {
    const dau = funnel[0].value || 1;
    return '<ul class="grid gap-3.5">' + funnel.map((s, i) => {
      const rong = Math.max(3, Math.round((s.value / dau) * 100));
      const roi = i > 0 ? funnel[i - 1].value - s.value : 0;
      return '<li>' +
        '<div class="flex flex-wrap items-baseline gap-x-2 text-[13.5px]">' +
          '<span class="font-semibold">' + AD.esc(s.label) + '</span>' +
          '<b class="ms-auto font-extrabold">' + AD.num(s.value) + '</b>' +
          '<span class="text-muted font-semibold w-11 text-right">' + s.rate + '%</span>' +
        '</div>' +
        '<div class="h-2 rounded-full bg-line mt-1.5 overflow-hidden">' +
          '<div class="h-full rounded-full bg-brand funnel-bar" data-w="' + rong + '"></div>' +
        '</div>' +
        (roi > 0
          ? '<p class="text-[12px] text-muted font-medium mt-1">rơi mất ' + AD.num(roi) + ' ở bước này</p>'
          : '') +
      '</li>';
    }).join('') + '</ul>';
  }

  /* ---------- Vẽ lại toàn trang theo kỳ đang chọn ---------- */
  async function render() {
    AD.qs('#loading').hidden = false;
    AD.qs('#content').hidden = true;

    let d;
    try {
      d = await AD.get('/admin/reports?days=' + days);
    } catch (e) {
      AD.qs('#loading').hidden = true;
      AD.qs('#content').hidden = false;
      AD.qs('#content').innerHTML = AD.errorBox(e.message, 'retry');
      AD.qs('#retry').addEventListener('click', () => render());
      return;
    }

    const nhan = KY[days];
    AD.qs('#period-note').textContent = 'So với ' + nhan + ' liền trước';

    const famRows = d.byFamily.map(f =>
      '<tr class="border-b border-line last:border-0">' +
        '<td class="px-5 py-3.5"><span class="exam-chip" data-family="' + f.id + '">' + AD.esc(f.name) + '</span></td>' +
        '<td class="px-4 py-3.5 text-right font-bold">' + AD.num(f.published) +
          (f.tests > f.published
            ? '<span class="text-muted font-semibold"> /' + AD.num(f.tests) + '</span>'
            : '') + '</td>' +
        '<td class="px-4 py-3.5 text-right font-bold">' + AD.num(f.questions) + '</td>' +
        '<td class="px-4 py-3.5 text-right font-bold">' + AD.num(f.unlocks) + '</td>' +
        '<td class="px-5 py-3.5 text-right font-bold">' + AD.num(f.interested) +
          (f.interested > 0 && f.published === 0
            ? ' <span class="badge badge-danger">chưa có đề</span>'
            : '') + '</td>' +
      '</tr>').join('');

    const goi = d.revenueByPackage.length
      ? '<ul class="grid gap-2.5">' + d.revenueByPackage.map(g =>
          '<li class="flex items-center gap-3 text-[14px]">' +
            '<span class="min-w-0 flex-1 truncate font-semibold">' + AD.esc(g.name) + '</span>' +
            '<span class="text-muted font-semibold shrink-0">' + g.orders + ' đơn</span>' +
            '<b class="shrink-0 w-24 text-right">' + AD.vnd(g.amount) + '</b>' +
          '</li>').join('') + '</ul>'
      : '<p class="text-[14px] text-muted">Chưa có đơn nào trong ' + nhan + ' qua.</p>';

    const recent = d.recent.length
      ? '<ul class="grid gap-3">' + d.recent.map(r =>
          '<li class="flex gap-3 text-[13.5px]">' +
            '<span class="w-2 h-2 rounded-full bg-accent mt-1.5 shrink-0"></span>' +
            '<span class="min-w-0"><b class="font-semibold">' + AD.esc(r.action) + '</b>' +
              (r.target ? ' <span class="text-muted">' + AD.esc(r.target) + '</span>' : '') +
              '<span class="block text-muted text-[12.5px] mt-0.5">' + AD.esc(r.admin_name || '—') +
              ' · ' + AD.ago(r.at) + '</span></span>' +
          '</li>').join('') + '</ul>'
      : '<p class="text-[14px] text-muted">Chưa có thao tác nào được ghi nhận.</p>';

    const tongUsers = d.series.reduce((a, s) => a + s.users, 0);
    const tongRedeems = d.series.reduce((a, s) => a + s.redeems, 0);
    const soKhan = d.todo.filter(t => t.sev === 'cao').length;

    AD.qs('#content').innerHTML =
      '<div class="grid sm:grid-cols-2 xl:grid-cols-4 gap-5">' +
        stat('Học viên mới', AD.num(d.kpi.users.value), d.kpi.users,
          'tổng ' + AD.num(d.users.total) + ' · ' + d.users.verified + ' đã xác thực', 'users') +
        stat('Code kích hoạt', AD.num(d.kpi.redeems.value), d.kpi.redeems,
          d.codes.unused + ' chưa dùng', 'ticket', 'accent') +
        stat('Doanh thu', AD.vnd(d.kpi.revenue.value), d.kpi.revenue,
          d.kpi.orders.value + ' đơn trong kỳ', 'wallet', 'accent') +
        stat('Nội dung', AD.num(d.content.published), null,
          'đề đang phát hành · ' + d.content.draft + ' nháp · ' + AD.num(d.content.questions) + ' câu hỏi', 'fileText') +
      '</div>' +

      /* Hai cột xếp chồng độc lập nhau. Nếu để cả sáu thẻ trong một lưới thì
         các thẻ phải canh theo hàng, thẻ ngắn bên này sẽ chừa ra một khoảng
         trống bằng chiều cao thẻ dài bên kia. */
      /* Hai cột xếp chồng ĐỘC LẬP nhau. Nếu để cả sáu thẻ chung một lưới thì
         chúng phải canh theo hàng: thẻ ngắn bên này chừa ra khoảng trống đúng
         bằng chiều cao thẻ dài bên kia. Tách hai cột thì mỗi bên tự dồn lên. */
      '<div class="grid lg:grid-cols-12 gap-6 mt-6 items-start">' +

        /* ---- Cột trái: điều hành ---- */
        '<div class="lg:col-span-5 grid gap-6 content-start">' +

          '<section class="card p-6" aria-labelledby="h-todo">' +
            '<div class="flex flex-wrap items-baseline gap-2 mb-4">' +
              '<h2 id="h-todo" class="text-lg font-extrabold tracking-tight">Việc cần làm</h2>' +
              (soKhan ? '<span class="badge badge-danger">' + soKhan + ' khẩn</span>' : '') +
            '</div>' + todoList(d.todo) +
          '</section>' +

          '<section class="card p-6" aria-labelledby="h-funnel">' +
            '<h2 id="h-funnel" class="text-lg font-extrabold tracking-tight">Phễu học viên</h2>' +
            '<p class="text-[13.5px] text-muted mt-1 mb-4">Tỷ lệ tính trên tổng số đã đăng ký</p>' +
            funnelBlock(d.funnel) +
          '</section>' +

          '<section class="card p-6" aria-labelledby="h-pkg">' +
            '<div class="flex items-baseline gap-3 mb-4">' +
              '<h2 id="h-pkg" class="text-lg font-extrabold tracking-tight">Doanh thu theo gói</h2>' +
              '<a href="/admin/quan-tri/" class="ms-auto text-[13px] font-bold text-brand-strong hover:underline">Sửa giá</a>' +
            '</div>' + goi +
          '</section>' +

        '</div>' +

        /* ---- Cột phải: số liệu ---- */
        '<div class="lg:col-span-7 grid gap-6 content-start">' +

          '<section class="card p-6" aria-labelledby="h-chart">' +
            '<div class="flex flex-wrap items-baseline gap-3">' +
              '<h2 id="h-chart" class="text-lg font-extrabold tracking-tight">Hoạt động ' + nhan + '</h2>' +
              '<div class="ms-auto flex gap-1.5" role="group" aria-label="Chọn chỉ số">' +
                '<button type="button" class="chip" data-metric="users" aria-pressed="true">Học viên (' + tongUsers + ')</button>' +
                '<button type="button" class="chip" data-metric="redeems" aria-pressed="false">Code (' + tongRedeems + ')</button>' +
                '<button type="button" class="chip" data-metric="revenue" aria-pressed="false">Doanh thu</button>' +
              '</div>' +
            '</div>' +
            '<div id="chart" class="mt-5"></div>' +
          '</section>' +

          '<section class="card overflow-hidden" aria-labelledby="h-fam">' +
            '<h2 id="h-fam" class="text-lg font-extrabold tracking-tight px-6 pt-6 pb-4">Cung và cầu theo kỳ thi</h2>' +
            '<div class="overflow-x-auto"><table class="w-full text-[14px]">' +
              '<thead><tr class="text-[12px] uppercase tracking-wide text-muted border-y border-line bg-surface">' +
                '<th class="text-left font-bold px-5 py-3">Kỳ thi</th>' +
                '<th class="text-right font-bold px-4 py-3">Đề phát hành</th>' +
                '<th class="text-right font-bold px-4 py-3">Câu hỏi</th>' +
                '<th class="text-right font-bold px-4 py-3">Code đã dùng</th>' +
                '<th class="text-right font-bold px-5 py-3">Quan tâm</th>' +
              '</tr></thead><tbody>' + famRows + '</tbody>' +
            '</table></div>' +
          '</section>' +

          '<section class="card p-6" aria-labelledby="h-recent">' +
            '<div class="flex items-baseline gap-3 mb-4">' +
              '<h2 id="h-recent" class="text-lg font-extrabold tracking-tight">Thao tác gần đây</h2>' +
              '<a href="/admin/quan-tri/#nhat-ky" class="ms-auto text-[13px] font-bold text-brand-strong hover:underline">Nhật ký</a>' +
            '</div>' + recent +
          '</section>' +

        '</div>' +
      '</div>';

    AD.qs('#loading').hidden = true;
    AD.qs('#content').hidden = false;

    // Bề rộng thanh phễu đặt bằng CSS custom property, không dùng style="" (CSP chặn)
    AD.qsa('.funnel-bar').forEach(b => b.style.setProperty('--w', b.getAttribute('data-w') + '%'));

    const mau = { users: 'var(--color-primary)', redeems: 'var(--color-accent)', revenue: 'var(--color-primary)' };
    const ve = key => { AD.qs('#chart').innerHTML = chart(d.series, key, mau[key]); };
    ve('users');
    AD.qsa('[data-metric]').forEach(b => b.addEventListener('click', () => {
      AD.qsa('[data-metric]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      ve(b.getAttribute('data-metric'));
    }));
  }

  AD.qsa('#period [data-days]').forEach(b => b.addEventListener('click', () => {
    days = Number(b.getAttribute('data-days'));
    AD.qsa('#period [data-days]').forEach(x =>
      x === b ? x.setAttribute('aria-current', 'page') : x.removeAttribute('aria-current'));
    render();
  }));

  render();
})();
</script>
</body>
</html>
