<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test builder · VPET Prep admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
  <!-- Song ngữ: đặt ngôn ngữ (mặc định tiếng Việt) trước khi vẽ trang -->
  <script src="/i18n.js"></script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="tests" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-10">
      <a href="/admin/de-thi/" class="inline-flex items-center gap-1.5 text-sm font-bold text-muted hover:text-ink transition mb-5" id="back">Back to the test list</a>
      <div id="page">
        <div class="card p-5 grid gap-3.5">
          <div class="skeleton h-7 w-1/2"></div><div class="skeleton h-5 w-1/3"></div><div class="skeleton h-40 w-full"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
(async () => {
  await AD.mount({ title: 'Test builder', subtitle: 'Adjust the structure and choose questions for each part' });
  AD.qs('#back').insertAdjacentHTML('afterbegin', AD.icon('chevronLeft', 'w-4 h-4'));

  const m = location.pathname.match(/\/admin\/de-thi\/([^/]+)\/?/);
  const testId = m ? decodeURIComponent(m[1]) : '';
  let T = null;
  let FAM_PARTS = null;

  async function load() {
    try {
      T = await AD.get('/admin/tests/' + encodeURIComponent(testId));
      /* This exam's part table, so a hand-added part can carry a letter too - without
      one, a later reshuffle draws from the whole skill instead of the part. */
      if (!FAM_PARTS) {
        try {
          const cat = await AD.get('/catalog');
          FAM_PARTS = ((cat.families.find(f => f.id === T.familyId) || {}).parts) || [];
        } catch (e) { FAM_PARTS = []; }
      }
      render();
    } catch (e) {
      AD.qs('#page').innerHTML = AD.errorBox(e.message, 'retry');
      AD.qs('#retry').addEventListener('click', load);
    }
  }

  const statusBadge = s => s === 'published'
    ? '<span class="badge badge-ok">Published</span>'
    : s === 'draft' ? '<span class="badge badge-hl">Draft</span>'
    : '<span class="badge badge-muted">Archived</span>';

  function render() {
    document.title = T.title + ' · VPET Prep admin';

    const readiness = T.sections.length
      ? T.sections.filter(s => s.items.length).length + '/' + T.sections.length + ' parts have questions'
      : 'no parts yet';

    AD.qs('#page-actions').innerHTML =
      (T.status === 'published'
        ? '<button type="button" id="btn-unpublish" class="btn btn-ghost btn-sm">Unpublish</button>'
        : '<button type="button" id="btn-publish" class="btn btn-primary btn-sm">' + AD.icon('check', 'w-4 h-4') + 'Publish</button>');

    AD.qs('#page').innerHTML =
      '<header class="flex flex-wrap items-start gap-4">' +
        '<div class="min-w-0">' +
          '<div class="flex flex-wrap items-center gap-2">' +
            '<span class="exam-chip" data-family="' + T.familyId + '">' + AD.esc(T.familyId.toUpperCase()) + '</span>' +
            '<span class="badge badge-muted">' + AD.esc(T.level) + '</span>' +
            statusBadge(T.status) +
            (T.buildMode === 'auto' ? '<span class="badge badge-muted">Generated</span>' : '') +
          '</div>' +
          '<h2 class="text-2xl font-extrabold tracking-tight mt-3">' + AD.esc(T.title) + '</h2>' +
          '<p class="text-[14px] font-semibold text-muted mt-2">' +
            T.sections.length + ' parts · ' + T.totalItems + ' items · ' + T.durationMin + ' min · ' + readiness + '</p>' +
        '</div>' +
        '<button type="button" id="btn-meta" class="btn btn-ghost btn-md ms-auto">' + AD.icon('edit', 'w-4 h-4') + 'Edit details</button>' +
      '</header>' +

      '<div class="grid gap-5 mt-7" id="sections"></div>' +

      '<button type="button" id="btn-add-section" class="card card-locked card-hover w-full p-5 mt-5 flex items-center justify-center gap-2.5 font-bold text-[15px]">' +
        AD.icon('plus', 'w-5 h-5') + 'Add a part</button>';

    AD.qs('#sections').innerHTML = T.sections.length
      ? T.sections.map(sectionCard).join('')
      : '<div class="card p-10 text-center"><p class="text-muted text-[15px]">This test has no parts yet. Add the first one to get started.</p></div>';

    wire();
  }

  function sectionCard(s) {
    const rows = s.items.length
      ? s.items.map((it, i) =>
          '<li class="flex items-start gap-3 py-2.5 border-b border-line last:border-0">' +
            '<span class="w-6 text-[13px] font-bold text-muted shrink-0 pt-0.5">' + (i + 1) + '</span>' +
            '<span class="min-w-0 flex-1">' +
              '<span class="block text-[14px] leading-snug">' + AD.esc(it.prompt) + '</span>' +
              '<span class="block text-[12px] text-muted font-semibold mt-1">' +
                AD.esc(AD.TYPE_LABEL[it.type] || it.type) + ' · ' + AD.esc(it.level) +
                (it.status !== 'active' ? ' · <span class="text-danger">item withdrawn</span>' : '') + '</span>' +
            '</span>' +
            '<button type="button" class="p-1.5 rounded-full text-muted hover:text-danger transition shrink-0" ' +
              'data-del-item="' + it.itemId + '" aria-label="Remove this item from the part">' + AD.icon('x', 'w-4 h-4') + '</button>' +
          '</li>').join('')
      : '<li class="py-6 text-center text-[14px] text-muted">This part has no questions yet.</li>';

    return '<section class="card overflow-hidden" data-section="' + s.id + '">' +
      '<div class="flex flex-wrap items-center gap-3 px-5 py-4 border-b border-line bg-surface">' +
        '<span class="w-9 h-9 rounded-xl bg-brand-soft text-brand-strong inline-flex items-center justify-center shrink-0">' +
          AD.icon('layers', 'w-[18px] h-[18px]') + '</span>' +
        '<span class="min-w-0">' +
          '<b class="block">' + AD.esc(s.name) +
            (s.part ? ' <span class="badge badge-ok align-middle">Part ' + AD.esc(s.part) + '</span>' : '') + '</b>' +
          '<span class="block text-[13px] text-muted font-semibold">' +
            AD.esc(AD.SKILL_LABEL[s.skill] || s.skill) + ' · ' + AD.esc(s.type) + ' · ' + s.minutes + ' min · ' +
            s.items.length + ' items</span>' +
        '</span>' +
        '<div class="ms-auto flex flex-wrap gap-2">' +
          '<button type="button" class="btn btn-soft btn-sm" data-write="' + s.id + '">' + AD.icon('edit', 'w-4 h-4') + 'Write items</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-pick="' + s.id + '">' + AD.icon('plus', 'w-4 h-4') + 'Choose items</button>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-shuffle="' + s.id + '">' + AD.icon('shuffle', 'w-4 h-4') + '<span class="hidden sm:inline">Redraw</span></button>' +
          '<button type="button" class="btn btn-ghost btn-sm text-danger" data-del-section="' + s.id + '" aria-label="Delete the part ' + AD.esc(s.name) + '">' + AD.icon('trash', 'w-4 h-4') + '</button>' +
        '</div>' +
      '</div>' +
      '<ul class="px-5 py-1 max-h-[340px] overflow-y-auto">' + rows + '</ul>' +
    '</section>';
  }

  function wire() {
    const pub = AD.qs('#btn-publish'), unpub = AD.qs('#btn-unpublish');
    if (pub) pub.addEventListener('click', () => setStatus('published'));
    if (unpub) unpub.addEventListener('click', () => setStatus('draft'));
    AD.qs('#btn-meta').addEventListener('click', editMeta);
    AD.qs('#btn-add-section').addEventListener('click', addSection);

    AD.qsa('[data-write]').forEach(b => b.addEventListener('click', () => writeItems(+b.getAttribute('data-write'))));
    AD.qsa('[data-pick]').forEach(b => b.addEventListener('click', () => pickQuestions(+b.getAttribute('data-pick'))));
    AD.qsa('[data-shuffle]').forEach(b => b.addEventListener('click', () => reshuffle(+b.getAttribute('data-shuffle'))));
    AD.qsa('[data-del-section]').forEach(b => b.addEventListener('click', () => delSection(+b.getAttribute('data-del-section'))));
    AD.qsa('[data-del-item]').forEach(b => b.addEventListener('click', async () => {
      try { await AD.del('/admin/items/' + b.getAttribute('data-del-item')); await load(); }
      catch (e) { AD.toast(e.message, 'error'); }
    }));
  }

  async function setStatus(status) {
    try {
      await AD.post('/admin/tests/' + encodeURIComponent(testId) + '/status', { status });
      AD.toast(status === 'published' ? 'The test is published to students' : 'Moved back to draft');
      await load();
    } catch (e) { AD.toast(e.message, 'error'); }
  }

  function editMeta() {
    const mm = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">Test details</h3>' +
      '<div class="grid gap-4 mt-5">' +
        '<div><label class="label" for="e-title">Test name</label><input class="input" id="e-title" value="' + AD.esc(T.title) + '"></div>' +
        '<div class="grid grid-cols-2 gap-4">' +
          '<div><label class="label" for="e-level">Level</label><select class="input" id="e-level">' +
            ['A1','A2','B1','B2','C1','C2'].map(l => '<option ' + (l === T.level ? 'selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="e-dur">Duration (minutes)</label>' +
            '<input class="input" id="e-dur" type="number" min="0" max="600" value="' + T.durationMin + '"></div>' +
        '</div>' +
        '<div><label class="label" for="e-scoring">How it is marked</label>' +
          '<input class="input" id="e-scoring" value="' + AD.esc(T.scoring) + '" placeholder="e.g. Band 0-9, rounded to 0.5"></div>' +
        '<div><label class="label" for="e-guide">Instructions (one per line)</label>' +
          '<textarea class="input" id="e-guide" rows="4">' + AD.esc((T.guide || []).join('\n')) + '</textarea></div>' +
        '<div class="banner banner-error" id="e-err"><span id="e-err-text"></span></div>' +
        '<div class="flex gap-2.5"><button type="button" id="e-save" class="btn btn-primary btn-md flex-1">Save</button>' +
          '<button type="button" data-close class="btn btn-ghost btn-md">Cancel</button></div>' +
      '</div>');
    mm.el.querySelector('#e-save').addEventListener('click', async () => {
      const err = mm.el.querySelector('#e-err');
      err.classList.remove('show');
      try {
        await AD.put('/admin/tests/' + encodeURIComponent(testId), {
          title: mm.el.querySelector('#e-title').value,
          level: mm.el.querySelector('#e-level').value,
          durationMin: +mm.el.querySelector('#e-dur').value || 0,
          scoring: mm.el.querySelector('#e-scoring').value,
          guide: mm.el.querySelector('#e-guide').value.split('\n').map(s => s.trim()).filter(Boolean)
        });
        mm.close(); AD.toast('Test details saved'); await load();
      } catch (e) {
        mm.el.querySelector('#e-err-text').textContent = e.message;
        err.classList.add('show');
      }
    });
  }

  /* ============================================================
     Writing items where the part is being built

     Until now a part could only be filled from the bank, so building a paper
     meant: leave the builder, write the items on the bank screen, come back,
     find them again in the picker. Once per part, on every paper.

     The composer below is the same form, minus the four fields the part has
     already answered — the exam comes from the paper, the skill and the letter
     from the part, the level from the paper. What is left is the text, the
     options and the key, which is the part a person actually has to type.

     Items written here are ordinary bank rows. Nothing about them is special,
     and that is the point: a redraw, the shortage report and the bank screen
     all keep working on them afterwards.
     ============================================================ */
  const ALL_TYPES = ['mcq', 'gap', 'essay', 'speaking'];
  const AUDIO_SKILLS = ['listening', 'speaking'];

  function questionComposer() {
    /* The context is read through setContext rather than captured, because in
       the add-a-part dialog the skill and the part are still being chosen while
       items are already being typed. */
    let ctx = { skill: 'listening', part: '' };
    let seq = 0;
    let listEl = null;

    /* A lettered part limits what it will take; a part with no letter takes
       anything, because nothing constrains it. */
    const typesAllowed = () => {
      const p = ctx.part && FAM_PARTS ? FAM_PARTS.find(x => x.part === ctx.part) : null;
      return (p && p.types && p.types.length) ? p.types : ALL_TYPES;
    };

    /* No heading, no count, no explanation. The rows say what they are, the
       submit button already carries the count, and each row grows its own MP3
       control when the skill needs one — four lines of prose above all that were
       telling the operator things the form was about to show them anyway. */
    const html =
      '<div class="mt-1">' +
        '<div id="c-list" class="grid gap-2.5"></div>' +
        '<button type="button" id="c-add" class="btn btn-soft btn-sm mt-2.5">Add a question</button>' +
      '</div>';

    function answerBox(key, type) {
      if (type === 'mcq') {
        return '<div class="grid gap-1.5 mt-2">' +
          [0, 1, 2, 3].map(i =>
            '<label class="flex items-center gap-2.5">' +
              '<input type="radio" name="ans-' + key + '" data-ans="' + i + '" ' +
                'class="w-4 h-4 accent-[color:var(--color-accent)] shrink-0" ' +
                'aria-label="Option ' + (i + 1) + ' is the correct answer">' +
              '<input class="input py-1.5 text-[14px]" data-opt="' + i + '" ' +
                'placeholder="Option ' + (i + 1) + '" aria-label="Option ' + (i + 1) + '">' +
            '</label>').join('') +
          '</div>';
      }
      if (type === 'gap') {
        return '<div class="mt-2">' +
          '<input class="input py-1.5 text-[14px]" data-key ' +
            'placeholder="Answer key — write color|colour to accept either" aria-label="Answer key">' +
          '</div>';
      }
      return '<p class="help mt-2">Marked by the AI examiner, so it takes no answer key.</p>';
    }

    function renumber() {
      AD.qsa('[data-row]', listEl).forEach((r, i) => {
        r.querySelector('[data-num]').textContent = String(i + 1);
      });
    }

    function addRow() {
      const key = 'q' + (++seq);
      const types = typesAllowed();
      /* A new row copies the type of the one above it: a part is nearly always
         one type all the way down, and re-picking it every time is the kind of
         small friction that makes people go back to the bank screen. */
      const last = listEl.lastElementChild;
      const prev = last ? last.querySelector('[data-type]').value : '';
      const type = types.includes(prev) ? prev : types[0];

      const row = document.createElement('div');
      row.className = 'rounded-xl border border-line p-3 bg-surface';
      row.setAttribute('data-row', key);
      row.innerHTML =
        '<div class="flex items-center gap-2">' +
          '<span class="w-6 text-[13px] font-bold text-muted shrink-0" data-num>1</span>' +
          '<select class="input w-auto py-1.5 text-[13px]" data-type aria-label="Item type">' +
            types.map(t => '<option value="' + t + '"' + (t === type ? ' selected' : '') + '>' +
              AD.esc(AD.TYPE_LABEL[t] || t) + '</option>').join('') +
          '</select>' +
          '<button type="button" class="ms-auto p-1.5 rounded-full text-muted hover:text-danger transition" ' +
            'data-drop aria-label="Remove this question">' + AD.icon('x', 'w-4 h-4') + '</button>' +
        '</div>' +
        '<textarea class="input mt-2 py-1.5 text-[14px]" rows="2" data-prompt ' +
          'placeholder="Question text" aria-label="Question text"></textarea>' +
        '<div data-answers>' + answerBox(key, type) + '</div>' +
        '<label class="mt-2 flex items-center gap-2 text-[13px] font-semibold text-muted" data-audio-row hidden>' +
          '<span class="btn btn-ghost btn-sm cursor-pointer">Attach MP3</span>' +
          '<input type="file" accept="audio/mpeg" class="sr-only" data-audio>' +
          '<span data-audio-name>no file</span>' +
        '</label>';

      listEl.appendChild(row);
      row.querySelector('[data-drop]').addEventListener('click', () => { row.remove(); renumber(); });
      row.querySelector('[data-type]').addEventListener('change', e => {
        row.querySelector('[data-answers]').innerHTML = answerBox(key, e.target.value);
      });
      const file = row.querySelector('[data-audio]');
      file.addEventListener('change', () => {
        row.querySelector('[data-audio-name]').textContent =
          file.files && file.files[0] ? file.files[0].name : 'no file';
      });
      syncAudio(row);
      renumber();
      row.querySelector('[data-prompt]').focus();
    }

    function syncAudio(row) {
      const on = AUDIO_SKILLS.includes(ctx.skill);
      row.querySelector('[data-audio-row]').hidden = !on;
      if (!on) row.querySelector('[data-audio]').value = '';
    }

    /* The skill or the part changed under rows that are already typed. Keep the
       text, and move the type only if the new part will not take the old one —
       redrawing the answer box on every context change would throw away four
       options somebody had already written. */
    function setContext(next) {
      ctx = Object.assign({}, ctx, next);
      if (!listEl) return;
      const types = typesAllowed();
      AD.qsa('[data-row]', listEl).forEach(row => {
        const sel = row.querySelector('[data-type]');
        const before = sel.value;
        const keep = types.includes(before) ? before : types[0];
        sel.innerHTML = types.map(t => '<option value="' + t + '"' + (t === keep ? ' selected' : '') + '>' +
          AD.esc(AD.TYPE_LABEL[t] || t) + '</option>').join('');
        if (keep !== before) {
          row.querySelector('[data-answers]').innerHTML = answerBox(row.getAttribute('data-row'), keep);
        }
        syncAudio(row);
      });
    }

    function mount(root, next) {
      listEl = root.querySelector('#c-list');
      root.querySelector('#c-add').addEventListener('click', addRow);
      setContext(next || {});
    }

    /** What was typed, plus the row element for each — so an error can point at one. */
    function read() {
      return AD.qsa('[data-row]', listEl).map(row => {
        const type = row.querySelector('[data-type]').value;
        const opts = AD.qsa('[data-opt]', row).map(i => i.value.trim());
        const ansIdx = AD.qsa('[data-ans]', row).findIndex(x => x.checked);
        const keyEl = row.querySelector('[data-key]');
        const fileEl = row.querySelector('[data-audio]');
        return {
          row,
          type,
          prompt: row.querySelector('[data-prompt]').value.trim(),
          options: type === 'mcq' ? opts.filter(Boolean) : [],
          answer: type === 'mcq' ? (ansIdx >= 0 ? opts[ansIdx] : '') : (keyEl ? keyEl.value.trim() : ''),
          file: (fileEl && fileEl.files && fileEl.files[0]) || null
        };
      });
    }

    /* Checked here as well as on the server, so a typo comes back on the row that
       has it rather than as one line above a list of eight. The server is still
       the one that decides. */
    function firstProblem(list) {
      for (let i = 0; i < list.length; i++) {
        const it = list[i];
        const at = AD.t('Question ', 'Câu ') + (i + 1) + ': ';
        if (it.prompt.length < 5) {
          return { i, msg: at + AD.t('the question text is too short.', 'nội dung câu hỏi quá ngắn.') };
        }
        if (it.type === 'mcq') {
          if (it.options.length < 2) {
            return { i, msg: at + AD.t('a multiple-choice item needs at least two options.',
              'câu trắc nghiệm cần ít nhất hai phương án.') };
          }
          if (!it.answer) {
            return { i, msg: at + AD.t('mark which option is correct.', 'hãy đánh dấu phương án đúng.') };
          }
        }
        if (it.type === 'gap' && !it.answer) {
          return { i, msg: at + AD.t('a gap-fill item needs an answer key.', 'câu điền từ cần có đáp án.') };
        }
      }
      return null;
    }

    return { html, mount, setContext, read, firstProblem, count: () => (listEl ? listEl.children.length : 0) };
  }

  /**
   * What the part is called under its name on the student's screen —
   * "Writing · Type the missing word · 4 min".
   *
   * This used to be a free-text box in the add-a-part dialog, filled in by hand
   * for every part of every paper, pre-set to "Multiple choice" and therefore
   * wrong the moment somebody added a writing part without noticing it. Both
   * things that could answer it were already on screen:
   *
   *   · the blueprint, which has said what each part asks of a candidate since
   *     the format was written down — Part A is "Type the missing word";
   *   · failing that, the items just typed, which know their own kind.
   *
   * Falls back to nothing, and the server then applies its own default: a part
   * with no letter and no items is the only case left, and guessing there is
   * worse than the default that has always been there.
   */
  function describePart(part, typed) {
    const p = part && FAM_PARTS ? FAM_PARTS.find(x => x.part === part) : null;
    if (p && p.type) return p.type;
    const kinds = [...new Set((typed || []).map(t => t.type))];
    if (kinds.length === 1) return AD.TYPE_LABEL[kinds[0]] || kinds[0];
    if (kinds.length > 1) return kinds.map(k => AD.TYPE_LABEL[k] || k).join(' + ');
    return '';
  }

  /** Attach the MP3s that were picked alongside the items, once they have ids. */
  async function uploadComposerAudio(typed, questionIds) {
    let failed = 0;
    for (let i = 0; i < typed.length; i++) {
      if (!typed[i].file || !questionIds[i]) continue;
      try { await AD.upload('/admin/questions/' + questionIds[i] + '/audio', typed[i].file); }
      catch (e) { failed++; }
    }
    /* The items exist either way — an upload that failed is a missing MP3 on a
       real question, not a lost question, and the bank screen can fix it. */
    if (failed) {
      AD.toast(AD.t(failed + ' audio file(s) did not upload. Attach them from the question bank.',
        failed + ' file âm thanh chưa tải lên được. Hãy đính kèm lại ở ngân hàng câu hỏi.'), 'error');
    }
  }

  function addSection() {
    const skills = ['listening', 'reading', 'writing', 'speaking'];
    const comp = questionComposer();
    const mm = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">Add a part</h3>' +
      '<div class="grid gap-4 mt-5">' +
        '<div><label class="label" for="s-name">Part name</label><input class="input" id="s-name" placeholder="VD: Listening"></div>' +
        '<div class="grid grid-cols-2 gap-4">' +
          '<div><label class="label" for="s-skill">Skill</label><select class="input" id="s-skill">' +
            skills.map(s => '<option value="' + s + '">' + AD.SKILL_LABEL[s] + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="s-min">Duration (minutes)</label>' +
            '<input class="input" id="s-min" type="number" min="0" max="600" value="30"></div>' +
        '</div>' +
        ((FAM_PARTS && FAM_PARTS.length)
          ? '<div><label class="label" for="s-part">Blueprint part</label><select class="input" id="s-part">' +
              '<option value="">- no part -</option>' +
              FAM_PARTS.map(p2 => '<option value="' + AD.esc(p2.part) + '">' + AD.esc(p2.name) + '</option>').join('') +
            '</select><p class="help mt-1.5">With a part attached, a later reshuffle draws only from that part.</p></div>'
          : '') +
        comp.html +
        '<div class="banner banner-error" id="s-err"><span id="s-err-text"></span></div>' +
        '<div class="modal-actions"><button type="button" id="s-save" class="btn btn-primary btn-md flex-1">Add part</button>' +
          '<button type="button" data-close class="btn btn-ghost btn-md">Cancel</button></div>' +
      '</div>', { wide: true });
    const nameEl = mm.el.querySelector('#s-name'), skillEl = mm.el.querySelector('#s-skill');
    const partEl = mm.el.querySelector('#s-part');
    const saveBtn = mm.el.querySelector('#s-save');
    comp.mount(mm.el, { skill: skillEl.value, part: partEl ? partEl.value : '' });

    /* The button says what pressing it will do. "Add part" when nothing is typed
       is the old behaviour, unchanged; the count appears only once there is one.
       Bound to the whole dialog because adding and removing a row are two
       different buttons and both change the answer — but it must keep its hands
       off the button while a save is in flight, or the click that started the
       save would re-enable it on the way up and let it be pressed twice. */
    let busy = false;
    const syncSave = () => {
      if (busy) return;
      const n = comp.count();
      saveBtn.textContent = n
        ? AD.t('Add part with ' + n + (n === 1 ? ' question' : ' questions'), 'Thêm phần kèm ' + n + ' câu hỏi')
        : AD.t('Add part', 'Thêm phần');
    };
    mm.el.addEventListener('click', syncSave);

    skillEl.addEventListener('change', () => {
      if (!nameEl.value) nameEl.placeholder = 'VD: ' + skillEl.options[skillEl.selectedIndex].text;
      comp.setContext({ skill: skillEl.value });
    });
    /* Choosing a part fills in the name and skill from the blueprint - retyping them
    by hand only creates a chance for part A to carry part C's skill. */
    if (partEl) partEl.addEventListener('change', () => {
      const p2 = FAM_PARTS.find(x => x.part === partEl.value);
      if (p2) {
        if (p2.skill) skillEl.value = p2.skill;
        if (!nameEl.value) nameEl.value = p2.name;
      }
      comp.setContext({ skill: skillEl.value, part: partEl.value });
    });

    saveBtn.addEventListener('click', async () => {
      const err = mm.el.querySelector('#s-err');
      const errText = mm.el.querySelector('#s-err-text');
      err.classList.remove('show');
      AD.qsa('[data-row]', mm.el).forEach(r => r.classList.remove('ring-2', 'ring-danger'));

      const typed = comp.read();
      const problem = comp.firstProblem(typed);
      if (problem) {
        typed[problem.i].row.classList.add('ring-2', 'ring-danger');
        typed[problem.i].row.scrollIntoView({ block: 'nearest' });
        errText.textContent = problem.msg;
        err.classList.add('show');
        return;
      }

      busy = true;
      saveBtn.disabled = true;
      try {
        const r = await AD.post('/admin/tests/' + encodeURIComponent(testId) + '/sections', {
          name: nameEl.value || skillEl.options[skillEl.selectedIndex].text,
          skill: skillEl.value,
          type: describePart(partEl ? partEl.value : '', typed),
          minutes: +mm.el.querySelector('#s-min').value || 0,
          part: partEl ? partEl.value : '',
          questions: typed.map(t => ({ type: t.type, prompt: t.prompt, options: t.options, answer: t.answer }))
        });
        await uploadComposerAudio(typed, r.questionIds || []);
        mm.close();
        AD.toast(typed.length
          ? AD.t('Part added with ' + typed.length + ' questions', 'Đã thêm phần kèm ' + typed.length + ' câu hỏi')
          : AD.t('Part added', 'Đã thêm phần'));
        await load();
      } catch (e) {
        busy = false;
        saveBtn.disabled = false;
        /* The server names the item it refused, counting from 1 like the rows do. */
        if (Number.isInteger(e.data && e.data.index) && typed[e.data.index]) {
          typed[e.data.index].row.classList.add('ring-2', 'ring-danger');
          typed[e.data.index].row.scrollIntoView({ block: 'nearest' });
        }
        errText.textContent = e.message;
        err.classList.add('show');
      }
    });
  }

  /** Write brand-new items into a part that already exists. */
  function writeItems(sid) {
    const s = T.sections.find(x => x.id === sid);
    const comp = questionComposer();
    const mm = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">Write items for ' + AD.esc(s.name) + '</h3>' +
      '<p class="text-muted text-[13px] mt-1.5">' +
        AD.esc(AD.SKILL_LABEL[s.skill] || s.skill) +
        (s.part ? ' · Part ' + AD.esc(s.part) : ' · no blueprint part') +
        ' · ' + AD.esc(T.level) + '</p>' +
      '<div class="grid gap-4 mt-5">' +
        comp.html +
        '<div class="banner banner-error" id="w-err"><span id="w-err-text"></span></div>' +
        '<div class="modal-actions"><button type="button" id="w-save" class="btn btn-primary btn-md flex-1" disabled>Write items</button>' +
          '<button type="button" data-close class="btn btn-ghost btn-md">Cancel</button></div>' +
      '</div>', { wide: true });

    const saveBtn = mm.el.querySelector('#w-save');
    comp.mount(mm.el, { skill: s.skill, part: s.part || '' });
    /* Same as the add-a-part dialog, and here the flag earns its keep twice over:
       this one disables the button when there is nothing to write, so without it
       the click that starts the save would switch the button back on as it
       bubbled, and a slow request could be sent twice. */
    let busy = false;
    const syncSave = () => {
      if (busy) return;
      const n = comp.count();
      saveBtn.disabled = !n;
      saveBtn.textContent = n
        ? AD.t('Write ' + n + (n === 1 ? ' item' : ' items'), 'Lưu ' + n + ' câu hỏi')
        : AD.t('Write items', 'Soạn câu hỏi');
    };
    mm.el.addEventListener('click', syncSave);
    mm.el.querySelector('#c-add').click();     // start with one row open, ready to type

    saveBtn.addEventListener('click', async () => {
      const err = mm.el.querySelector('#w-err');
      const errText = mm.el.querySelector('#w-err-text');
      err.classList.remove('show');
      AD.qsa('[data-row]', mm.el).forEach(r => r.classList.remove('ring-2', 'ring-danger'));

      const typed = comp.read();
      const problem = comp.firstProblem(typed);
      if (problem) {
        typed[problem.i].row.classList.add('ring-2', 'ring-danger');
        typed[problem.i].row.scrollIntoView({ block: 'nearest' });
        errText.textContent = problem.msg;
        err.classList.add('show');
        return;
      }

      busy = true;
      saveBtn.disabled = true;
      try {
        const r = await AD.post('/admin/sections/' + sid + '/questions', {
          questions: typed.map(t => ({ type: t.type, prompt: t.prompt, options: t.options, answer: t.answer }))
        });
        await uploadComposerAudio(typed, r.questionIds || []);
        mm.close();
        AD.toast(AD.t('Wrote ' + r.added + (r.added === 1 ? ' item' : ' items'),
          'Đã lưu ' + r.added + ' câu hỏi'));
        await load();
      } catch (e) {
        busy = false;
        saveBtn.disabled = false;
        if (Number.isInteger(e.data && e.data.index) && typed[e.data.index]) {
          typed[e.data.index].row.classList.add('ring-2', 'ring-danger');
          typed[e.data.index].row.scrollIntoView({ block: 'nearest' });
        }
        errText.textContent = e.message;
        err.classList.add('show');
      }
    });
  }

  async function delSection(sid) {
    const s = T.sections.find(x => x.id === sid);
    if (!await AD.confirm('Delete this part?', 'The part "' + s.name + '" and its ' + s.items.length +
      ' attached items will be removed from the test. The questions stay in the bank.', 'Delete')) return;
    try { await AD.del('/admin/sections/' + sid); AD.toast('Part deleted'); await load(); }
    catch (e) { AD.toast(e.message, 'error'); }
  }

  async function reshuffle(sid) {
    const s = T.sections.find(x => x.id === sid);
    if (!await AD.confirm('Redraw the questions?', 'All ' + s.items.length + ' items in the part "' + s.name +
      '" will be replaced by others drawn at random from the bank.', 'Redraw')) return;
    try { const r = await AD.post('/admin/sections/' + sid + '/reshuffle'); AD.toast('Redrew ' + r.count + ' items'); await load(); }
    catch (e) { AD.toast(e.message, 'error'); }
  }

  /* ---------- Choosing questions from the bank ---------- */
  function pickQuestions(sid) {
    const s = T.sections.find(x => x.id === sid);
    const already = new Set(s.items.map(i => i.questionId));
    const chosen = new Set();

    const mm = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">Choose items for ' + AD.esc(s.name) + '</h3>' +
      '<p class="text-muted text-[13px] mt-1.5">Only items from the same exam and skill as this part are shown.</p>' +
      '<div class="flex flex-wrap gap-2 mt-4">' +
        '<label class="sr-only" for="p-q">Search questions</label>' +
        '<input class="input flex-1 min-w-[160px] py-2" id="p-q" type="search" placeholder="Search the item text…">' +
        '<label class="sr-only" for="p-level">Filter by level</label>' +
        '<select class="input w-auto py-2" id="p-level"><option value="">Any level</option>' +
          ['A1','A2','B1','B2','C1','C2'].map(l => '<option>' + l + '</option>').join('') + '</select>' +
      '</div>' +
      '<div id="p-list" class="mt-4 max-h-[46vh] overflow-y-auto grid gap-1.5"></div>' +
      '<div class="flex items-center gap-2.5 mt-5 pt-4 border-t border-line">' +
        '<span class="text-[13px] font-bold text-muted" id="p-count">0 selected</span>' +
        '<button type="button" id="p-add" class="btn btn-primary btn-md ms-auto" disabled>Add to the part</button>' +
        '<button type="button" data-close class="btn btn-ghost btn-md">Close</button>' +
      '</div>', { wide: true });

    const listEl = mm.el.querySelector('#p-list');
    const countEl = mm.el.querySelector('#p-count');
    const addBtn = mm.el.querySelector('#p-add');

    const sync = () => {
      countEl.textContent = chosen.size + ' selected';
      addBtn.disabled = chosen.size === 0;
    };

    async function search() {
      listEl.innerHTML = '<div class="skeleton h-16 w-full"></div><div class="skeleton h-16 w-full"></div>';
      const p = new URLSearchParams({
        family: T.familyId, skill: s.skill, status: 'active', limit: '60'
      });
      if (mm.el.querySelector('#p-q').value.trim()) p.set('q', mm.el.querySelector('#p-q').value.trim());
      if (mm.el.querySelector('#p-level').value) p.set('level', mm.el.querySelector('#p-level').value);
      try {
        const { items, total } = await AD.get('/admin/questions?' + p);
        const free = items.filter(i => !already.has(i.id));
        if (!free.length) {
          listEl.innerHTML = '<p class="text-center text-[14px] text-muted py-8">' +
            (items.length ? 'Every item matching the filter is already in this part.' : 'The bank has no matching items.') + '</p>';
          return;
        }
        listEl.innerHTML = free.map(i =>
          '<label class="flex items-start gap-3 rounded-xl border border-line px-3.5 py-2.5 cursor-pointer hover:bg-brand-soft transition">' +
            '<input type="checkbox" class="mt-1 w-4 h-4 rounded accent-[color:var(--color-accent)] shrink-0" data-qid="' + i.id + '" ' +
              (chosen.has(i.id) ? 'checked' : '') + '>' +
            '<span class="min-w-0">' +
              '<span class="block text-[14px] leading-snug">' + AD.esc(i.prompt) + '</span>' +
              '<span class="block text-[12px] text-muted font-semibold mt-1">' +
                AD.esc(AD.TYPE_LABEL[i.type] || i.type) + ' · ' + AD.esc(i.level) + '</span>' +
            '</span>' +
          '</label>').join('') +
          (total > free.length ? '<p class="text-[13px] text-muted text-center pt-2">Showing the first ' + free.length + ' items; filter further to narrow it down.</p>' : '');
        AD.qsa('[data-qid]', listEl).forEach(cb => cb.addEventListener('change', () => {
          const id = +cb.getAttribute('data-qid');
          if (cb.checked) chosen.add(id); else chosen.delete(id);
          sync();
        }));
      } catch (e) {
        listEl.innerHTML = '<p class="text-center text-[14px] text-danger py-8">' + AD.esc(e.message) + '</p>';
      }
    }
    let tt = null;
    mm.el.querySelector('#p-q').addEventListener('input', () => { clearTimeout(tt); tt = setTimeout(search, 250); });
    mm.el.querySelector('#p-level').addEventListener('change', search);
    search();

    addBtn.addEventListener('click', async () => {
      addBtn.disabled = true;
      addBtn.innerHTML = AD.icon('loader', 'w-4 h-4 animate-spin-slow') + 'Adding';
      try {
        const r = await AD.post('/admin/sections/' + sid + '/items', { questionIds: [...chosen] });
        mm.close();
        AD.toast('Added ' + r.added + ' items' + (r.skipped ? ', skipped ' + r.skipped : ''));
        await load();
      } catch (e) {
        addBtn.disabled = false;
        addBtn.textContent = 'Add to the part';
        AD.toast(e.message, 'error');
      }
    });
  }

  load();
})();
</script>
</body>
</html>
