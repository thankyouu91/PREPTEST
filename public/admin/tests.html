<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests · VPET Prep admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="tests" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-8">

      <div class="flex flex-wrap items-center gap-2.5 mb-6">
        <div class="flex gap-2 flex-wrap" id="filters"></div>
        <label class="relative ms-auto min-w-[200px]">
          <span class="sr-only">Search tests</span>
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none" id="search-icon"></span>
          <input id="q" type="search" class="input ps-10 py-2.5" placeholder="Search by test name…">
        </label>
      </div>

      <div id="list">
        <div class="card p-5 grid gap-3.5">
          <div class="skeleton h-6 w-11/12"></div><div class="skeleton h-6 w-full"></div><div class="skeleton h-6 w-4/5"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
(async () => {
  await AD.mount({ title: 'Tests', subtitle: 'Create one by hand, or generate it from the question bank' });
  AD.qs('#search-icon').innerHTML = AD.icon('search', 'w-[18px] h-[18px]');

  AD.qs('#page-actions').innerHTML =
    '<button type="button" id="btn-auto" class="btn btn-soft btn-sm">' + AD.icon('wand', 'w-4 h-4') + '<span class="hidden sm:inline">Generate a test</span></button>' +
    '<button type="button" id="btn-new" class="btn btn-primary btn-sm">' + AD.icon('plus', 'w-4 h-4') + 'New test</button>';

  let families = [];
  try { families = (await AD.get('/catalog')).families; } catch (e) { families = []; }

  const state = { family: '', status: '', q: '' };
  AD.qs('#filters').innerHTML =
    '<button type="button" class="chip" data-f="" aria-pressed="true">All</button>' +
    families.map(f => '<button type="button" class="chip" data-family="' + f.id + '" data-f="' + f.id + '" aria-pressed="false">' + AD.esc(f.name) + '</button>').join('') +
    '<span class="w-px bg-line mx-1 self-stretch"></span>' +
    ['draft', 'published', 'archived'].map(s =>
      '<button type="button" class="chip" data-s="' + s + '" aria-pressed="false">' + AD.esc(AD.STATUS_LABEL[s]) + '</button>').join('');

  AD.qs('#filters').addEventListener('click', e => {
    const bf = e.target.closest('[data-f]');
    const bs = e.target.closest('[data-s]');
    if (bf) {
      state.family = bf.getAttribute('data-f');
      AD.qsa('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === bf)));
    }
    if (bs) {
      const on = bs.getAttribute('aria-pressed') === 'true';
      state.status = on ? '' : bs.getAttribute('data-s');
      AD.qsa('[data-s]').forEach(x => x.setAttribute('aria-pressed', String(!on && x === bs)));
    }
    if (bf || bs) load();
  });
  let t = null;
  AD.qs('#q').addEventListener('input', e => {
    state.q = e.target.value.trim();
    clearTimeout(t); t = setTimeout(load, 250);
  });

  const statusBadge = s => s === 'published'
    ? '<span class="badge badge-ok">Published</span>'
    : s === 'draft' ? '<span class="badge badge-hl">Draft</span>'
    : '<span class="badge badge-muted">Archived</span>';

  async function load() {
    const p = new URLSearchParams();
    if (state.family) p.set('family', state.family);
    if (state.status) p.set('status', state.status);
    if (state.q) p.set('q', state.q);
    try {
      const { items } = await AD.get('/admin/tests?' + p);
      if (!items.length) {
        AD.qs('#list').innerHTML = AD.emptyBox('fileText', 'No tests match',
          'Change the filter, or create a test and add questions from the bank.',
          '<button type="button" class="btn btn-primary btn-md" data-empty-new>Create the first test</button>');
        const b = AD.qs('[data-empty-new]');
        if (b) b.addEventListener('click', openNew);
        return;
      }
      AD.qs('#list').innerHTML =
        '<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-[14px]">' +
        '<thead><tr class="text-[12px] uppercase tracking-wide text-muted border-b border-line bg-surface">' +
          '<th class="text-left font-bold px-5 py-3">Test</th>' +
          '<th class="text-left font-bold px-4 py-3 hidden md:table-cell">Structure</th>' +
          '<th class="text-left font-bold px-4 py-3 hidden lg:table-cell">Updated</th>' +
          '<th class="text-left font-bold px-4 py-3">Status</th>' +
          '<th class="px-5 py-3"><span class="sr-only">Actions</span></th>' +
        '</tr></thead><tbody>' +
        items.map(t2 =>
          '<tr class="border-b border-line last:border-0">' +
            '<td class="px-5 py-3.5">' +
              '<div class="flex items-center gap-2.5">' +
                '<span class="exam-chip shrink-0" data-family="' + t2.familyId + '">' + AD.esc(t2.familyName) + '</span>' +
                '<span class="min-w-0"><b class="block truncate">' + AD.esc(t2.title) + '</b>' +
                '<span class="block text-[12.5px] text-muted">' + AD.esc(t2.level) +
                (t2.buildMode === 'auto' ? ' · generated' : '') + '</span></span>' +
              '</div>' +
            '</td>' +
            '<td class="px-4 py-3.5 hidden md:table-cell text-muted font-semibold whitespace-nowrap">' +
              t2.sections + ' parts · ' + t2.items + ' items · ' + t2.durationMin + ' min</td>' +
            '<td class="px-4 py-3.5 hidden lg:table-cell text-muted whitespace-nowrap">' + AD.ago(t2.updatedAt) + '</td>' +
            '<td class="px-4 py-3.5">' + statusBadge(t2.status) + '</td>' +
            '<td class="px-5 py-3.5 text-right whitespace-nowrap">' +
              '<a href="/admin/de-thi/' + encodeURIComponent(t2.id) + '/" class="btn btn-ghost btn-sm">Open</a></td>' +
          '</tr>').join('') +
        '</tbody></table></div></div>';
    } catch (e) {
      AD.qs('#list').innerHTML = AD.errorBox(e.message, 'retry');
      AD.qs('#retry').addEventListener('click', load);
    }
  }

  /* ---------- Create a test by hand ---------- */
  function openNew() {
    const m = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">New test</h3>' +
      '<p class="text-muted text-[14px] mt-1.5">A new test starts as a draft. Add parts and questions before you publish it.</p>' +
      '<form id="nf" class="grid gap-4 mt-5" novalidate>' +
        '<div><label class="label" for="n-family">Exam</label>' +
          '<select class="input" id="n-family">' + families.map(f => '<option value="' + f.id + '">' + AD.esc(f.name) + '</option>').join('') + '</select></div>' +
        '<div><label class="label" for="n-title">Test name</label>' +
          '<input class="input" id="n-title" placeholder="VD: IELTS Academic Mock 03"></div>' +
        '<div class="grid grid-cols-2 gap-4">' +
          '<div><label class="label" for="n-level">Level</label>' +
            '<select class="input" id="n-level">' + ['A1','A2','B1','B2','C1','C2'].map(l => '<option>' + l + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="n-dur">Duration (minutes)</label>' +
            '<input class="input" id="n-dur" type="number" min="0" max="600" value="0"></div>' +
        '</div>' +
        '<div class="banner banner-error" id="nf-err"><span id="nf-err-text"></span></div>' +
        '<div class="flex gap-2.5 mt-1">' +
          '<button type="submit" class="btn btn-primary btn-md flex-1">Create</button>' +
          '<button type="button" data-close class="btn btn-ghost btn-md">Cancel</button></div>' +
      '</form>');
    m.el.querySelector('#n-level').value = 'B1';
    m.el.querySelector('#nf').addEventListener('submit', async ev => {
      ev.preventDefault();
      const err = m.el.querySelector('#nf-err');
      err.classList.remove('show');
      try {
        const t2 = await AD.post('/admin/tests', {
          familyId: m.el.querySelector('#n-family').value,
          title: m.el.querySelector('#n-title').value,
          level: m.el.querySelector('#n-level').value,
          durationMin: +m.el.querySelector('#n-dur').value || 0
        });
        location.href = '/admin/de-thi/' + encodeURIComponent(t2.id) + '/';
      } catch (e2) {
        m.el.querySelector('#nf-err-text').textContent = e2.message;
        err.classList.add('show');
      }
    });
  }
  AD.qs('#btn-new').addEventListener('click', openNew);

  /* ---------- Generate a test ---------- */
  const DEFAULT_BP = {
    listening: { name: 'Listening', type: 'Multiple choice', items: 20, minutes: 30 },
    reading:   { name: 'Reading',   type: 'Comprehension',  items: 20, minutes: 40 },
    writing:   { name: 'Writing',   type: 'Essay',          items: 2,  minutes: 40 },
    speaking:  { name: 'Speaking',  type: 'Recorded',       items: 3,  minutes: 12 }
  };

  function openAuto() {
    const skills = ['listening', 'reading', 'writing', 'speaking'];
    const m = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">Generate a test</h3>' +
      '<p class="text-muted text-[14px] mt-1.5 leading-relaxed">Questions are drawn at random from the bank, following the structure you set out. The result is a draft: review it before publishing.</p>' +
      '<div class="grid gap-4 mt-5">' +
        '<div class="grid grid-cols-2 gap-4">' +
          '<div><label class="label" for="a-family">Exam</label>' +
            '<select class="input" id="a-family">' + families.map(f => '<option value="' + f.id + '">' + AD.esc(f.name) + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="a-level">Level</label>' +
            '<select class="input" id="a-level">' + ['A2','B1','B2','C1'].map(l => '<option>' + l + '</option>').join('') + '</select></div>' +
        '</div>' +
        '<div><label class="label" for="a-title">Test name <span class="font-medium text-muted">(left blank, one is chosen for you)</span></label>' +
          '<input class="input" id="a-title" placeholder="Named after the exam and the date"></div>' +
        '<div>' +
          '<p class="label">Test structure</p>' +
          '<div class="grid gap-2" id="a-bp">' +
            skills.map(s =>
              '<div class="flex items-center gap-2.5 rounded-xl border border-line px-3 py-2.5" data-skill="' + s + '">' +
                '<input type="checkbox" class="w-4 h-4 rounded accent-[color:var(--color-accent)] shrink-0" data-on ' +
                  (s === 'listening' || s === 'reading' ? 'checked' : '') + ' aria-label="Enable the ' + AD.SKILL_LABEL[s] + ' part">' +
                '<span class="font-semibold text-[14px] w-14 shrink-0">' + AD.SKILL_LABEL[s] + '</span>' +
                '<label class="sr-only" for="items-' + s + '">Item count for ' + AD.SKILL_LABEL[s] + '</label>' +
                '<input id="items-' + s + '" class="input py-1.5 w-20 text-center" type="number" min="1" max="200" data-items value="' + DEFAULT_BP[s].items + '">' +
                '<span class="text-[13px] text-muted">items</span>' +
                '<label class="sr-only" for="min-' + s + '">Minutes for ' + AD.SKILL_LABEL[s] + '</label>' +
                '<input id="min-' + s + '" class="input py-1.5 w-20 text-center ms-auto" type="number" min="0" max="600" data-min value="' + DEFAULT_BP[s].minutes + '">' +
                '<span class="text-[13px] text-muted">min</span>' +
                '<span class="text-[12px] font-bold w-20 text-right" data-avail>—</span>' +
              '</div>').join('') +
          '</div>' +
        '</div>' +
        '<label class="flex items-center gap-2.5 text-[14px] font-medium text-muted">' +
          '<input type="checkbox" id="a-strict" class="w-4 h-4 rounded accent-[color:var(--color-accent)]">' +
          'Only draw items at the chosen level</label>' +
        '<div class="banner banner-error" id="a-err"><span id="a-err-text"></span></div>' +
        '<div class="flex gap-2.5">' +
          '<button type="button" id="a-go" class="btn btn-primary btn-md flex-1">' + AD.icon('wand', 'w-4 h-4') + 'Generate</button>' +
          '<button type="button" data-close class="btn btn-ghost btn-md">Cancel</button></div>' +
      '</div>', { wide: true });

    const fam = m.el.querySelector('#a-family'), lvl = m.el.querySelector('#a-level');
    lvl.value = 'B1';

    async function refreshAvail() {
      try {
        const r = await AD.get('/admin/questions/availability?family=' + encodeURIComponent(fam.value) + '&level=' + lvl.value);
        AD.qsa('[data-skill]', m.el).forEach(row => {
          const s = row.getAttribute('data-skill');
          const a = r.availability[s] || { exact: 0, total: 0 };
          const strict = m.el.querySelector('#a-strict').checked;
          const have = strict ? a.exact : a.total;
          const want = +row.querySelector('[data-items]').value || 0;
          const el = row.querySelector('[data-avail]');
          el.textContent = have + ' available';
          el.className = 'text-[12px] font-bold w-20 text-right ' +
            (row.querySelector('[data-on]').checked && have < want ? 'text-danger' : 'text-muted');
        });
      } catch (e) {}
    }
    [fam, lvl, m.el.querySelector('#a-strict')].forEach(el => el.addEventListener('change', refreshAvail));
    AD.qsa('[data-items], [data-on]', m.el).forEach(el => el.addEventListener('input', refreshAvail));
    refreshAvail();

    m.el.querySelector('#a-go').addEventListener('click', async () => {
      const err = m.el.querySelector('#a-err');
      err.classList.remove('show');
      const blueprint = AD.qsa('[data-skill]', m.el)
        .filter(r => r.querySelector('[data-on]').checked)
        .map(r => {
          const s = r.getAttribute('data-skill');
          return {
            name: DEFAULT_BP[s].name, skill: s, type: DEFAULT_BP[s].type,
            items: +r.querySelector('[data-items]').value || 0,
            minutes: +r.querySelector('[data-min]').value || 0
          };
        });
      if (!blueprint.length) {
        m.el.querySelector('#a-err-text').textContent = 'Choose at least one part for the test.';
        err.classList.add('show');
        return;
      }
      const btn = m.el.querySelector('#a-go');
      btn.disabled = true;
      btn.innerHTML = AD.icon('loader', 'w-4 h-4 animate-spin-slow') + 'Drawing questions';
      try {
        const t2 = await AD.post('/admin/tests/generate', {
          familyId: fam.value, level: lvl.value,
          title: m.el.querySelector('#a-title').value,
          strictLevel: m.el.querySelector('#a-strict').checked,
          blueprint
        });
        location.href = '/admin/de-thi/' + encodeURIComponent(t2.id) + '/';
      } catch (e2) {
        btn.disabled = false;
        btn.innerHTML = AD.icon('wand', 'w-4 h-4') + 'Generate';
        const sh = e2.data && e2.data.shortages;
        m.el.querySelector('#a-err-text').innerHTML = AD.esc(e2.message) +
          (sh ? '<br>' + sh.map(s => '· ' + AD.esc(s.section) + ': needs ' + s.need + ', bank has ' + s.have).join('<br>') : '');
        err.classList.add('show');
      }
    });
  }
  AD.qs('#btn-auto').addEventListener('click', openAuto);

  load();
})();
</script>
</body>
</html>
