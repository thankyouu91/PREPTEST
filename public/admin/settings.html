<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration · VPET Prep</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
  <!-- Song ngữ: đặt ngôn ngữ (mặc định tiếng Việt) trước khi vẽ trang -->
  <script src="/i18n.js"></script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="settings" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-10">
      <div role="tablist" aria-label="Administration sections" class="flex gap-2 overflow-x-auto no-scrollbar border-b border-line mb-7 -mx-1 px-1">
        <button role="tab" id="tab-general" aria-controls="p-general" aria-selected="true" class="tabbtn">Platform</button>
        <button role="tab" id="tab-packages" aria-controls="p-packages" aria-selected="false" class="tabbtn">Plans</button>
        <button role="tab" id="tab-account" aria-controls="p-account" aria-selected="false" class="tabbtn">Admin account</button>
        <button role="tab" id="tab-audit" aria-controls="p-audit" aria-selected="false" class="tabbtn">Audit log</button>
      </div>

      <section role="tabpanel" id="p-general" aria-labelledby="tab-general"><div class="skeleton h-40 w-full rounded-2xl"></div></section>
      <section role="tabpanel" id="p-packages" aria-labelledby="tab-packages" hidden></section>
      <section role="tabpanel" id="p-account" aria-labelledby="tab-account" hidden></section>
      <section role="tabpanel" id="p-audit" aria-labelledby="tab-audit" hidden></section>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
(async () => {
  const me = await AD.mount({ title: 'Administration', subtitle: 'Platform configuration, the plans on sale, and the audit log' });

  const tabs = [['tab-general','p-general'],['tab-packages','p-packages'],['tab-account','p-account'],['tab-audit','p-audit']];
  tabs.forEach(([tid, pid]) => AD.qs('#' + tid).addEventListener('click', () => {
    tabs.forEach(([t2, p2]) => {
      const on = t2 === tid;
      AD.qs('#' + t2).setAttribute('aria-selected', String(on));
      AD.qs('#' + p2).toggleAttribute('hidden', !on);
    });
    if (pid === 'p-audit') loadAudit();
    history.replaceState(null, '', pid === 'p-audit' ? '#nhat-ky' : location.pathname);
  }));

  let S;
  try {
    S = await AD.get('/admin/settings');
  } catch (e) {
    AD.qs('#p-general').innerHTML = AD.errorBox(e.message, 'retry');
    AD.qs('#retry').addEventListener('click', () => location.reload());
    return;
  }

  /* ---------------- Platform ---------------- */
  AD.qs('#p-general').innerHTML =
    '<div class="grid lg:grid-cols-12 gap-6">' +
      '<div class="lg:col-span-7 card p-6 sm:p-7 grid gap-5 content-start">' +
        '<h2 class="text-lg font-extrabold tracking-tight">Branding</h2>' +
        '<div><label class="label" for="g-name">Display name</label>' +
          '<input class="input" id="g-name" value="' + AD.esc(S.settings['brand.name'] || '') + '">' +
          '<p class="help">Shown at the top of the sidebar and on the landing page.</p></div>' +
        '<div><label class="label" for="g-tenant">Tenant palette</label>' +
          '<select class="input" id="g-tenant">' +
            ['default', 'evergreen', 'sunrise'].map(t2 =>
              '<option value="' + t2 + '"' + ((S.settings['brand.tenant'] || 'default') === t2 ? ' selected' : '') + '>' +
              (t2 === 'default' ? 'Default (navy + teal)' : t2 === 'evergreen' ? 'Evergreen (green)' : 'Sunrise (burnt orange)') +
              '</option>').join('') + '</select></div>' +
        '<div><label class="label" for="g-notice">Platform-wide notice</label>' +
          '<input class="input" id="g-notice" value="' + AD.esc(S.settings['platform.notice'] || '') + '" placeholder="Leave blank to show nothing">' +
          '<p class="help">A short line for students, a maintenance window for instance.</p></div>' +
        '<div class="banner banner-success" id="g-ok"><span>Configuration saved.</span></div>' +
        '<button type="button" id="g-save" class="btn btn-primary btn-md justify-self-start">Save configuration</button>' +
      '</div>' +
      '<div class="lg:col-span-5 card p-6">' +
        '<h2 class="text-lg font-extrabold tracking-tight">Exams</h2>' +
        '<p class="text-[13.5px] text-muted mt-1 mb-4">The fixed catalogue of the platform.</p>' +
        '<ul class="grid gap-2.5">' + S.families.map(f =>
          '<li class="flex items-center gap-3 py-2 border-b border-line last:border-0">' +
            '<span class="exam-chip shrink-0" data-family="' + f.id + '">' + AD.esc(f.name) + '</span>' +
            '<span class="text-[13.5px] text-muted truncate">' + AD.esc(f.format) + '</span>' +
          '</li>').join('') + '</ul>' +
      '</div>' +
    '</div>';

  /* ---------------- AI marking ----------------
     Reading and Listening mark themselves the moment a paper is handed in.
     Writing and Speaking need a rubric, and until a key is put in here nothing
     ever marks them - which is why a submitted paper used to show no overall
     band at all, permanently. The key is write-only: it is sealed before it is
     stored and no route ever returns it, so this screen can say WHICH key is in
     use (its last four characters) but never what it is. */
  AD.qs('#p-general').insertAdjacentHTML('beforeend',
    '<div class="card p-6 sm:p-7 mt-6 grid gap-4 content-start" id="ai-card">' +
      '<div class="grid gap-1">' +
        '<h2 class="text-lg font-extrabold tracking-tight">Marking writing and speaking</h2>' +
        '<p class="text-[13.5px] text-muted">Reading and Listening are marked automatically. ' +
          'Writing and Speaking need a model - without one they stay unmarked and no overall band is given.</p>' +
      '</div>' +
      '<div id="ai-body"><div class="skeleton h-24 w-full rounded-2xl"></div></div>' +
    '</div>');

  /**
   * @param flash a message to show once the card has been rebuilt, or nothing.
   *
   * It has to be passed in rather than written before the call. Saving used to
   * put a banner in #ai-out and then reload, and the reload replaces the whole
   * card - so the confirmation was destroyed before the browser painted it and
   * pressing Save appeared to do nothing at all.
   */
  async function aiLoad(flash) {
    const box = AD.qs('#ai-body');
    let d;
    try { d = await AD.get('/admin/ai'); }
    catch (e) {
      /* Not an error for an editor - it is the rule. This card is owner-only,
         and every other admin was being shown a red failure panel on a screen
         they had done nothing wrong to reach. */
      box.innerHTML = e.status === 403
        ? '<p class="text-[13.5px] text-muted">Only the owner account can set up marking.</p>'
        : AD.errorBox(e.message);
      return;
    }
    const a = d.ai;

    const status = !a.canStore
      ? '<div class="banner banner-warn show"><span>This server has no <code>TOKEN_ENCRYPTION_KEY</code>, ' +
          'so a key cannot be stored safely. Set one and restart before using this.</span></div>'
      : a.hasKey
        ? '<div class="banner banner-success show"><span>A key ending <b>' + AD.esc(a.keyHint) + '</b> is in use' +
            (a.checkedAt ? ', last checked ' + AD.esc(new Date(a.checkedAt).toLocaleString()) : '') + '.</span></div>'
        : '<div class="banner banner-warn show"><span>No key yet, so writing and speaking are not being marked.</span></div>';

    const err = a.lastError
      ? '<div class="banner banner-error show"><span>Last check failed: ' + AD.esc(a.lastError) + '</span></div>' : '';

    /* Two numbers, because they answer different questions. The first is the
       size of the job; the second is how many PAPERS the next sweep would pick
       up, which is what tells an owner whether anything is actually moving. */
    const waiting = d.waiting
      ? '<p class="text-[13.5px] font-semibold">' + d.waiting + ' answer(s) across all sittings are waiting to be marked.' +
        (d.due ? ' <span class="font-normal text-muted">' + d.due + ' paper(s) are due a pass; marking runs by itself ' +
          'every ten minutes.</span>' : ' <span class="font-normal text-muted">None are due right now - ' +
          'a paper that has just failed waits before it is tried again.</span>') + '</p>'
      : '<p class="text-[13.5px] text-muted">Nothing is waiting to be marked.</p>';

    box.innerHTML = status + err +
      '<div class="grid gap-4 mt-4">' +
        '<div class="grid sm:grid-cols-2 gap-4">' +
          '<label class="grid gap-1.5"><span class="label">Model endpoint</span>' +
            '<input class="input" id="ai-url" value="' + AD.esc(a.baseUrl) + '" placeholder="https://api.anthropic.com"></label>' +
          '<label class="grid gap-1.5"><span class="label">Model</span>' +
            '<input class="input" id="ai-model" value="' + AD.esc(a.model) + '"></label>' +
        '</div>' +
        '<label class="grid gap-1.5"><span class="label">API key</span>' +
          '<input class="input" id="ai-key" type="password" autocomplete="off" placeholder="' +
            (a.hasKey ? 'Leave blank to keep the key already saved' : 'Paste the key') + '">' +
          '<span class="text-[12.5px] text-muted">Stored encrypted. It is never shown again and never sent to a browser.</span></label>' +

        '<details class="mt-2"><summary class="text-[13.5px] font-semibold cursor-pointer">Speaking: transcription</summary>' +
          '<p class="text-[13px] text-muted mt-2 max-w-[62ch]">The model reads text, not audio, so a spoken answer is ' +
            'transcribed first. Without this, Speaking stays unmarked and says so. What is scored is the transcript - ' +
            'the words and the grammar - not pronunciation or fluency.</p>' +
          '<div class="grid sm:grid-cols-2 gap-4 mt-3">' +
            '<label class="grid gap-1.5"><span class="label">Transcription endpoint</span>' +
              '<input class="input" id="ai-stt-url" value="' + AD.esc(a.sttBaseUrl) + '" placeholder="https://api.openai.com"></label>' +
            '<label class="grid gap-1.5"><span class="label">Transcription model</span>' +
              '<input class="input" id="ai-stt-model" value="' + AD.esc(a.sttModel) + '"></label>' +
          '</div>' +
          '<label class="grid gap-1.5 mt-3"><span class="label">Transcription API key' +
            (a.hasSttKey ? ' (ending ' + AD.esc(a.sttKeyHint) + ')' : '') + '</span>' +
            '<input class="input" id="ai-stt-key" type="password" autocomplete="off" placeholder="' +
              (a.hasSttKey ? 'Leave blank to keep the key already saved' : 'Paste the key') + '"></label>' +
        '</details>' +

        waiting +
        '<div class="flex flex-wrap gap-2.5">' +
          '<button type="button" class="btn btn-primary btn-md" id="ai-save">Save</button>' +
          '<button type="button" class="btn btn-soft btn-md" id="ai-test"' + (a.hasKey ? '' : ' disabled') + '>Test the connection</button>' +
          (a.hasKey && d.waiting
            ? '<button type="button" class="btn btn-soft btn-md" id="ai-sweep">Mark what is waiting</button>' : '') +
          (a.hasKey ? '<button type="button" class="btn btn-ghost btn-md" id="ai-clear">Remove the key</button>' : '') +
        '</div>' +
        '<div id="ai-out"></div>' +
      '</div>';

    const out = AD.qs('#ai-out');
    if (flash) {
      out.innerHTML = '<div class="banner banner-' + (flash.bad ? 'error' : 'success') + ' show"><span>' +
        AD.esc(flash.text) + '</span></div>';
    }
    const save = async (patch, done) => {
      try {
        await AD.put('/admin/ai', patch);
        /* The message goes THROUGH the reload, not before it. */
        await aiLoad({ text: done });
      } catch (e) {
        out.innerHTML = '<div class="banner banner-error show"><span>' + AD.esc(e.message) + '</span></div>';
      }
    };

    AD.qs('#ai-save').addEventListener('click', () => {
      const body = {
        baseUrl: AD.qs('#ai-url').value.trim(),
        model: AD.qs('#ai-model').value.trim(),
        sttBaseUrl: AD.qs('#ai-stt-url').value.trim(),
        sttModel: AD.qs('#ai-stt-model').value.trim()
      };
      /* Only send a key field when one was typed. Sending an empty string means
         "clear it", and saving a changed model name must not wipe the key. */
      const k = AD.qs('#ai-key').value.trim();
      if (k) body.apiKey = k;
      const sk = AD.qs('#ai-stt-key').value.trim();
      if (sk) body.sttApiKey = sk;
      save(body, 'Saved.');
    });

    const clear = AD.qs('#ai-clear');
    if (clear) clear.addEventListener('click', () => save({ apiKey: '' }, 'The key has been removed.'));

    /* The button for the moment a key is first pasted in. The sweeper would find
       these papers within ten minutes anyway; what this saves is an owner having
       to take that on trust. It queues and returns - twenty papers is twenty
       minutes of marking and no browser waits that long - so the message says
       what was started, not what was finished. */
    const sweepBtn = AD.qs('#ai-sweep');
    if (sweepBtn) sweepBtn.addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      btn.disabled = true;
      try {
        const r = await AD.post('/admin/ai/sweep', {});
        out.innerHTML = '<div class="banner banner-success show"><span>' +
          (r.queued
            ? AD.esc(String(r.queued)) + ' paper(s) queued. They are marked one at a time; ' +
              'reload in a few minutes to see the count fall.'
            : 'Nothing is due a pass right now.') + '</span></div>';
      } catch (e) {
        out.innerHTML = '<div class="banner banner-error show"><span>' + AD.esc(e.message) + '</span></div>';
      }
      btn.disabled = false;
    });

    AD.qs('#ai-test').addEventListener('click', async (ev) => {
      const btn = ev.currentTarget;
      btn.disabled = true;
      out.innerHTML = '<p class="text-[13.5px] text-muted">Asking the model to mark one sample answer…</p>';
      try {
        const r = await AD.post('/admin/ai/test', {});
        out.innerHTML = '<div class="banner banner-success show"><span>Working. ' + AD.esc(r.model) +
          ' marked the sample ' + AD.esc(String(r.sample.score)) + '/10.</span></div>';
      } catch (e) {
        out.innerHTML = '<div class="banner banner-error show"><span>' + AD.esc(e.message) + '</span></div>';
      }
      btn.disabled = false;
      });
  }
  aiLoad();

  /* ---------------- Google Classroom ----------------
     Read-only for now: connect a teacher's account, list their courses, pull a
     roster and show which students already have an account here. Publishing
     coursework and pushing scores need a scope this does not ask for yet. */
  AD.qs('#p-general').insertAdjacentHTML('beforeend',
    '<div class="card p-6 sm:p-7 mt-6 grid gap-4 content-start" id="cr-card">' +
      '<div class="grid gap-1">' +
        '<h2 class="text-lg font-extrabold tracking-tight">Google Classroom</h2>' +
        '<p class="text-[13.5px] text-muted">Connect a teacher account to read its courses and rosters. ' +
          'Nothing is written to Classroom.</p>' +
      '</div>' +
      '<div id="cr-body"><div class="skeleton h-16 w-full rounded-2xl"></div></div>' +
    '</div>');

  const CR_MESSAGES = {
    linked: ['success', 'Google Classroom connected.'],
    disabled: ['warn', 'Classroom is not configured on this server.'],
    refused: ['warn', 'Google was not given permission, so nothing was connected.'],
    state: ['error', 'That sign-in did not match the one this browser started. Try again.'],
    'wrong-admin': ['error', 'That consent belonged to a different administrator.'],
    'no-refresh-token': ['error', 'Google returned no lasting permission. Remove the app under your Google account and connect again.'],
    exchange: ['error', 'Google refused the exchange.'],
    'no-code': ['error', 'Google sent nothing back to exchange.'],
    failed: ['error', 'The connection could not be completed.']
  };

  async function renderClassroom() {
    const body = AD.qs('#cr-body');
    let st;
    try { st = await AD.get('/admin/classroom'); }
    catch (e) { body.innerHTML = '<p class="text-[13.5px] text-danger">' + AD.esc(e.message) + '</p>'; return; }

    if (!st.enabled) {
      body.innerHTML =
        '<p class="text-[13.5px] text-muted">Not available on this server. Missing: ' +
        '<span class="font-mono">' + AD.esc((st.missing || []).join(', ')) + '</span>.</p>';
      return;
    }
    if (!st.linked) {
      body.innerHTML =
        '<div class="grid gap-3 justify-items-start">' +
          '<p class="text-[13.5px] text-muted">No account is connected. You will be asked to allow reading ' +
            'your course list and rosters.</p>' +
          '<a class="btn btn-primary btn-md" href="/auth/google/classroom">Connect a Google account</a>' +
        '</div>';
      return;
    }

    body.innerHTML =
      '<div class="grid gap-4">' +
        '<div class="flex flex-wrap items-center gap-3">' +
          '<span class="badge badge-ok">Connected</span>' +
          '<span class="text-[13.5px] font-semibold">' + AD.esc(st.email || 'a Google account') + '</span>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="cr-unlink">Disconnect</button>' +
        '</div>' +
        '<div class="grid sm:grid-cols-[1fr_auto] gap-3 items-end">' +
          '<div><label class="label" for="cr-course">Course</label>' +
            '<select class="input" id="cr-course"><option value="">Loading…</option></select></div>' +
          '<button type="button" class="btn btn-soft btn-md" id="cr-load">Show roster</button>' +
        '</div>' +
        '<div id="cr-roster"></div>' +
      '</div>';

    AD.qs('#cr-unlink').addEventListener('click', async () => {
      if (!confirm('Disconnect this Google account? Its permission is revoked at Google too.')) return;
      try { await AD.post('/admin/classroom/unlink', {}); AD.toast('Disconnected'); renderClassroom(); }
      catch (e) { AD.toast(e.message, 'error'); }
    });

    const select = AD.qs('#cr-course');
    try {
      const list = await AD.get('/admin/classroom/courses');
      select.innerHTML = list.courses.length
        ? list.courses.map(c => '<option value="' + AD.esc(c.id) + '">' + AD.esc(c.name) +
            (c.section ? ' · ' + AD.esc(c.section) : '') + '</option>').join('')
        : '<option value="">No active courses</option>';
    } catch (e) {
      select.innerHTML = '<option value="">' + AD.esc(e.message) + '</option>';
    }

    AD.qs('#cr-load').addEventListener('click', async () => {
      const id = select.value;
      const out = AD.qs('#cr-roster');
      if (!id) { out.innerHTML = ''; return; }
      out.innerHTML = '<div class="skeleton h-24 w-full rounded-2xl"></div>';
      try {
        const r = await AD.get('/admin/classroom/courses/' + encodeURIComponent(id) + '/roster');
        out.innerHTML = r.students.length
          ? '<div class="card overflow-hidden"><div class="overflow-x-auto">' +
              '<table class="w-full text-[14px]"><thead><tr>' +
                '<th class="th">Student</th><th class="th">Email</th><th class="th">Account here</th>' +
              '</tr></thead><tbody>' +
              r.students.map(stu =>
                '<tr class="border-t border-line">' +
                  '<td class="td font-semibold">' + AD.esc(stu.name || '-') + '</td>' +
                  '<td class="td text-muted">' + AD.esc(stu.email || 'not shared') + '</td>' +
                  '<td class="td">' + (stu.localUserId
                    ? '<span class="badge badge-ok">' + AD.esc(stu.localName || 'linked') + '</span>'
                    : '<span class="text-muted">no account yet</span>') + '</td>' +
                '</tr>').join('') +
              '</tbody></table></div></div>' +
              (r.more ? '<p class="help mt-2">Only the first page is shown.</p>' : '')
          : '<p class="text-[13.5px] text-muted">This course has no students.</p>';
      } catch (e) {
        out.innerHTML = '<p class="text-[13.5px] text-danger">' + AD.esc(e.message) + '</p>';
      }
    });
  }

  const crParam = new URLSearchParams(location.search).get('classroom');
  if (crParam) {
    const said = CR_MESSAGES[crParam] || ['warn', 'Classroom: ' + crParam];
    AD.toast(said[1], said[0] === 'success' ? undefined : 'error');
    /* Taken back out of the address bar, so a reload does not re-announce it
       and the reference does not end up in a bookmark. */
    history.replaceState(null, '', location.pathname);
  }
  renderClassroom();

  AD.qs('#g-save').addEventListener('click', async () => {
    AD.qs('#g-ok').classList.remove('show');
    try {
      await AD.put('/admin/settings', { settings: {
        'brand.name': AD.qs('#g-name').value,
        'brand.tenant': AD.qs('#g-tenant').value,
        'platform.notice': AD.qs('#g-notice').value
      }});
      AD.qs('#g-ok').classList.add('show');
      AD.toast('Platform configuration saved');
    } catch (e) { AD.toast(e.message, 'error'); }
  });

  /* ---------------- Plans on sale ---------------- */
  AD.qs('#p-packages').innerHTML =
    '<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">' + S.packages.map(p =>
      '<article class="card p-6" data-pkg="' + AD.esc(p.id) + '">' +
        '<div class="flex items-center gap-2">' +
          '<h3 class="font-extrabold text-[17px] tracking-tight">' + AD.esc(p.name) + '</h3>' +
          (p.featured ? '<span class="badge badge-hl ms-auto">Featured</span>' : '') +
        '</div>' +
        '<p class="text-muted text-[13.5px] leading-relaxed mt-2 min-h-[42px]">' + AD.esc(p.description) + '</p>' +
        '<label class="label mt-4" for="pk-' + AD.esc(p.id) + '">Price (VND)</label>' +
        '<input class="input" id="pk-' + AD.esc(p.id) + '" type="number" min="0" step="1000" value="' + p.price + '" data-price>' +
        '<label class="flex items-center gap-2.5 text-[14px] font-medium text-muted mt-3.5">' +
          '<input type="checkbox" class="w-4 h-4 rounded accent-[color:var(--color-accent)]" data-active ' + (p.active ? 'checked' : '') + '>' +
          'On sale</label>' +
        '<button type="button" class="btn btn-soft btn-md w-full mt-4" data-save>Save plan</button>' +
      '</article>').join('') + '</div>';

  AD.qsa('[data-pkg]').forEach(card => {
    card.querySelector('[data-save]').addEventListener('click', async () => {
      const id = card.getAttribute('data-pkg');
      try {
        await AD.put('/admin/packages/' + encodeURIComponent(id), {
          price: +card.querySelector('[data-price]').value || 0,
          active: card.querySelector('[data-active]').checked
        });
        AD.toast('Plan saved');
      } catch (e) { AD.toast(e.message, 'error'); }
    });
  });

  /* ---------------- Admin account ---------------- */
  AD.qs('#p-account').innerHTML =
    '<div class="grid lg:grid-cols-12 gap-6">' +
      '<form id="pw-form" class="lg:col-span-7 card p-6 sm:p-7 grid gap-5 content-start" novalidate>' +
        '<h2 class="text-lg font-extrabold tracking-tight">Change password</h2>' +
        '<div><label class="label" for="cur">Current password</label>' +
          '<input class="input" id="cur" type="password" autocomplete="current-password"></div>' +
        '<div><label class="label" for="np">New password</label>' +
          '<input class="input" id="np" type="password" autocomplete="new-password" placeholder="At least 10 characters, with letters and digits">' +
          '<p class="help">Changing it signs out every device.</p></div>' +
        '<div><label class="label" for="re">Repeat the new password</label>' +
          '<input class="input" id="re" type="password" autocomplete="new-password"></div>' +
        '<div class="banner banner-error" id="pw-err"><span id="pw-err-text"></span></div>' +
        '<button type="submit" class="btn btn-primary btn-md justify-self-start">Update password</button>' +
      '</form>' +
      '<div class="lg:col-span-5 card p-6">' +
        '<h2 class="text-lg font-extrabold tracking-tight">Administrators</h2>' +
        '<ul class="grid gap-3 mt-4">' + S.admins.map(a =>
          '<li class="flex items-center gap-3 py-2 border-b border-line last:border-0">' +
            '<span class="w-9 h-9 rounded-full bg-brand-soft text-brand-strong text-[12px] font-extrabold inline-flex items-center justify-center shrink-0">' +
              AD.esc((a.name || a.username).slice(0, 2).toUpperCase()) + '</span>' +
            '<span class="min-w-0 flex-1"><b class="block text-[14px] truncate">' + AD.esc(a.name) + '</b>' +
              '<span class="block text-[12.5px] text-muted truncate">@' + AD.esc(a.username) + '</span></span>' +
            '<span class="badge badge-muted shrink-0">' + (a.role === 'owner' ? 'Owner' : 'Editor') + '</span>' +
          '</li>').join('') + '</ul>' +
        '<p class="help mt-4">Adding administrators comes with the detailed permissions work.</p>' +
      '</div>' +
      /* Two-factor. Rendered as its own card rather than folded into the password
         form: they are different decisions, and putting a switch that can lock you
         out next to a field you edit casually is asking for an accident. */
      '<div class="lg:col-span-12 card p-6 sm:p-7 grid gap-5" id="tf-card">' +
        '<div class="flex items-start gap-4 flex-wrap">' +
          '<div class="min-w-0 flex-1">' +
            '<h2 class="text-lg font-extrabold tracking-tight">Two-factor sign-in</h2>' +
            '<p class="help mt-1">A code from an authenticator app, on top of your password. ' +
              'The admin area holds every account, test and activation code.</p>' +
          '</div>' +
          '<span class="badge badge-muted shrink-0" id="tf-state">Checking…</span>' +
        '</div>' +
        '<div id="tf-body" class="grid gap-5"></div>' +
      '</div>' +
    '</div>';

  /* ---- Two-factor: the same two-step flow scripts/accounts.js runs ---- */
  const tfBody = AD.qs('#tf-body'), tfState = AD.qs('#tf-state');
  let pendingSecret = '';

  const tfError = msg => {
    const box = AD.qs('#tf-err');
    if (!box) return;
    AD.qs('#tf-err-text').textContent = msg;
    box.classList.add('show');
  };

  async function tfRender() {
    const s = await AD.get('/admin/totp');
    tfState.textContent = s.enabled ? 'On' : 'Off';
    tfState.className = 'badge shrink-0 ' + (s.enabled ? 'badge-ok' : 'badge-muted');

    if (s.enabled) {
      tfBody.innerHTML =
        '<p class="text-[14px]">On since <b>' + AD.esc((s.enabledAt || '').slice(0, 10)) + '</b>. ' +
          '<b>' + s.recoveryLeft + '</b> recovery code' + (s.recoveryLeft === 1 ? '' : 's') + ' left.</p>' +
        (s.recoveryLeft <= 2
          ? '<div class="banner banner-warn show"><span>Few recovery codes left. Turn two-factor off and on again to get a fresh set.</span></div>'
          : '') +
        '<div class="banner banner-error" id="tf-err"><span id="tf-err-text"></span></div>' +
        '<div class="grid sm:grid-cols-[1fr_auto] gap-3 items-end max-w-xl">' +
          '<div><label class="label" for="tf-pw">Your password, to turn it off</label>' +
            '<input class="input" id="tf-pw" type="password" autocomplete="current-password"></div>' +
          '<button type="button" class="btn btn-ghost btn-md" id="tf-off">Turn off</button>' +
        '</div>' +
        '<p class="help">Lost the phone and the recovery codes? ' +
          '<code>node scripts/accounts.js totp-disable</code> on the server is the way back in.</p>';
      AD.qs('#tf-off').addEventListener('click', async () => {
        AD.qs('#tf-err').classList.remove('show');
        try {
          await AD.post('/admin/totp/disable', { password: AD.qs('#tf-pw').value });
          await tfRender();
        } catch (e) { tfError(e.message); }
      });
      return;
    }

    tfBody.innerHTML =
      '<div class="banner banner-error" id="tf-err"><span id="tf-err-text"></span></div>' +
      '<button type="button" class="btn btn-primary btn-md justify-self-start" id="tf-start">Set up two-factor</button>';
    AD.qs('#tf-start').addEventListener('click', async () => {
      AD.qs('#tf-err').classList.remove('show');
      try {
        const r = await AD.post('/admin/totp/start');
        pendingSecret = r.secret;
        tfStep2(r);
      } catch (e) { tfError(e.message); }
    });
  }

  /* Step two shows the secret and asks for a code from it. Nothing is switched on
     until that code checks out - the point of the two steps is that an
     authenticator which never received the secret cannot pass this. */
  function tfStep2(r) {
    tfBody.innerHTML =
      '<ol class="grid gap-2 text-[14px] list-decimal ms-5">' +
        '<li>Add this to your authenticator app.</li>' +
        '<li>Type the six digits it shows.</li>' +
      '</ol>' +
      '<div><span class="label">Secret</span>' +
        '<code class="block card p-3 text-[15px] tracking-[0.2em] break-all select-all" id="tf-secret">' +
          AD.esc(r.secret.replace(/(.{4})/g, '$1 ').trim()) + '</code>' +
        '<p class="help">Type it in by hand - the app will ask for a name too, use ' +
          '<b>VPET Prep</b>. There is no QR code yet.</p></div>' +
      '<div class="banner banner-error" id="tf-err"><span id="tf-err-text"></span></div>' +
      '<div class="grid sm:grid-cols-[1fr_auto_auto] gap-3 items-end max-w-xl">' +
        '<div><label class="label" for="tf-code">Code from the app</label>' +
          '<input class="input tracking-[0.3em] text-center" id="tf-code" inputmode="numeric" ' +
            'maxlength="6" placeholder="000000" autocomplete="one-time-code"></div>' +
        '<button type="button" class="btn btn-primary btn-md" id="tf-confirm">Turn on</button>' +
        '<button type="button" class="btn btn-ghost btn-md" id="tf-cancel">Cancel</button>' +
      '</div>' +
      '<p class="help">Nothing is switched on until that code checks out.</p>';

    AD.qs('#tf-cancel').addEventListener('click', () => { pendingSecret = ''; tfRender(); });
    AD.qs('#tf-confirm').addEventListener('click', async () => {
      AD.qs('#tf-err').classList.remove('show');
      try {
        const done = await AD.post('/admin/totp/enable',
          { secret: pendingSecret, code: AD.qs('#tf-code').value });
        pendingSecret = '';
        tfRecovery(done.recoveryCodes);
      } catch (e) { tfError(e.message); }
    });
  }

  /* The codes are shown exactly here and never again: only their hashes are kept,
     so no later request can reproduce them. The screen says so plainly rather
     than letting somebody assume they can come back for them. */
  function tfRecovery(codes) {
    tfState.textContent = 'On';
    tfState.className = 'badge badge-ok shrink-0';
    tfBody.innerHTML =
      '<div class="banner banner-success show"><span>Two-factor is on.</span></div>' +
      '<div><span class="label">Recovery codes - write these down now</span>' +
        '<ul class="card p-4 grid sm:grid-cols-2 gap-x-8 gap-y-1 mt-1 font-mono text-[14px] select-all">' +
          codes.map(c => '<li>' + AD.esc(c) + '</li>').join('') + '</ul>' +
        '<p class="help">Shown once. Only their hashes are stored, so nothing and nobody can print ' +
          'them again. Each works once, in place of a code from the app.</p></div>' +
      '<button type="button" class="btn btn-ghost btn-md justify-self-start" id="tf-done">I have written them down</button>';
    AD.qs('#tf-done').addEventListener('click', tfRender);
  }

  tfRender().catch(() => {
    tfState.textContent = 'Unavailable';
    tfBody.innerHTML = '<p class="help">Could not read the two-factor state.</p>';
  });

  AD.qs('#pw-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const err = AD.qs('#pw-err');
    err.classList.remove('show');
    const cur = AD.qs('#cur').value, np = AD.qs('#np').value, re = AD.qs('#re').value;
    if (np !== re) {
      AD.qs('#pw-err-text').textContent = 'The two new passwords do not match.';
      err.classList.add('show');
      return;
    }
    try {
      await AD.post('/admin/password', { current: cur, next: np });
      AD.toast('Password changed; signing out…');
      setTimeout(() => { location.href = '/admin/dang-nhap/'; }, 1200);
    } catch (e) {
      AD.qs('#pw-err-text').textContent = e.message;
      err.classList.add('show');
    }
  });

  /* ---------------- Audit log ---------------- */
  let auditLoaded = false;
  async function loadAudit() {
    if (auditLoaded) return;
    auditLoaded = true;
    AD.qs('#p-audit').innerHTML = AD.skeletonRows(6);
    try {
      const { items } = await AD.get('/admin/audit?limit=100');
      AD.qs('#p-audit').innerHTML = items.length
        ? '<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-[14px]">' +
          '<thead><tr class="text-[12px] uppercase tracking-wide text-muted border-b border-line bg-surface">' +
            '<th class="text-left font-bold px-5 py-3">When</th>' +
            '<th class="text-left font-bold px-4 py-3">Who</th>' +
            '<th class="text-left font-bold px-4 py-3">Action</th>' +
            '<th class="text-left font-bold px-5 py-3 hidden md:table-cell">Target</th>' +
          '</tr></thead><tbody>' +
          items.map(a =>
            '<tr class="border-b border-line last:border-0">' +
              '<td class="px-5 py-3 text-muted whitespace-nowrap">' + AD.dateTime(a.at) + '</td>' +
              '<td class="px-4 py-3 font-semibold">' + AD.esc(a.admin || '-') + '</td>' +
              '<td class="px-4 py-3"><code class="text-[13px]">' + AD.esc(a.action) + '</code></td>' +
              '<td class="px-5 py-3 hidden md:table-cell text-muted truncate max-w-[260px]">' + AD.esc(a.target || '-') + '</td>' +
            '</tr>').join('') +
          '</tbody></table></div></div>'
        : AD.emptyBox('history', 'No actions yet', 'Every administrator change is recorded here.');
    } catch (e) {
      AD.qs('#p-audit').innerHTML = AD.errorBox(e.message);
      auditLoaded = false;
    }
  }

  if (location.hash === '#nhat-ky') AD.qs('#tab-audit').click();
})();
</script>
</body>
</html>
