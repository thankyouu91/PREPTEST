<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration · VPET Prep</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="settings" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-10">
      <div role="tablist" aria-label="Administration sections" class="flex gap-2 overflow-x-auto no-scrollbar border-b border-line mb-7 -mx-1 px-1">
        <button role="tab" id="tab-general" aria-controls="p-general" aria-selected="true" class="tabbtn">Platform</button>
        <button role="tab" id="tab-packages" aria-controls="p-packages" aria-selected="false" class="tabbtn">Plans</button>
        <button role="tab" id="tab-account" aria-controls="p-account" aria-selected="false" class="tabbtn">Admin account</button>
        <button role="tab" id="tab-audit" aria-controls="p-audit" aria-selected="false" class="tabbtn">Audit log</button>
      </div>

      <section role="tabpanel" id="p-general" aria-labelledby="tab-general"><div class="skeleton h-40 w-full rounded-2xl"></div></section>
      <section role="tabpanel" id="p-packages" aria-labelledby="tab-packages" hidden></section>
      <section role="tabpanel" id="p-account" aria-labelledby="tab-account" hidden></section>
      <section role="tabpanel" id="p-audit" aria-labelledby="tab-audit" hidden></section>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
(async () => {
  const me = await AD.mount({ title: 'Administration', subtitle: 'Platform configuration, the plans on sale, and the audit log' });

  const tabs = [['tab-general','p-general'],['tab-packages','p-packages'],['tab-account','p-account'],['tab-audit','p-audit']];
  tabs.forEach(([tid, pid]) => AD.qs('#' + tid).addEventListener('click', () => {
    tabs.forEach(([t2, p2]) => {
      const on = t2 === tid;
      AD.qs('#' + t2).setAttribute('aria-selected', String(on));
      AD.qs('#' + p2).toggleAttribute('hidden', !on);
    });
    if (pid === 'p-audit') loadAudit();
    history.replaceState(null, '', pid === 'p-audit' ? '#nhat-ky' : location.pathname);
  }));

  let S;
  try {
    S = await AD.get('/admin/settings');
  } catch (e) {
    AD.qs('#p-general').innerHTML = AD.errorBox(e.message, 'retry');
    AD.qs('#retry').addEventListener('click', () => location.reload());
    return;
  }

  /* ---------------- Platform ---------------- */
  AD.qs('#p-general').innerHTML =
    '<div class="grid lg:grid-cols-12 gap-6">' +
      '<div class="lg:col-span-7 card p-6 sm:p-7 grid gap-5 content-start">' +
        '<h2 class="text-lg font-extrabold tracking-tight">Branding</h2>' +
        '<div><label class="label" for="g-name">Display name</label>' +
          '<input class="input" id="g-name" value="' + AD.esc(S.settings['brand.name'] || '') + '">' +
          '<p class="help">Shown at the top of the sidebar and on the landing page.</p></div>' +
        '<div><label class="label" for="g-tenant">Tenant palette</label>' +
          '<select class="input" id="g-tenant">' +
            ['default', 'evergreen', 'sunrise'].map(t2 =>
              '<option value="' + t2 + '"' + ((S.settings['brand.tenant'] || 'default') === t2 ? ' selected' : '') + '>' +
              (t2 === 'default' ? 'Default (navy + teal)' : t2 === 'evergreen' ? 'Evergreen (green)' : 'Sunrise (burnt orange)') +
              '</option>').join('') + '</select></div>' +
        '<div><label class="label" for="g-notice">Platform-wide notice</label>' +
          '<input class="input" id="g-notice" value="' + AD.esc(S.settings['platform.notice'] || '') + '" placeholder="Leave blank to show nothing">' +
          '<p class="help">A short line for students, a maintenance window for instance.</p></div>' +
        '<div class="banner banner-success" id="g-ok"><span>Configuration saved.</span></div>' +
        '<button type="button" id="g-save" class="btn btn-primary btn-md justify-self-start">Save configuration</button>' +
      '</div>' +
      '<div class="lg:col-span-5 card p-6">' +
        '<h2 class="text-lg font-extrabold tracking-tight">Exams</h2>' +
        '<p class="text-[13.5px] text-muted mt-1 mb-4">The fixed catalogue of the platform.</p>' +
        '<ul class="grid gap-2.5">' + S.families.map(f =>
          '<li class="flex items-center gap-3 py-2 border-b border-line last:border-0">' +
            '<span class="exam-chip shrink-0" data-family="' + f.id + '">' + AD.esc(f.name) + '</span>' +
            '<span class="text-[13.5px] text-muted truncate">' + AD.esc(f.format) + '</span>' +
          '</li>').join('') + '</ul>' +
      '</div>' +
    '</div>';

  AD.qs('#g-save').addEventListener('click', async () => {
    AD.qs('#g-ok').classList.remove('show');
    try {
      await AD.put('/admin/settings', { settings: {
        'brand.name': AD.qs('#g-name').value,
        'brand.tenant': AD.qs('#g-tenant').value,
        'platform.notice': AD.qs('#g-notice').value
      }});
      AD.qs('#g-ok').classList.add('show');
      AD.toast('Platform configuration saved');
    } catch (e) { AD.toast(e.message, 'error'); }
  });

  /* ---------------- Plans on sale ---------------- */
  AD.qs('#p-packages').innerHTML =
    '<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-5">' + S.packages.map(p =>
      '<article class="card p-6" data-pkg="' + AD.esc(p.id) + '">' +
        '<div class="flex items-center gap-2">' +
          '<h3 class="font-extrabold text-[17px] tracking-tight">' + AD.esc(p.name) + '</h3>' +
          (p.featured ? '<span class="badge badge-hl ms-auto">Featured</span>' : '') +
        '</div>' +
        '<p class="text-muted text-[13.5px] leading-relaxed mt-2 min-h-[42px]">' + AD.esc(p.description) + '</p>' +
        '<label class="label mt-4" for="pk-' + AD.esc(p.id) + '">Price (VND)</label>' +
        '<input class="input" id="pk-' + AD.esc(p.id) + '" type="number" min="0" step="1000" value="' + p.price + '" data-price>' +
        '<label class="flex items-center gap-2.5 text-[14px] font-medium text-muted mt-3.5">' +
          '<input type="checkbox" class="w-4 h-4 rounded accent-[color:var(--color-accent)]" data-active ' + (p.active ? 'checked' : '') + '>' +
          'On sale</label>' +
        '<button type="button" class="btn btn-soft btn-md w-full mt-4" data-save>Save plan</button>' +
      '</article>').join('') + '</div>';

  AD.qsa('[data-pkg]').forEach(card => {
    card.querySelector('[data-save]').addEventListener('click', async () => {
      const id = card.getAttribute('data-pkg');
      try {
        await AD.put('/admin/packages/' + encodeURIComponent(id), {
          price: +card.querySelector('[data-price]').value || 0,
          active: card.querySelector('[data-active]').checked
        });
        AD.toast('Plan saved');
      } catch (e) { AD.toast(e.message, 'error'); }
    });
  });

  /* ---------------- Admin account ---------------- */
  AD.qs('#p-account').innerHTML =
    '<div class="grid lg:grid-cols-12 gap-6">' +
      '<form id="pw-form" class="lg:col-span-7 card p-6 sm:p-7 grid gap-5 content-start" novalidate>' +
        '<h2 class="text-lg font-extrabold tracking-tight">Change password</h2>' +
        '<div><label class="label" for="cur">Current password</label>' +
          '<input class="input" id="cur" type="password" autocomplete="current-password"></div>' +
        '<div><label class="label" for="np">New password</label>' +
          '<input class="input" id="np" type="password" autocomplete="new-password" placeholder="At least 10 characters, with letters and digits">' +
          '<p class="help">Changing it signs out every device.</p></div>' +
        '<div><label class="label" for="re">Repeat the new password</label>' +
          '<input class="input" id="re" type="password" autocomplete="new-password"></div>' +
        '<div class="banner banner-error" id="pw-err"><span id="pw-err-text"></span></div>' +
        '<button type="submit" class="btn btn-primary btn-md justify-self-start">Update password</button>' +
      '</form>' +
      '<div class="lg:col-span-5 card p-6">' +
        '<h2 class="text-lg font-extrabold tracking-tight">Administrators</h2>' +
        '<ul class="grid gap-3 mt-4">' + S.admins.map(a =>
          '<li class="flex items-center gap-3 py-2 border-b border-line last:border-0">' +
            '<span class="w-9 h-9 rounded-full bg-brand-soft text-brand-strong text-[12px] font-extrabold inline-flex items-center justify-center shrink-0">' +
              AD.esc((a.name || a.username).slice(0, 2).toUpperCase()) + '</span>' +
            '<span class="min-w-0 flex-1"><b class="block text-[14px] truncate">' + AD.esc(a.name) + '</b>' +
              '<span class="block text-[12.5px] text-muted truncate">@' + AD.esc(a.username) + '</span></span>' +
            '<span class="badge badge-muted shrink-0">' + (a.role === 'owner' ? 'Owner' : 'Editor') + '</span>' +
          '</li>').join('') + '</ul>' +
        '<p class="help mt-4">Adding administrators comes with the detailed permissions work.</p>' +
      '</div>' +
      /* Two-factor. Rendered as its own card rather than folded into the password
         form: they are different decisions, and putting a switch that can lock you
         out next to a field you edit casually is asking for an accident. */
      '<div class="lg:col-span-12 card p-6 sm:p-7 grid gap-5" id="tf-card">' +
        '<div class="flex items-start gap-4 flex-wrap">' +
          '<div class="min-w-0 flex-1">' +
            '<h2 class="text-lg font-extrabold tracking-tight">Two-factor sign-in</h2>' +
            '<p class="help mt-1">A code from an authenticator app, on top of your password. ' +
              'The admin area holds every account, test and activation code.</p>' +
          '</div>' +
          '<span class="badge badge-muted shrink-0" id="tf-state">Checking…</span>' +
        '</div>' +
        '<div id="tf-body" class="grid gap-5"></div>' +
      '</div>' +
    '</div>';

  /* ---- Two-factor: the same two-step flow scripts/accounts.js runs ---- */
  const tfBody = AD.qs('#tf-body'), tfState = AD.qs('#tf-state');
  let pendingSecret = '';

  const tfError = msg => {
    const box = AD.qs('#tf-err');
    if (!box) return;
    AD.qs('#tf-err-text').textContent = msg;
    box.classList.add('show');
  };

  async function tfRender() {
    const s = await AD.get('/admin/totp');
    tfState.textContent = s.enabled ? 'On' : 'Off';
    tfState.className = 'badge shrink-0 ' + (s.enabled ? 'badge-ok' : 'badge-muted');

    if (s.enabled) {
      tfBody.innerHTML =
        '<p class="text-[14px]">On since <b>' + AD.esc((s.enabledAt || '').slice(0, 10)) + '</b>. ' +
          '<b>' + s.recoveryLeft + '</b> recovery code' + (s.recoveryLeft === 1 ? '' : 's') + ' left.</p>' +
        (s.recoveryLeft <= 2
          ? '<div class="banner banner-warn show"><span>Few recovery codes left. Turn two-factor off and on again to get a fresh set.</span></div>'
          : '') +
        '<div class="banner banner-error" id="tf-err"><span id="tf-err-text"></span></div>' +
        '<div class="grid sm:grid-cols-[1fr_auto] gap-3 items-end max-w-xl">' +
          '<div><label class="label" for="tf-pw">Your password, to turn it off</label>' +
            '<input class="input" id="tf-pw" type="password" autocomplete="current-password"></div>' +
          '<button type="button" class="btn btn-ghost btn-md" id="tf-off">Turn off</button>' +
        '</div>' +
        '<p class="help">Lost the phone and the recovery codes? ' +
          '<code>node scripts/accounts.js totp-disable</code> on the server is the way back in.</p>';
      AD.qs('#tf-off').addEventListener('click', async () => {
        AD.qs('#tf-err').classList.remove('show');
        try {
          await AD.post('/admin/totp/disable', { password: AD.qs('#tf-pw').value });
          await tfRender();
        } catch (e) { tfError(e.message); }
      });
      return;
    }

    tfBody.innerHTML =
      '<div class="banner banner-error" id="tf-err"><span id="tf-err-text"></span></div>' +
      '<button type="button" class="btn btn-primary btn-md justify-self-start" id="tf-start">Set up two-factor</button>';
    AD.qs('#tf-start').addEventListener('click', async () => {
      AD.qs('#tf-err').classList.remove('show');
      try {
        const r = await AD.post('/admin/totp/start');
        pendingSecret = r.secret;
        tfStep2(r);
      } catch (e) { tfError(e.message); }
    });
  }

  /* Step two shows the secret and asks for a code from it. Nothing is switched on
     until that code checks out — the point of the two steps is that an
     authenticator which never received the secret cannot pass this. */
  function tfStep2(r) {
    tfBody.innerHTML =
      '<ol class="grid gap-2 text-[14px] list-decimal ms-5">' +
        '<li>Add this to your authenticator app.</li>' +
        '<li>Type the six digits it shows.</li>' +
      '</ol>' +
      '<div><span class="label">Secret</span>' +
        '<code class="block card p-3 text-[15px] tracking-[0.2em] break-all select-all" id="tf-secret">' +
          AD.esc(r.secret.replace(/(.{4})/g, '$1 ').trim()) + '</code>' +
        '<p class="help">Type it in by hand — the app will ask for a name too, use ' +
          '<b>VPET Prep</b>. There is no QR code yet.</p></div>' +
      '<div class="banner banner-error" id="tf-err"><span id="tf-err-text"></span></div>' +
      '<div class="grid sm:grid-cols-[1fr_auto_auto] gap-3 items-end max-w-xl">' +
        '<div><label class="label" for="tf-code">Code from the app</label>' +
          '<input class="input tracking-[0.3em] text-center" id="tf-code" inputmode="numeric" ' +
            'maxlength="6" placeholder="000000" autocomplete="one-time-code"></div>' +
        '<button type="button" class="btn btn-primary btn-md" id="tf-confirm">Turn on</button>' +
        '<button type="button" class="btn btn-ghost btn-md" id="tf-cancel">Cancel</button>' +
      '</div>' +
      '<p class="help">Nothing is switched on until that code checks out.</p>';

    AD.qs('#tf-cancel').addEventListener('click', () => { pendingSecret = ''; tfRender(); });
    AD.qs('#tf-confirm').addEventListener('click', async () => {
      AD.qs('#tf-err').classList.remove('show');
      try {
        const done = await AD.post('/admin/totp/enable',
          { secret: pendingSecret, code: AD.qs('#tf-code').value });
        pendingSecret = '';
        tfRecovery(done.recoveryCodes);
      } catch (e) { tfError(e.message); }
    });
  }

  /* The codes are shown exactly here and never again: only their hashes are kept,
     so no later request can reproduce them. The screen says so plainly rather
     than letting somebody assume they can come back for them. */
  function tfRecovery(codes) {
    tfState.textContent = 'On';
    tfState.className = 'badge badge-ok shrink-0';
    tfBody.innerHTML =
      '<div class="banner banner-success show"><span>Two-factor is on.</span></div>' +
      '<div><span class="label">Recovery codes — write these down now</span>' +
        '<ul class="card p-4 grid sm:grid-cols-2 gap-x-8 gap-y-1 mt-1 font-mono text-[14px] select-all">' +
          codes.map(c => '<li>' + AD.esc(c) + '</li>').join('') + '</ul>' +
        '<p class="help">Shown once. Only their hashes are stored, so nothing and nobody can print ' +
          'them again. Each works once, in place of a code from the app.</p></div>' +
      '<button type="button" class="btn btn-ghost btn-md justify-self-start" id="tf-done">I have written them down</button>';
    AD.qs('#tf-done').addEventListener('click', tfRender);
  }

  tfRender().catch(() => {
    tfState.textContent = 'Unavailable';
    tfBody.innerHTML = '<p class="help">Could not read the two-factor state.</p>';
  });

  AD.qs('#pw-form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const err = AD.qs('#pw-err');
    err.classList.remove('show');
    const cur = AD.qs('#cur').value, np = AD.qs('#np').value, re = AD.qs('#re').value;
    if (np !== re) {
      AD.qs('#pw-err-text').textContent = 'The two new passwords do not match.';
      err.classList.add('show');
      return;
    }
    try {
      await AD.post('/admin/password', { current: cur, next: np });
      AD.toast('Password changed; signing out…');
      setTimeout(() => { location.href = '/admin/dang-nhap/'; }, 1200);
    } catch (e) {
      AD.qs('#pw-err-text').textContent = e.message;
      err.classList.add('show');
    }
  });

  /* ---------------- Audit log ---------------- */
  let auditLoaded = false;
  async function loadAudit() {
    if (auditLoaded) return;
    auditLoaded = true;
    AD.qs('#p-audit').innerHTML = AD.skeletonRows(6);
    try {
      const { items } = await AD.get('/admin/audit?limit=100');
      AD.qs('#p-audit').innerHTML = items.length
        ? '<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-[14px]">' +
          '<thead><tr class="text-[12px] uppercase tracking-wide text-muted border-b border-line bg-surface">' +
            '<th class="text-left font-bold px-5 py-3">When</th>' +
            '<th class="text-left font-bold px-4 py-3">Who</th>' +
            '<th class="text-left font-bold px-4 py-3">Action</th>' +
            '<th class="text-left font-bold px-5 py-3 hidden md:table-cell">Target</th>' +
          '</tr></thead><tbody>' +
          items.map(a =>
            '<tr class="border-b border-line last:border-0">' +
              '<td class="px-5 py-3 text-muted whitespace-nowrap">' + AD.dateTime(a.at) + '</td>' +
              '<td class="px-4 py-3 font-semibold">' + AD.esc(a.admin || '—') + '</td>' +
              '<td class="px-4 py-3"><code class="text-[13px]">' + AD.esc(a.action) + '</code></td>' +
              '<td class="px-5 py-3 hidden md:table-cell text-muted truncate max-w-[260px]">' + AD.esc(a.target || '—') + '</td>' +
            '</tr>').join('') +
          '</tbody></table></div></div>'
        : AD.emptyBox('history', 'No actions yet', 'Every administrator change is recorded here.');
    } catch (e) {
      AD.qs('#p-audit').innerHTML = AD.errorBox(e.message);
      auditLoaded = false;
    }
  }

  if (location.hash === '#nhat-ky') AD.qs('#tab-audit').click();
})();
</script>
</body>
</html>
