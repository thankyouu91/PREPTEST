<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students · VPET Prep admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="users" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-10">

      <div class="flex flex-wrap items-center gap-2.5 mb-6">
        <div class="flex gap-2 flex-wrap">
          <button type="button" class="chip" data-f="" aria-pressed="true">All</button>
          <button type="button" class="chip" data-f="verified" aria-pressed="false">Verified</button>
          <button type="button" class="chip" data-f="unverified" aria-pressed="false">Not verified</button>
          <button type="button" class="chip" data-f="locked" aria-pressed="false">Locked</button>
        </div>
        <label class="relative ms-auto min-w-[220px]">
          <span class="sr-only">Search students</span>
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none" id="search-icon"></span>
          <input id="q" type="search" class="input ps-10 py-2.5" placeholder="Search by name or email…">
        </label>
        <button type="button" id="bulk-students" class="btn btn-ghost btn-md">Bulk create</button>
        <button type="button" id="new-student" class="btn btn-primary btn-md">New student</button>
      </div>

      <p class="text-[13.5px] font-semibold text-muted mb-3" id="count">Loading…</p>
      <div id="list"><div class="card p-5 grid gap-3.5">
        <div class="skeleton h-6 w-11/12"></div><div class="skeleton h-6 w-full"></div><div class="skeleton h-6 w-4/5"></div>
      </div></div>
      <div class="flex justify-center gap-2.5 mt-6" id="pager"></div>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
(async () => {
  await AD.mount({ title: 'Account Management', subtitle: 'Create accounts one at a time or in bulk, and manage each one' });
  AD.qs('#search-icon').innerHTML = AD.icon('search', 'w-[18px] h-[18px]');

  let families = [];
  let plans = [];
  try {
    const cat = await AD.get('/catalog');
    families = cat.families || [];
    /* The three plans ARE the three terms — 3, 6 and 12 months. Read from the
       server rather than typed in here, so a change to the price list moves
       this screen with it instead of leaving it quietly wrong. */
    plans = cat.plans || [];
  } catch (e) {}
  const famName = id => (families.find(f => f.id === id) || {}).name || id;

  /**
   * Show a generated password once.
   *
   * The column holds a scrypt hash, so this is the only moment it is readable
   * anywhere — after this modal closes nobody, including the administrator who
   * created it, can get it back. Said plainly, and with a copy button, because
   * the alternative is somebody squinting at a toast that has already gone.
   */
  function showOnce(title, password) {
    if (!password) return;
    const m = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">' + AD.esc(title) + '</h3>' +
      '<p class="text-muted text-[14px] leading-relaxed mt-2">Write this down now. It is stored ' +
        'only as a hash, so this is the one and only time it can be read.</p>' +
      '<div class="card bg-brand-soft border-0 p-4 mt-4 flex items-center gap-3">' +
        '<code class="font-mono text-[16px] font-extrabold tracking-tight break-all flex-1" id="once-pw">' +
          AD.esc(password) + '</code>' +
        '<button type="button" class="btn btn-ghost btn-sm shrink-0" id="once-copy">Copy</button>' +
      '</div>' +
      '<div class="flex justify-end mt-5"><button type="button" class="btn btn-primary btn-md" id="once-done">Done</button></div>');
    m.el.querySelector('#once-copy').addEventListener('click', () => {
      navigator.clipboard.writeText(password).then(
        () => AD.toast('Copied'), () => AD.toast('Could not copy — select it by hand', 'error'));
    });
    m.el.querySelector('#once-done').addEventListener('click', () => m.close());
  }

  /* ----- Creating an account from this side of the platform -----
     Students normally sign themselves up. A centre needs the other way round:
     somebody pays at a desk, or a class arrives at once. */
  AD.qs('#new-student').addEventListener('click', () => {
    const m = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">New student</h3>' +
      '<p class="text-muted text-[14px] leading-relaxed mt-1.5">The account is created already ' +
        'verified — you have confirmed the address yourself — and can be given a term at the ' +
        'same time.</p>' +
      '<div class="grid gap-4 mt-5">' +
        '<div><label class="label" for="ns-name">Full name</label>' +
          '<input class="input" id="ns-name" autocomplete="off"></div>' +
        '<div><label class="label" for="ns-email">Email</label>' +
          '<input class="input" id="ns-email" type="email" autocomplete="off"></div>' +
        '<div><label class="label" for="ns-phone">Phone number</label>' +
          '<input class="input" id="ns-phone" type="tel" inputmode="tel" autocomplete="off" placeholder="0912 345 678"></div>' +
        '<div><label class="label" for="ns-pass">Password</label>' +
          '<input class="input" id="ns-pass" autocomplete="new-password" ' +
            'placeholder="Leave empty and one is generated for you"></div>' +
        '<div><label class="label" for="ns-plan">Term</label>' +
          '<select class="input" id="ns-plan">' +
            '<option value="">No term yet</option>' +
            plans.map(pl => '<option value="' + AD.esc(pl.id) + '">' + pl.months +
              ' months · ' + AD.esc(pl.name) + '</option>').join('') +
          '</select></div>' +
        '<div><label class="label" for="ns-note">Internal note</label>' +
          '<input class="input" id="ns-note" placeholder="Visible to administrators only"></div>' +
      '</div>' +
      '<div class="flex flex-wrap gap-2.5 justify-end mt-6">' +
        '<button type="button" class="btn btn-ghost btn-md" id="ns-cancel">Cancel</button>' +
        '<button type="button" class="btn btn-primary btn-md" id="ns-save">Create the account</button>' +
      '</div>');
    m.el.querySelector('#ns-cancel').addEventListener('click', () => m.close());
    m.el.querySelector('#ns-save').addEventListener('click', async () => {
      const btn = m.el.querySelector('#ns-save');
      btn.disabled = true;
      try {
        const r = await AD.post('/admin/users', {
          name: m.el.querySelector('#ns-name').value.trim(),
          email: m.el.querySelector('#ns-email').value.trim(),
          phone: m.el.querySelector('#ns-phone').value.trim(),
          password: m.el.querySelector('#ns-pass').value,
          planId: m.el.querySelector('#ns-plan').value,
          note: m.el.querySelector('#ns-note').value.trim()
        });
        m.close();
        AD.toast(r.grant
          ? 'Account created with ' + r.grant.months + ' months'
          : 'Account created');
        showOnce('Password for ' + r.user.name, r.password);
        load();
      } catch (e) {
        btn.disabled = false;
        AD.toast(e.message, 'error');
      }
    });
  });

  /* ----- Bulk create: a class or a company intake at once -----
     The browser splits the pasted text (or a CSV it reads itself) into rows and
     sends them as JSON — no file upload, no server-side CSV parser. */
  AD.qs('#bulk-students').addEventListener('click', () => {
    const m = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">Bulk create accounts</h3>' +
      '<p class="text-muted text-[14px] leading-relaxed mt-1.5">One student per line, as ' +
        '<b>email, name, phone</b>. Paste a list, or load a CSV with those three columns. ' +
        'Each account is created verified, with a password generated for it.</p>' +
      '<div class="grid gap-3.5 mt-4">' +
        '<label class="btn btn-ghost btn-sm w-fit cursor-pointer">Load a CSV file' +
          '<input type="file" id="bulk-file" accept=".csv,.txt" class="hidden"></label>' +
        '<textarea class="input font-mono text-[13px] leading-relaxed" id="bulk-text" rows="8" ' +
          'placeholder="an@truong.edu.vn, Nguyen Van A, 0912345678&#10;binh@truong.edu.vn, Tran Thi B, 0987654321"></textarea>' +
        '<div><label class="label" for="bulk-plan">Term for everyone (optional)</label>' +
          '<select class="input" id="bulk-plan"><option value="">No term yet</option>' +
            plans.map(pl => '<option value="' + AD.esc(pl.id) + '">' + pl.months + ' months · ' + AD.esc(pl.name) + '</option>').join('') +
          '</select></div>' +
      '</div>' +
      '<div id="bulk-result" class="mt-4"></div>' +
      '<div class="flex flex-wrap gap-2.5 justify-end mt-6">' +
        '<button type="button" class="btn btn-ghost btn-md" id="bulk-cancel">Close</button>' +
        '<button type="button" class="btn btn-primary btn-md" id="bulk-go">Create all</button>' +
      '</div>');

    m.el.querySelector('#bulk-cancel').addEventListener('click', () => m.close());
    m.el.querySelector('#bulk-file').addEventListener('change', ev => {
      const file = ev.target.files && ev.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { m.el.querySelector('#bulk-text').value = String(reader.result || ''); };
      reader.readAsText(file);
    });

    function parseRows(text) {
      const out = [];
      String(text || '').split(/\r?\n/).forEach((raw, i) => {
        const s = raw.trim();
        if (!s) return;
        const parts = s.split(/[,\t;]/).map(x => x.trim());
        if (i === 0 && /email/i.test(parts[0]) && parts.some(p => /name|phone/i.test(p))) return;  // a header row
        out.push({ line: i + 1, email: parts[0] || '', name: parts[1] || '', phone: parts[2] || '' });
      });
      return out;
    }

    m.el.querySelector('#bulk-go').addEventListener('click', async () => {
      const rows = parseRows(m.el.querySelector('#bulk-text').value);
      if (!rows.length) { AD.toast('Add at least one line', 'error'); return; }
      const go = m.el.querySelector('#bulk-go'); go.disabled = true;
      try {
        const r = await AD.post('/admin/users/bulk', { rows, planId: m.el.querySelector('#bulk-plan').value });
        const csv = 'email,name,phone,password\n' + r.created.map(c => {
          const row = rows.find(x => x.email.toLowerCase() === c.email) || {};
          return [c.email, c.name, row.phone || '', c.password].map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',');
        }).join('\n');
        const host = m.el.querySelector('#bulk-result');
        host.innerHTML =
          '<div class="card bg-brand-soft border-0 p-3.5 text-[14px] font-semibold flex items-center gap-3">' +
            '<span class="flex-1">Created ' + r.created.length + ' account(s)' + (r.errors.length ? ', ' + r.errors.length + ' skipped' : '') + '.</span>' +
            (r.created.length ? '<button type="button" class="btn btn-ghost btn-sm shrink-0" id="bulk-copy">Copy all (CSV)</button>' : '') +
          '</div>' +
          (r.errors.length ? '<div class="mt-3 text-[13px]"><span class="font-bold">Skipped:</span><ul class="mt-1.5 grid gap-1">' +
            r.errors.map(e => '<li class="text-muted">Line ' + e.line + ' · ' + AD.esc(e.email || '?') + ' — ' + AD.esc(e.error) + '</li>').join('') +
            '</ul></div>' : '');
        if (r.created.length) host.querySelector('#bulk-copy').addEventListener('click', () => {
          navigator.clipboard.writeText(csv).then(
            () => AD.toast('Copied — paste into a spreadsheet'), () => AD.toast('Could not copy', 'error'));
        });
        go.textContent = 'Create more'; go.disabled = false;
        m.el.querySelector('#bulk-text').value = '';
        load();
      } catch (e) { AD.toast(e.message, 'error'); go.disabled = false; }
    });
  });

  const state = { filter: '', q: '', offset: 0, limit: 25 };

  AD.qsa('[data-f]').forEach(b => b.addEventListener('click', () => {
    state.filter = b.getAttribute('data-f'); state.offset = 0;
    AD.qsa('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    load();
  }));
  let t = null;
  AD.qs('#q').addEventListener('input', e => {
    state.q = e.target.value.trim(); state.offset = 0;
    clearTimeout(t); t = setTimeout(load, 250);
  });

  async function load() {
    const p = new URLSearchParams({ limit: state.limit, offset: state.offset });
    if (state.q) p.set('q', state.q);
    if (state.filter === 'verified') p.set('verified', '1');
    if (state.filter === 'unverified') p.set('verified', '0');
    if (state.filter === 'locked') p.set('status', 'locked');
    try {
      const r = await AD.get('/admin/users?' + p);
      AD.qs('#count').textContent = r.total
        ? AD.num(r.total) + ' students · showing ' + (r.offset + 1) + '-' + Math.min(r.offset + r.limit, r.total)
        : 'No students match';
      if (!r.items.length) {
        AD.qs('#list').innerHTML = AD.emptyBox('users', 'No students match',
          'Try clearing the filter or changing the search.');
        AD.qs('#pager').innerHTML = '';
        return;
      }
      AD.qs('#list').innerHTML =
        '<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-[14px]">' +
        '<thead><tr class="text-[12px] uppercase tracking-wide text-muted border-b border-line bg-surface">' +
          '<th class="text-left font-bold px-5 py-3">Student</th>' +
          '<th class="text-left font-bold px-4 py-3 hidden md:table-cell">Following</th>' +
          '<th class="text-right font-bold px-4 py-3 hidden sm:table-cell">Code</th>' +
          '<th class="text-right font-bold px-4 py-3 hidden lg:table-cell">Spent</th>' +
          '<th class="text-left font-bold px-4 py-3">Status</th>' +
          '<th class="px-5 py-3"><span class="sr-only">Actions</span></th>' +
        '</tr></thead><tbody>' +
        r.items.map(u =>
          '<tr class="border-b border-line last:border-0">' +
            '<td class="px-5 py-3.5"><div class="flex items-center gap-3">' +
              '<span class="w-9 h-9 rounded-full bg-brand-soft text-brand-strong text-[12px] font-extrabold inline-flex items-center justify-center shrink-0">' +
                AD.esc(u.name.trim().split(/\s+/).map(w => w[0]).slice(-2).join('').toUpperCase()) + '</span>' +
              '<span class="min-w-0"><b class="block truncate">' + AD.esc(u.name) + '</b>' +
              '<span class="block text-[12.5px] text-muted truncate">' + AD.esc(u.email) + '</span></span>' +
            '</div></td>' +
            '<td class="px-4 py-3.5 hidden md:table-cell">' +
              (u.interests.length
                ? u.interests.map(i => '<span class="exam-chip me-1" data-family="' + i + '">' + AD.esc(famName(i)) + '</span>').join('')
                : '<span class="text-muted">—</span>') + '</td>' +
            '<td class="px-4 py-3.5 hidden sm:table-cell text-right font-bold">' + u.codes + '</td>' +
            '<td class="px-4 py-3.5 hidden lg:table-cell text-right font-bold whitespace-nowrap">' + AD.vnd(u.spent) + '</td>' +
            '<td class="px-4 py-3.5 whitespace-nowrap">' +
              (u.status === 'locked' ? '<span class="badge badge-hl">Locked</span>'
                : u.verified ? '<span class="badge badge-ok">Verified</span>'
                : '<span class="badge badge-muted">Not verified</span>') + '</td>' +
            '<td class="px-5 py-3.5 text-right">' +
              '<button type="button" class="btn btn-ghost btn-sm" data-open="' + u.id + '">Details</button></td>' +
          '</tr>').join('') +
        '</tbody></table></div></div>';

      AD.qsa('[data-open]').forEach(b => b.addEventListener('click', () => openUser(+b.getAttribute('data-open'))));

      const pages = Math.ceil(r.total / r.limit);
      const cur = Math.floor(r.offset / r.limit) + 1;
      AD.qs('#pager').innerHTML = pages > 1
        ? '<button type="button" class="btn btn-ghost btn-sm" data-page="prev" ' + (cur === 1 ? 'disabled' : '') + '>Previous</button>' +
          '<span class="text-[13.5px] font-bold text-muted self-center px-2">Trang ' + cur + '/' + pages + '</span>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-page="next" ' + (cur === pages ? 'disabled' : '') + '>Sau</button>'
        : '';
      AD.qsa('[data-page]').forEach(b => b.addEventListener('click', () => {
        state.offset = Math.max(0, state.offset + (b.getAttribute('data-page') === 'next' ? state.limit : -state.limit));
        load();
      }));
    } catch (e) {
      AD.qs('#list').innerHTML = AD.errorBox(e.message, 'retry');
      AD.qs('#retry').addEventListener('click', load);
    }
  }

  async function openUser(id) {
    let d;
    try { d = await AD.get('/admin/users/' + id); }
    catch (e) { AD.toast(e.message, 'error'); return; }
    const u = d.user;

    const codeRows = d.codes.length
      ? d.codes.map(c =>
          '<li class="flex items-center gap-3 py-2.5 border-b border-line last:border-0 text-[13.5px]">' +
            '<code class="font-bold tracking-wide shrink-0">' + AD.esc(c.code) + '</code>' +
            '<span class="min-w-0 flex-1 truncate text-muted">' + AD.esc(c.label) + '</span>' +
            '<span class="text-muted shrink-0">' + AD.date(c.redeemedAt) + '</span>' +
          '</li>').join('')
      : '<li class="py-4 text-[14px] text-muted">No codes activated.</li>';

    /* An order used to be a record of something that had already happened, so
       its status never needed showing. With a gateway in front of it an order
       exists before the money moves, and "paid" now has to be told apart from
       "waiting" and "did not go through" — otherwise a pending row reads as a
       sale and the revenue tile is the only place the difference shows up. */
    const ORDER_STATE = {
      paid: ['badge-ok', 'Paid'],
      pending: ['badge-hl', 'Awaiting payment'],
      failed: ['badge-danger', 'Failed'],
      refunded: ['badge-muted', 'Refunded']
    };
    const orderRows = d.orders.length
      ? d.orders.map(o => {
          const st = ORDER_STATE[o.status] || ['badge-muted', o.status || 'unknown'];
          return '<li class="flex items-center gap-3 py-2.5 border-b border-line last:border-0 text-[13.5px]">' +
            '<span class="min-w-0 flex-1 truncate"><b>' + AD.esc(o.name) + '</b></span>' +
            '<span class="badge ' + st[0] + ' shrink-0">' + st[1] + '</span>' +
            '<span class="font-bold shrink-0">' + AD.vnd(o.amount) + '</span>' +
            '<span class="text-muted shrink-0 w-24 text-right">' + AD.date(o.createdAt) + '</span>' +
          '</li>';
        }).join('')
      : '<li class="py-4 text-[14px] text-muted">No orders.</li>';

    const mm = AD.modal(
      '<div class="flex items-start gap-3.5">' +
        '<span class="w-12 h-12 rounded-full bg-brand-soft text-brand-strong font-extrabold inline-flex items-center justify-center shrink-0">' +
          AD.esc(u.name.trim().split(/\s+/).map(w => w[0]).slice(-2).join('').toUpperCase()) + '</span>' +
        '<div class="min-w-0">' +
          '<h3 class="text-lg font-extrabold tracking-tight truncate">' + AD.esc(u.name) + '</h3>' +
          '<p class="text-[13.5px] text-muted truncate">' + AD.esc(u.email) +
            (u.phone ? ' · ' + AD.esc(u.phone) : '') + ' · @' + AD.esc(u.username) + '</p>' +
          '<p class="flex flex-wrap gap-1.5 mt-2">' +
            (u.status === 'locked' ? '<span class="badge badge-hl">Locked</span>' : '<span class="badge badge-ok">Active</span>') +
            (u.verified ? '<span class="badge badge-ok">Verified</span>' : '<span class="badge badge-muted">Not verified</span>') +
            '<span class="badge badge-muted">Tham gia ' + AD.date(u.createdAt) + '</span>' +
          '</p>' +
        '</div>' +
      '</div>' +

      '<div class="grid sm:grid-cols-2 gap-5 mt-6">' +
        '<section><h4 class="text-[13px] font-bold uppercase tracking-wide text-muted mb-1">Activated codes</h4>' +
          '<ul class="max-h-40 overflow-y-auto">' + codeRows + '</ul></section>' +
        '<section><h4 class="text-[13px] font-bold uppercase tracking-wide text-muted mb-1">Orders</h4>' +
          '<ul class="max-h-40 overflow-y-auto">' + orderRows + '</ul></section>' +
      '</div>' +

      '<div class="border-t border-line mt-6 pt-5 grid gap-4">' +
        '<div class="grid sm:grid-cols-2 gap-4">' +
          '<div><label class="label" for="u-phone">Phone number</label>' +
            '<input class="input" id="u-phone" type="tel" inputmode="tel" autocomplete="off" value="' + AD.esc(u.phone || '') + '" placeholder="0912 345 678">' +
            '<p class="help mt-1.5">Needed before a code can be bound to this account.</p></div>' +
          '<div><label class="label" for="u-note">Internal note</label>' +
            '<input class="input" id="u-note" value="' + AD.esc(u.note || '') + '" placeholder="Visible to administrators only"></div>' +
        '</div>' +
        '<div class="flex flex-wrap gap-2.5">' +
          '<button type="button" id="u-save" class="btn btn-primary btn-md">Save changes</button>' +
          (u.verified ? '' : '<button type="button" id="u-verify" class="btn btn-ghost btn-md">Mark as verified</button>') +
          '<button type="button" id="u-lock" class="btn btn-ghost btn-md ' + (u.status === 'locked' ? '' : 'text-danger') + '">' +
            (u.status === 'locked' ? 'Unlock the account' : 'Lock the account') + '</button>' +
          '<button type="button" id="u-pass" class="btn btn-ghost btn-md">Reset the password</button>' +
          '<button type="button" id="u-code" class="btn btn-soft btn-md ms-auto">' + AD.icon('ticket', 'w-4 h-4') + 'Issue a code</button>' +
        '</div>' +
        /* A term, straight from the account rather than by way of the code
           screen. The three plans ARE the three terms — 3, 6 and 12 months —
           so the buttons are built from the price list rather than hard-coded,
           and a fourth plan appears here by itself. */
        '<div><p class="label mb-2">Give this account a term</p>' +
          '<div class="flex flex-wrap gap-2.5" id="u-grants">' +
            plans.map(pl => '<button type="button" class="btn btn-soft btn-md" data-grant="' +
              AD.esc(pl.id) + '">' + pl.months + ' months · ' + AD.esc(pl.name) + '</button>').join('') +
          '</div></div>' +
      '</div>', { wide: true });

    mm.el.querySelector('#u-save').addEventListener('click', async () => {
      try {
        await AD.put('/admin/users/' + id, {
          name: u.name, note: mm.el.querySelector('#u-note').value,
          phone: mm.el.querySelector('#u-phone').value.trim(), interests: u.interests
        });
        mm.close(); AD.toast('Saved'); load();
      } catch (e) { AD.toast(e.message, 'error'); }
    });
    const vb = mm.el.querySelector('#u-verify');
    if (vb) vb.addEventListener('click', async () => {
      try { await AD.post('/admin/users/' + id + '/verify'); mm.close(); AD.toast('Marked as verified'); load(); }
      catch (e) { AD.toast(e.message, 'error'); }
    });
    mm.el.querySelector('#u-lock').addEventListener('click', async () => {
      const to = u.status === 'locked' ? 'active' : 'locked';
      if (to === 'locked' && !await AD.confirm('Lock this account?',
        u.name + ' will not be able to sign in until you unlock it.', 'Lock the account')) return;
      try { await AD.post('/admin/users/' + id + '/status', { status: to }); mm.close(); AD.toast(to === 'locked' ? 'Account locked' : 'Account unlocked'); load(); }
      catch (e) { AD.toast(e.message, 'error'); }
    });
    mm.el.querySelector('#u-code').addEventListener('click', () => {
      mm.close();
      location.href = '/admin/code/?user=' + id;
    });

    mm.el.querySelector('#u-pass').addEventListener('click', async () => {
      if (!await AD.confirm('Reset this password?',
        'A new password is generated and shown to you once. ' + u.name +
        ' is signed out everywhere immediately.', 'Reset the password')) return;
      try {
        const r = await AD.post('/admin/users/' + id + '/password');
        mm.close();
        showOnce('New password for ' + u.name, r.password);
        load();
      } catch (e) { AD.toast(e.message, 'error'); }
    });

    mm.el.querySelector('#u-grants').addEventListener('click', async e => {
      const b = e.target.closest('[data-grant]');
      if (!b) return;
      const pl = plans.find(x => x.id === b.getAttribute('data-grant'));
      if (!await AD.confirm('Give ' + pl.months + ' months?',
        u.name + ' gets the ' + pl.name + ' plan, starting today. A code is issued and '
        + 'activated on the account in one step — nothing to send them.', 'Give the term')) return;
      try {
        const r = await AD.post('/admin/users/' + id + '/grant', { planId: pl.id });
        mm.close();
        AD.toast(pl.months + ' months added, to ' + AD.date(r.accessUntil));
        load();
      } catch (e2) { AD.toast(e2.message, 'error'); }
    });
  }

  load();
})();
</script>
</body>
</html>
