<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Question bank · VPET Prep admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
  <!-- Song ngữ: đặt ngôn ngữ (mặc định tiếng Việt) trước khi vẽ trang -->
  <script src="/i18n.js"></script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="bank" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-10">

      <div class="card p-4 mb-6 grid gap-3">
        <div class="flex flex-wrap gap-2.5">
          <label class="relative flex-1 min-w-[200px]">
            <span class="sr-only">Search questions</span>
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none" id="search-icon"></span>
            <input id="q" type="search" class="input ps-10 py-2.5" placeholder="Search the question text…">
          </label>
          <label class="sr-only" for="f-skill">Filter by skill</label>
          <select id="f-skill" class="input w-auto py-2.5">
            <option value="">Any skill</option>
            <option value="listening">Listening</option><option value="reading">Reading</option>
            <option value="writing">Writing</option><option value="speaking">Speaking</option>
          </select>
          <label class="sr-only" for="f-level">Filter by level</label>
          <select id="f-level" class="input w-auto py-2.5">
            <option value="">Any level</option>
            <option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option>
          </select>
          <label class="sr-only" for="f-type">Filter by item type</label>
          <select id="f-type" class="input w-auto py-2.5">
            <option value="">Any type</option>
            <option value="mcq">Multiple choice</option><option value="gap">Gap fill</option>
            <option value="essay">Essay</option><option value="speaking">Recorded</option>
          </select>
          <label class="sr-only" for="f-part">Filter by part</label>
          <select id="f-part" class="input w-auto py-2.5" hidden>
            <option value="">Any part</option>
          </select>
          <label class="sr-only" for="f-status">Filter by status</label>
          <select id="f-status" class="input w-auto py-2.5">
            <option value="active">In use</option>
            <option value="retired">Withdrawn</option>
            <option value="">All</option>
          </select>
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar" id="fam-chips"></div>
      </div>

      <p class="text-[13px] font-semibold text-muted mb-3" id="count">Loading…</p>
      <div id="list"><div class="card p-5 grid gap-3.5">
        <div class="skeleton h-6 w-11/12"></div><div class="skeleton h-6 w-full"></div><div class="skeleton h-6 w-4/5"></div>
      </div></div>
      <div class="flex justify-center gap-2.5 mt-6" id="pager"></div>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
(async () => {
  await AD.mount({ title: 'Question bank', subtitle: 'The shared pool every test of an exam draws from' });
  AD.qs('#search-icon').innerHTML = AD.icon('search', 'w-[18px] h-[18px]');
  AD.qs('#page-actions').innerHTML =
    '<button type="button" id="btn-bulk" class="btn btn-soft btn-sm">' + AD.icon('upload', 'w-4 h-4') + '<span class="hidden sm:inline">Bulk import</span></button>' +
    '<button type="button" id="btn-new" class="btn btn-primary btn-sm">' + AD.icon('plus', 'w-4 h-4') + 'Add a question</button>';

  let families = [];
  try { families = (await AD.get('/catalog')).families; } catch (e) {}

  const state = { family: '', skill: '', level: '', type: '', part: '', status: 'active', q: '', offset: 0, limit: 25 };

  AD.qs('#fam-chips').innerHTML =
    '<button type="button" class="chip shrink-0" data-f="" aria-pressed="true">Any exam</button>' +
    families.map(f => '<button type="button" class="chip shrink-0" data-family="' + f.id + '" data-f="' + f.id + '" aria-pressed="false">' + AD.esc(f.name) + '</button>').join('');
  /* The part filter only means anything while one exam is selected: across "any
     exam", VPET's letter A and another family's letter A are not the same thing. */
  function renderPartFilter() {
    const sel = AD.qs('#f-part');
    const fam = families.find(f => f.id === state.family);
    const list = (fam && fam.parts) || [];
    if (!list.length) {
      sel.hidden = true;
      if (state.part) { state.part = ''; }
      return;
    }
    sel.hidden = false;
    sel.innerHTML = '<option value="">Any part</option>' +
      '<option value="none">No part yet</option>' +
      list.map(p2 => '<option value="' + AD.esc(p2.part) + '"' +
        (p2.part === state.part ? ' selected' : '') + '>' + AD.esc(p2.name) + '</option>').join('');
  }

  AD.qs('#fam-chips').addEventListener('click', e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    state.family = b.getAttribute('data-f'); state.part = ''; state.offset = 0;
    AD.qsa('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    renderPartFilter();
    load();
  });
  ['skill', 'level', 'type', 'part', 'status'].forEach(k => AD.qs('#f-' + k).addEventListener('change', e => {
    state[k] = e.target.value; state.offset = 0; load();
  }));
  renderPartFilter();
  let t = null;
  AD.qs('#q').addEventListener('input', e => {
    state.q = e.target.value.trim(); state.offset = 0;
    clearTimeout(t); t = setTimeout(load, 250);
  });

  async function load() {
    const p = new URLSearchParams({ limit: state.limit, offset: state.offset });
    ['family', 'skill', 'level', 'type', 'part', 'status', 'q'].forEach(k => { if (state[k]) p.set(k, state[k]); });
    try {
      const r = await AD.get('/admin/questions?' + p);
      AD.qs('#count').textContent = r.total
        ? AD.num(r.total) + ' items match · showing ' + (r.offset + 1) + '-' + Math.min(r.offset + r.limit, r.total)
        : 'No items match';
      if (!r.items.length) {
        AD.qs('#list').innerHTML = AD.emptyBox('database', 'No items in the bank match',
          'Add one by hand, or bulk-import to build the pool quickly.',
          '<button type="button" class="btn btn-primary btn-md" data-empty-new>Add a question</button>');
        const b = AD.qs('[data-empty-new]');
        if (b) b.addEventListener('click', () => openEditor(null));
        AD.qs('#pager').innerHTML = '';
        return;
      }
      AD.qs('#list').innerHTML = '<div class="grid gap-2.5">' + r.items.map(card).join('') + '</div>';
      AD.qsa('[data-edit]').forEach(b => b.addEventListener('click', () => {
        openEditor(r.items.find(x => x.id === +b.getAttribute('data-edit')));
      }));
      bindAudio();
      AD.qsa('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
        const id = +b.getAttribute('data-toggle');
        const to = b.getAttribute('data-to');
        try { await AD.post('/admin/questions/' + id + '/status', { status: to }); AD.toast(to === 'retired' ? 'Question withdrawn' : 'Question back in use'); load(); }
        catch (e) { AD.toast(e.message, 'error'); }
      }));

      const pages = Math.ceil(r.total / r.limit);
      const cur = Math.floor(r.offset / r.limit) + 1;
      AD.qs('#pager').innerHTML = pages > 1
        ? '<button type="button" class="btn btn-ghost btn-sm" data-page="prev" ' + (cur === 1 ? 'disabled' : '') + '>Previous</button>' +
          '<span class="text-[13px] font-bold text-muted self-center px-2">Trang ' + cur + '/' + pages + '</span>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-page="next" ' + (cur === pages ? 'disabled' : '') + '>Sau</button>'
        : '';
      AD.qsa('[data-page]').forEach(b => b.addEventListener('click', () => {
        state.offset += b.getAttribute('data-page') === 'next' ? state.limit : -state.limit;
        state.offset = Math.max(0, state.offset);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        load();
      }));
    } catch (e) {
      AD.qs('#list').innerHTML = AD.errorBox(e.message, 'retry');
      AD.qs('#retry').addEventListener('click', load);
    }
  }

  /* VPET plays audio in parts E, F, G, H and J, so listening and speaking
     items can carry one MP3 each. Other skills never need sound, so the
     control only appears where it makes sense. */
  const NEEDS_AUDIO = ['listening', 'speaking'];

  function audioBlock(i) {
    if (!NEEDS_AUDIO.includes(i.skill)) return '';
    const kb = i.audioBytes ? Math.max(1, Math.round(i.audioBytes / 1024)) : 0;
    /* Cache-bust on the upload timestamp: replacing a file must not leave the
       browser playing the old one. */
    const src = '/api/admin/questions/' + i.id + '/audio?v=' + encodeURIComponent(i.audioAt || '');
    return '<span class="block mt-2.5 pt-2.5 border-t border-line">' +
      (i.hasAudio
        ? '<span class="flex flex-wrap items-center gap-2">' +
            '<audio controls preload="none" class="h-9 max-w-full" src="' + src + '"></audio>' +
            '<span class="badge badge-muted">MP3 · ' + kb + ' KB</span>' +
            '<label class="btn btn-ghost btn-sm cursor-pointer">Replace' +
              '<input type="file" accept="audio/mpeg" class="sr-only" data-audio-file="' + i.id + '">' +
            '</label>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-audio-del="' + i.id + '">Remove</button>' +
          '</span>'
        : '<span class="flex flex-wrap items-center gap-2">' +
            '<span class="badge badge-hl">No audio</span>' +
            '<label class="btn btn-ghost btn-sm cursor-pointer">Attach MP3' +
              '<input type="file" accept="audio/mpeg" class="sr-only" data-audio-file="' + i.id + '">' +
            '</label>' +
          '</span>') +
    '</span>';
  }

  /* Wired once per render, same as the edit and retire buttons. */
  function bindAudio() {
    AD.qsa('[data-audio-file]').forEach(inp => inp.addEventListener('change', async () => {
      const file = inp.files && inp.files[0];
      if (!file) return;
      const id = inp.getAttribute('data-audio-file');
      try {
        await AD.upload('/admin/questions/' + id + '/audio', file);
        AD.toast('Audio attached');
        load();
      } catch (e) {
        AD.toast(e.message, 'error');
        inp.value = '';
      }
    }));
    AD.qsa('[data-audio-del]').forEach(b => b.addEventListener('click', async () => {
      const id = b.getAttribute('data-audio-del');
      try { await AD.del('/admin/questions/' + id + '/audio'); AD.toast('Audio removed'); load(); }
      catch (e) { AD.toast(e.message, 'error'); }
    }));
  }

  function card(i) {
    const fam = families.find(f => f.id === i.familyId);
    return '<article class="card p-4 flex items-start gap-3.5' + (i.status === 'retired' ? ' opacity-60' : '') + '">' +
      '<span class="min-w-0 flex-1">' +
        '<span class="flex flex-wrap items-center gap-1.5 mb-2">' +
          '<span class="exam-chip" data-family="' + i.familyId + '">' + AD.esc(fam ? fam.name : i.familyId) + '</span>' +
          '<span class="badge badge-muted">' + AD.esc(AD.SKILL_LABEL[i.skill] || i.skill) + '</span>' +
          '<span class="badge badge-muted">' + AD.esc(i.level) + '</span>' +
          '<span class="badge badge-muted">' + AD.esc(AD.TYPE_LABEL[i.type] || i.type) + '</span>' +
          /* If the exam has a part table and the item has no letter, say so plainly:
             it belongs to no pool, so generation will never draw it. */
          (((fam && fam.parts && fam.parts.length) || i.part)
            ? (i.part
                ? '<span class="badge badge-ok">Part ' + AD.esc(i.part) + '</span>'
                : '<span class="badge badge-hl">No part</span>')
            : '') +
          (i.status === 'retired' ? '<span class="badge badge-hl">Withdrawn</span>' : '') +
        '</span>' +
        '<span class="block text-[14px] leading-snug">' + AD.esc(i.prompt) + '</span>' +
        (i.options && i.options.length
          ? '<span class="block text-[13px] text-muted mt-1.5">' +
              i.options.map(o => (o === i.answer ? '<b class="text-accent-strong">' + AD.esc(o) + '</b>' : AD.esc(o))).join(' · ') + '</span>'
          : '') +
        audioBlock(i) +
      '</span>' +
      '<span class="flex flex-col gap-1.5 shrink-0">' +
        '<button type="button" class="p-2 rounded-full text-muted hover:text-ink transition" data-edit="' + i.id + '" aria-label="Edit the question">' + AD.icon('edit', 'w-4 h-4') + '</button>' +
        '<button type="button" class="p-2 rounded-full text-muted hover:text-danger transition" data-toggle="' + i.id + '" data-to="' +
          (i.status === 'active' ? 'retired' : 'active') + '" aria-label="' + (i.status === 'active' ? 'Withdraw' : 'Put back in use') + '">' +
          AD.icon(i.status === 'active' ? 'x' : 'check', 'w-4 h-4') + '</button>' +
      '</span>' +
    '</article>';
  }

  /* ---------- Add and edit an item ---------- */
  function openEditor(item) {
    const isNew = !item;
    const d = item || { familyId: families[0] && families[0].id, skill: 'listening', level: 'B1', type: 'mcq', part: '', prompt: '', options: ['', '', '', ''], answer: '', explanation: '', tags: [] };
    const mm = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">' + (isNew ? 'Add a question' : 'Edit the question') + '</h3>' +
      '<div class="grid gap-4 mt-5">' +
        '<div class="grid grid-cols-2 gap-3">' +
          '<div><label class="label" for="q-family">Exam</label><select class="input" id="q-family">' +
            families.map(f => '<option value="' + f.id + '"' + (f.id === d.familyId ? ' selected' : '') + '>' + AD.esc(f.name) + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="q-skill">Skill</label><select class="input" id="q-skill">' +
            ['listening','reading','writing','speaking'].map(s => '<option value="' + s + '"' + (s === d.skill ? ' selected' : '') + '>' + AD.SKILL_LABEL[s] + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="q-level">Level</label><select class="input" id="q-level">' +
            ['A1','A2','B1','B2','C1','C2'].map(l => '<option' + (l === d.level ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="q-type">Item type</label><select class="input" id="q-type">' +
            ['mcq','gap','essay','speaking'].map(t2 => '<option value="' + t2 + '"' + (t2 === d.type ? ' selected' : '') + '>' + AD.TYPE_LABEL[t2] + '</option>').join('') + '</select></div>' +
        '</div>' +
        /* The part picker only appears for exams with a part table. Choosing a part
           fixes the skill and item type - the server refuses a mismatch, so they are
           set here to match rather than left for the operator to guess. */
        '<div id="q-part-box" hidden><label class="label" for="q-part">Part</label>' +
          '<select class="input" id="q-part"></select>' +
          '<p class="help mt-1.5">An item with no part belongs to no pool, so generation can never draw it.</p></div>' +
        '<div><label class="label" for="q-prompt">Question text</label>' +
          '<textarea class="input" id="q-prompt" rows="3">' + AD.esc(d.prompt) + '</textarea></div>' +
        '<div id="q-mcq">' +
          '<p class="label">Options (mark the correct one)</p>' +
          '<div class="grid gap-2" id="q-options"></div>' +
          '<p class="help mt-1.5" id="q-opt-help"></p>' +
        '</div>' +
        /* The answer key for a typed item — Part A's missing word, Part E's
           dictated sentence. There was NO field for it: the save handler sent
           `answer: ''` for anything that was not multiple choice, so a Part E
           item could be written, given a recording, and saved with no key at
           all. Every candidate who typed the sentence perfectly was then marked
           wrong, and the operator had nowhere to put the answer they had
           already worked out. */
        '<div id="q-key-box"><label class="label" for="q-key">Answer key</label>' +
          '<input class="input" id="q-key" value="' + AD.esc(d.answer || '') + '" ' +
            'placeholder="the word or sentence that counts as correct">' +
          '<p class="help mt-1.5">Case, outer punctuation and extra spaces are ignored when marking. ' +
          'Separate equally correct spellings with <b>|</b> — <code>color | colour</code> accepts either.</p></div>' +
        '<div><label class="label" for="q-exp">Explanation <span class="font-medium text-muted">(optional)</span></label>' +
          '<textarea class="input" id="q-exp" rows="2">' + AD.esc(d.explanation) + '</textarea></div>' +
        '<div class="banner banner-error" id="q-err"><span id="q-err-text"></span></div>' +
        '<div class="flex gap-2.5"><button type="button" id="q-save" class="btn btn-primary btn-md flex-1">' +
          (isNew ? 'Add to the bank' : 'Save changes') + '</button>' +
          '<button type="button" data-close class="btn btn-ghost btn-md">Cancel</button></div>' +
      '</div>', { wide: true });

    const typeEl = mm.el.querySelector('#q-type');
    const optWrap = mm.el.querySelector('#q-options');
    const mcqBox = mm.el.querySelector('#q-mcq');
    const famEl = mm.el.querySelector('#q-family');
    const skillEl = mm.el.querySelector('#q-skill');
    const partEl = mm.el.querySelector('#q-part');
    const partBox = mm.el.querySelector('#q-part-box');

    /** The parts of the selected exam, taken from the blueprint via /catalog */
    const partsOf = famId => ((families.find(f => f.id === famId) || {}).parts) || [];

    function renderParts() {
      const list = partsOf(famEl.value);
      partBox.hidden = !list.length;
      if (!list.length) { partEl.innerHTML = ''; return; }
      partEl.innerHTML = '<option value="">- no part -</option>' +
        list.map(p2 => '<option value="' + AD.esc(p2.part) + '"' +
          (p2.part === d.part ? ' selected' : '') + '>' + AD.esc(p2.name) + '</option>').join('');
    }
    /* Choosing a part pulls the skill and item type with it - part A is writing and
       gap fill, and picking anything else is refused by the server anyway. */
    function syncFromPart() {
      const p2 = partsOf(famEl.value).find(x => x.part === partEl.value);
      if (!p2) return;
      if (p2.skill) skillEl.value = p2.skill;
      if (p2.types && p2.types.length && !p2.types.includes(typeEl.value)) typeEl.value = p2.types[0];
      syncType();
    }

    /** How many options this part publishes, or 4 when the part sets none. */
    function choiceCount() {
      const p2 = partsOf(famEl.value).find(x => x.part === partEl.value);
      return (p2 && p2.choices) || 4;
    }

    function renderOptions() {
      /* The count comes from the blueprint, not from a constant here. Part F
         publishes THREE — "You will see three possible answers" — and this used
         to render four for every part, so a Part F item was authored with a
         fourth option the exam would never display. */
      const want = choiceCount();
      const opts = (d.options && d.options.length ? d.options : []).slice(0, Math.max(want, 6));
      while (opts.length < want) opts.push('');
      const help = mm.el.querySelector('#q-opt-help');
      const p2 = partsOf(famEl.value).find(x => x.part === partEl.value);
      if (help) {
        help.textContent = p2 && p2.choices
          ? 'Part ' + p2.part + ' shows ' + p2.choices + ' options. Fill all of them.'
          : '';
      }
      optWrap.innerHTML = opts.map((o, i) =>
        '<label class="flex items-center gap-2.5">' +
          '<input type="radio" name="ans" class="w-4 h-4 accent-[color:var(--color-accent)] shrink-0" ' +
            (o && o === d.answer ? 'checked' : '') + ' data-ans="' + i + '" aria-label="Correct answer is option ' + (i + 1) + '">' +
          '<input class="input py-2" data-opt="' + i + '" value="' + AD.esc(o) + '" placeholder="Option ' + (i + 1) + '" aria-label="Option ' + (i + 1) + '">' +
        '</label>').join('');
    }
    function syncType() {
      mcqBox.hidden = typeEl.value !== 'mcq';
      /* Only a typed item has a key to enter. An essay or a spoken answer is
         marked against the rubric, and offering a box for an answer nothing
         will ever compare against is worse than offering none. */
      mm.el.querySelector('#q-key-box').hidden = typeEl.value !== 'gap';
    }
    renderParts(); renderOptions(); syncType();
    typeEl.addEventListener('change', syncType);
    famEl.addEventListener('change', () => { renderParts(); renderOptions(); });
    partEl.addEventListener('change', () => { syncFromPart(); renderOptions(); });

    mm.el.querySelector('#q-save').addEventListener('click', async () => {
      const err = mm.el.querySelector('#q-err');
      err.classList.remove('show');
      const options = AD.qsa('[data-opt]', mm.el).map(i => i.value.trim()).filter(Boolean);
      const ansIdx = AD.qsa('[data-ans]', mm.el).findIndex(r => r.checked);
      const allOpts = AD.qsa('[data-opt]', mm.el).map(i => i.value.trim());
      const body = {
        familyId: mm.el.querySelector('#q-family').value,
        skill: mm.el.querySelector('#q-skill').value,
        level: mm.el.querySelector('#q-level').value,
        type: typeEl.value,
        part: partBox.hidden ? '' : partEl.value,
        prompt: mm.el.querySelector('#q-prompt').value,
        explanation: mm.el.querySelector('#q-exp').value,
        options: typeEl.value === 'mcq' ? options : [],
        /* A typed item's key comes from its own field. Essays and spoken answers
           genuinely have none — they go to the rubric — so those still send an
           empty string rather than whatever was last in the box. */
        answer: typeEl.value === 'mcq'
          ? (ansIdx >= 0 ? allOpts[ansIdx] : '')
          : (typeEl.value === 'gap' ? mm.el.querySelector('#q-key').value.trim() : ''),
        tags: d.tags || []
      };
      try {
        if (isNew) await AD.post('/admin/questions', body);
        else await AD.put('/admin/questions/' + item.id, body);
        mm.close();
        AD.toast(isNew ? 'Question added' : 'Question saved');
        load();
      } catch (e) {
        mm.el.querySelector('#q-err-text').textContent = e.message;
        err.classList.add('show');
      }
    });
  }
  AD.qs('#btn-new').addEventListener('click', () => openEditor(null));

  /* ============================================================
     Bulk import: CSV (the default) or JSON
     The CSV is parsed in the browser, previewed, and only then sent.
     ============================================================ */

  /** Split CSV, handling quotes, commas inside a cell, and CRLF or LF line endings */
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');              // strip the BOM if there is one
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], next = text[i + 1];
      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') inQuotes = false;
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* skipped; handled at \n */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  const CSV_COLS = ['ky_thi','ky_nang','do_kho','dang_cau','phan_thi','noi_dung',
                    'phuong_an_1','phuong_an_2','phuong_an_3','phuong_an_4','dap_an','giai_thich'];
  const SKILL_ALIAS = { nghe:'listening', doc:'reading', viet:'writing', noi:'speaking',
                        listening:'listening', reading:'reading', writing:'writing', speaking:'speaking' };
  const TYPE_ALIAS = { 'trac nghiem':'mcq', 'dien tu':'gap', 'tu luan':'essay', 'ghi am':'speaking',
                       mcq:'mcq', gap:'gap', essay:'essay', speaking:'speaking' };
  const norm = s => String(s || '').trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');

  /** One CSV row → a question object, or the reason it was rejected */
  function rowToItem(cells, header) {
    const get = name => {
      const i = header.indexOf(name);
      return i >= 0 ? String(cells[i] || '').trim() : '';
    };
    const familyId = norm(get('ky_thi'));
    const skill = SKILL_ALIAS[norm(get('ky_nang'))];
    const level = get('do_kho').toUpperCase();
    const type = TYPE_ALIAS[norm(get('dang_cau'))];
    /* The part letter: left blank for exams with no part table. The server is what
       checks the letter exists and matches the skill - all that happens here is
       upper-casing, so "a" and "A" land in the same place. */
    const part = get('phan_thi').trim().toUpperCase();
    const prompt = get('noi_dung');
    const options = ['phuong_an_1','phuong_an_2','phuong_an_3','phuong_an_4'].map(get).filter(Boolean);
    const answer = get('dap_an');

    if (!families.some(f => f.id === familyId)) return { error: 'Exam "' + get('ky_thi') + '" is not in the system.' };
    if (!skill) return { error: 'Skill "' + get('ky_nang') + '" is not valid (nghe/đọc/viết/nói, or the English names).' };
    if (!['A1','A2','B1','B2','C1','C2'].includes(level)) return { error: 'Level "' + get('do_kho') + '" is not valid.' };
    if (!type) return { error: 'Item type "' + get('dang_cau') + '" is not valid.' };
    if (prompt.length < 5) return { error: 'The question text is too short.' };
    if (type === 'mcq') {
      if (options.length < 2) return { error: 'A multiple-choice item needs at least two options.' };
      if (!options.includes(answer)) return { error: 'The answer must match one of the options.' };
    }
    return {
      item: { familyId, skill, level, type, part, prompt,
              options: type === 'mcq' ? options : [],
              answer: type === 'mcq' ? answer : '',
              explanation: get('giai_thich'), tags: ['csv import'] }
    };
  }

  AD.qs('#btn-bulk').addEventListener('click', () => {
    const sampleJson = JSON.stringify([{
      familyId: families[0] ? families[0].id : 'ielts', skill: 'reading', level: 'B1', type: 'mcq',
      prompt: 'The question text…', options: ['A', 'B', 'C', 'D'], answer: 'A', explanation: ''
    }], null, 2);

    const mm = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">Bulk import questions</h3>' +
      '<p class="text-muted text-[14px] mt-1.5 leading-relaxed">Up to 500 items at a time. Rejected rows are listed separately, and the valid ones still import.</p>' +

      '<div role="tablist" aria-label="Import method" class="flex gap-2 border-b border-line mt-5">' +
        '<button role="tab" id="tb-csv" aria-controls="pn-csv" aria-selected="true" class="tabbtn">From CSV</button>' +
        '<button role="tab" id="tb-json" aria-controls="pn-json" aria-selected="false" class="tabbtn">From JSON</button>' +
      '</div>' +

      /* ----- Tab CSV ----- */
      '<div role="tabpanel" id="pn-csv" aria-labelledby="tb-csv" class="grid gap-4 mt-5">' +
        '<div class="card bg-brand-soft border-0 p-4">' +
          '<p class="text-[13px] leading-relaxed">Columns, in order: <b>ky_thi, ky_nang, do_kho, dang_cau, phan_thi, noi_dung, phuong_an_1..4, dap_an, giai_thich</b>. ' +
          'The <b>phan_thi</b> column is the part letter (VPET: A–J); leave it blank for an exam with no part table. ' +
            'The skill column accepts Vietnamese (nghe, đọc, viết, nói) as well as English.</p>' +
          '<a href="/api/admin/questions/template.csv" class="btn btn-soft btn-sm mt-3">' +
            AD.icon('download', 'w-4 h-4') + 'Download a sample CSV</a>' +
        '</div>' +
        '<div><label class="label" for="c-file">Choose a CSV file</label>' +
          '<input class="input py-2" id="c-file" type="file" accept=".csv,text/csv"></div>' +
        '<div><label class="label" for="c-text">Or paste the CSV directly</label>' +
          '<textarea class="input font-mono text-[13px]" id="c-text" rows="6" spellcheck="false" ' +
            'placeholder="ky_thi,ky_nang,do_kho,dang_cau,phan_thi,noi_dung,..."></textarea></div>' +
        '<button type="button" id="c-preview" class="btn btn-ghost btn-md">Preview</button>' +
        '<div id="c-result"></div>' +
      '</div>' +

      /* ----- Tab JSON ----- */
      '<div role="tabpanel" id="pn-json" aria-labelledby="tb-json" hidden class="grid gap-4 mt-5">' +
        '<div><label class="label" for="b-json">A JSON array</label>' +
          '<textarea class="input font-mono text-[13px]" id="b-json" rows="10" spellcheck="false">' + AD.esc(sampleJson) + '</textarea></div>' +
        '<button type="button" id="b-go" class="btn btn-primary btn-md">Import into the bank</button>' +
      '</div>' +

      '<div class="banner banner-error mt-4" id="b-err"><span id="b-err-text"></span></div>' +
      '<div class="banner banner-success mt-4" id="b-ok"><span id="b-ok-text"></span></div>' +
      '<div class="flex justify-end mt-5"><button type="button" data-close class="btn btn-ghost btn-md">Close</button></div>',
      { wide: true });

    const err = mm.el.querySelector('#b-err'), ok = mm.el.querySelector('#b-ok');
    const showErr = html => { mm.el.querySelector('#b-err-text').innerHTML = html; err.classList.add('show'); };
    const clearMsg = () => { err.classList.remove('show'); ok.classList.remove('show'); };

    /* Switching tabs */
    [['tb-csv','pn-csv'],['tb-json','pn-json']].forEach(([t2, p2], _, all) => {
      mm.el.querySelector('#' + t2).addEventListener('click', () => {
        all.forEach(([t3, p3]) => {
          const on = t3 === t2;
          mm.el.querySelector('#' + t3).setAttribute('aria-selected', String(on));
          mm.el.querySelector('#' + p3).toggleAttribute('hidden', !on);
        });
        clearMsg();
      });
    });

    /* Read the file into the textarea */
    mm.el.querySelector('#c-file').addEventListener('change', ev => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => { mm.el.querySelector('#c-text').value = String(reader.result || ''); preview(); };
      reader.onerror = () => showErr('The file could not be read.');
      reader.readAsText(f, 'utf-8');
    });

    let pending = [];
    function preview() {
      clearMsg();
      pending = [];
      const raw = mm.el.querySelector('#c-text').value.trim();
      const box = mm.el.querySelector('#c-result');
      if (!raw) { box.innerHTML = ''; showErr('There is no CSV content yet.'); return; }

      const rows = parseCSV(raw);
      if (rows.length < 2) { box.innerHTML = ''; showErr('A header row and at least one data row are needed.'); return; }

      const header = rows[0].map(h => norm(h).replace(/\s+/g, '_'));
      const missing = ['ky_thi','ky_nang','do_kho','dang_cau','noi_dung'].filter(c => !header.includes(c));
      if (missing.length) { box.innerHTML = ''; showErr('Missing required columns: ' + missing.join(', ')); return; }

      const bad = [];
      rows.slice(1).forEach((cells, i) => {
        const r = rowToItem(cells, header);
        if (r.error) bad.push({ row: i + 2, error: r.error, preview: (cells[header.indexOf('noi_dung')] || '').slice(0, 60) });
        else pending.push(r.item);
      });

      if (pending.length > 500) {
        box.innerHTML = '';
        showErr('The file has ' + pending.length + ' valid rows, over the 500-item limit. Split it up.');
        pending = [];
        return;
      }

      box.innerHTML =
        '<div class="flex flex-wrap items-center gap-2.5 mb-3">' +
          '<span class="badge badge-ok">' + pending.length + ' valid rows</span>' +
          (bad.length ? '<span class="badge badge-hl">' + bad.length + ' rejected rows</span>' : '') +
        '</div>' +
        (pending.length
          ? '<div class="card overflow-hidden mb-3"><div class="max-h-52 overflow-y-auto"><table class="w-full text-[13px]">' +
            '<thead><tr class="text-[12px] uppercase tracking-wide text-muted border-b border-line bg-surface">' +
              '<th class="text-left font-bold px-3 py-2">Exam</th>' +
              '<th class="text-left font-bold px-3 py-2">Skill</th>' +
              '<th class="text-left font-bold px-3 py-2">Level</th>' +
              '<th class="text-left font-bold px-3 py-2">Text</th>' +
            '</tr></thead><tbody>' +
            pending.slice(0, 50).map(it =>
              '<tr class="border-b border-line last:border-0">' +
                '<td class="px-3 py-2"><span class="exam-chip" data-family="' + it.familyId + '">' +
                  AD.esc((families.find(f => f.id === it.familyId) || {}).name || it.familyId) + '</span></td>' +
                '<td class="px-3 py-2 text-muted">' + AD.esc(AD.SKILL_LABEL[it.skill]) + '</td>' +
                '<td class="px-3 py-2 text-muted">' + AD.esc(it.level) + '</td>' +
                '<td class="px-3 py-2 truncate max-w-[280px]">' + AD.esc(it.prompt) + '</td>' +
              '</tr>').join('') +
            '</tbody></table></div>' +
            (pending.length > 50 ? '<p class="text-[13px] text-muted px-3 py-2 border-t border-line">Previewing the first 50 rows.</p>' : '') +
            '</div>'
          : '') +
        (bad.length
          ? '<div class="card border-[color:var(--color-danger)] p-3 mb-3 max-h-40 overflow-y-auto">' +
            '<p class="text-[13px] font-bold uppercase tracking-wide text-muted mb-2">Rejected rows</p>' +
            bad.slice(0, 30).map(b =>
              '<p class="text-[13px] leading-relaxed"><b>Row ' + b.row + ':</b> ' + AD.esc(b.error) +
              (b.preview ? ' <span class="text-muted">- ' + AD.esc(b.preview) + '…</span>' : '') + '</p>').join('') +
            (bad.length > 30 ? '<p class="text-[13px] text-muted mt-2">…and ' + (bad.length - 30) + ' more.</p>' : '') +
            '</div>'
          : '') +
        (pending.length
          ? '<button type="button" id="c-go" class="btn btn-primary btn-md w-full">Import ' + pending.length + ' valid items</button>'
          : '<p class="text-[14px] text-muted text-center py-2">No valid rows to import.</p>');

      const go = mm.el.querySelector('#c-go');
      if (go) go.addEventListener('click', async () => {
        go.disabled = true;
        go.innerHTML = AD.icon('loader', 'w-4 h-4 animate-spin-slow') + 'Importing';
        try {
          const r = await AD.post('/admin/questions/bulk', { items: pending });
          clearMsg();
          mm.el.querySelector('#b-ok-text').textContent =
            'Imported ' + r.inserted + ' items into the bank.' + (r.failed ? ' The server refused ' + r.failed + ' rows.' : '');
          ok.classList.add('show');
          mm.el.querySelector('#c-result').innerHTML = '';
          mm.el.querySelector('#c-text').value = '';
          mm.el.querySelector('#c-file').value = '';
          load();
        } catch (e) {
          go.disabled = false;
          go.textContent = 'Import ' + pending.length + ' valid items';
          showErr(AD.esc(e.message));
        }
      });
    }
    mm.el.querySelector('#c-preview').addEventListener('click', preview);

    /* The JSON tab keeps its old behaviour */
    mm.el.querySelector('#b-go').addEventListener('click', async () => {
      clearMsg();
      let items;
      try {
        items = JSON.parse(mm.el.querySelector('#b-json').value);
        if (!Array.isArray(items)) throw new Error('The data must be a JSON array.');
      } catch (e) {
        showErr('Invalid JSON: ' + AD.esc(e.message));
        return;
      }
      try {
        const r = await AD.post('/admin/questions/bulk', { items });
        mm.el.querySelector('#b-ok-text').textContent =
          'Imported ' + r.inserted + ' items' + (r.failed ? ', skipping ' + r.failed + ' rejected rows.' : '.');
        ok.classList.add('show');
        if (r.errors && r.errors.length) {
          showErr(r.errors.map(e2 => 'Row ' + e2.row + ': ' + AD.esc(e2.error)).join('<br>'));
        }
        load();
      } catch (e) {
        showErr(AD.esc(e.message));
      }
    });
  });

  load();
})();
</script>
</body>
</html>
