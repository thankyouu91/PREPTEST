<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ngân hàng câu hỏi · Quản trị VPET Prep</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="bank" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-10">

      <div class="card p-4 mb-6 grid gap-3">
        <div class="flex flex-wrap gap-2.5">
          <label class="relative flex-1 min-w-[200px]">
            <span class="sr-only">Tìm câu hỏi</span>
            <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted pointer-events-none" id="search-icon"></span>
            <input id="q" type="search" class="input ps-10 py-2.5" placeholder="Tìm trong nội dung câu hỏi…">
          </label>
          <label class="sr-only" for="f-skill">Lọc kỹ năng</label>
          <select id="f-skill" class="input w-auto py-2.5">
            <option value="">Mọi kỹ năng</option>
            <option value="listening">Nghe</option><option value="reading">Đọc</option>
            <option value="writing">Viết</option><option value="speaking">Nói</option>
          </select>
          <label class="sr-only" for="f-level">Lọc độ khó</label>
          <select id="f-level" class="input w-auto py-2.5">
            <option value="">Mọi độ khó</option>
            <option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option><option>C2</option>
          </select>
          <label class="sr-only" for="f-type">Lọc dạng câu</label>
          <select id="f-type" class="input w-auto py-2.5">
            <option value="">Mọi dạng</option>
            <option value="mcq">Trắc nghiệm</option><option value="gap">Điền từ</option>
            <option value="essay">Tự luận</option><option value="speaking">Ghi âm</option>
          </select>
          <label class="sr-only" for="f-status">Lọc trạng thái</label>
          <select id="f-status" class="input w-auto py-2.5">
            <option value="active">Đang dùng</option>
            <option value="retired">Đã ngưng</option>
            <option value="">Tất cả</option>
          </select>
        </div>
        <div class="flex gap-2 overflow-x-auto no-scrollbar" id="fam-chips"></div>
      </div>

      <p class="text-[13.5px] font-semibold text-muted mb-3" id="count">Đang tải…</p>
      <div id="list"><div class="card p-5 grid gap-3.5">
        <div class="skeleton h-6 w-11/12"></div><div class="skeleton h-6 w-full"></div><div class="skeleton h-6 w-4/5"></div>
      </div></div>
      <div class="flex justify-center gap-2.5 mt-6" id="pager"></div>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
(async () => {
  await AD.mount({ title: 'Ngân hàng câu hỏi', subtitle: 'Kho câu dùng chung cho mọi đề của một kỳ thi' });
  AD.qs('#search-icon').innerHTML = AD.icon('search', 'w-[18px] h-[18px]');
  AD.qs('#page-actions').innerHTML =
    '<button type="button" id="btn-bulk" class="btn btn-soft btn-sm">' + AD.icon('upload', 'w-4 h-4') + '<span class="hidden sm:inline">Nhập hàng loạt</span></button>' +
    '<button type="button" id="btn-new" class="btn btn-primary btn-sm">' + AD.icon('plus', 'w-4 h-4') + 'Thêm câu</button>';

  let families = [];
  try { families = (await AD.get('/catalog')).families; } catch (e) {}

  const state = { family: '', skill: '', level: '', type: '', status: 'active', q: '', offset: 0, limit: 25 };

  AD.qs('#fam-chips').innerHTML =
    '<button type="button" class="chip shrink-0" data-f="" aria-pressed="true">Mọi kỳ thi</button>' +
    families.map(f => '<button type="button" class="chip shrink-0" data-family="' + f.id + '" data-f="' + f.id + '" aria-pressed="false">' + AD.esc(f.name) + '</button>').join('');
  AD.qs('#fam-chips').addEventListener('click', e => {
    const b = e.target.closest('[data-f]');
    if (!b) return;
    state.family = b.getAttribute('data-f'); state.offset = 0;
    AD.qsa('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    load();
  });
  ['skill', 'level', 'type', 'status'].forEach(k => AD.qs('#f-' + k).addEventListener('change', e => {
    state[k] = e.target.value; state.offset = 0; load();
  }));
  let t = null;
  AD.qs('#q').addEventListener('input', e => {
    state.q = e.target.value.trim(); state.offset = 0;
    clearTimeout(t); t = setTimeout(load, 250);
  });

  async function load() {
    const p = new URLSearchParams({ limit: state.limit, offset: state.offset });
    ['family', 'skill', 'level', 'type', 'status', 'q'].forEach(k => { if (state[k]) p.set(k, state[k]); });
    try {
      const r = await AD.get('/admin/questions?' + p);
      AD.qs('#count').textContent = r.total
        ? AD.num(r.total) + ' câu khớp bộ lọc · hiện ' + (r.offset + 1) + '-' + Math.min(r.offset + r.limit, r.total)
        : 'Không có câu nào khớp';
      if (!r.items.length) {
        AD.qs('#list').innerHTML = AD.emptyBox('database', 'Ngân hàng chưa có câu nào khớp',
          'Thêm câu thủ công, hoặc nhập hàng loạt bằng JSON để dựng kho nhanh.',
          '<button type="button" class="btn btn-primary btn-md" data-empty-new>Thêm câu hỏi</button>');
        const b = AD.qs('[data-empty-new]');
        if (b) b.addEventListener('click', () => openEditor(null));
        AD.qs('#pager').innerHTML = '';
        return;
      }
      AD.qs('#list').innerHTML = '<div class="grid gap-2.5">' + r.items.map(card).join('') + '</div>';
      AD.qsa('[data-edit]').forEach(b => b.addEventListener('click', () => {
        openEditor(r.items.find(x => x.id === +b.getAttribute('data-edit')));
      }));
      bindAudio();
      AD.qsa('[data-toggle]').forEach(b => b.addEventListener('click', async () => {
        const id = +b.getAttribute('data-toggle');
        const to = b.getAttribute('data-to');
        try { await AD.post('/admin/questions/' + id + '/status', { status: to }); AD.toast(to === 'retired' ? 'Đã ngưng dùng câu này' : 'Đã dùng lại câu này'); load(); }
        catch (e) { AD.toast(e.message, 'error'); }
      }));

      const pages = Math.ceil(r.total / r.limit);
      const cur = Math.floor(r.offset / r.limit) + 1;
      AD.qs('#pager').innerHTML = pages > 1
        ? '<button type="button" class="btn btn-ghost btn-sm" data-page="prev" ' + (cur === 1 ? 'disabled' : '') + '>Trước</button>' +
          '<span class="text-[13.5px] font-bold text-muted self-center px-2">Trang ' + cur + '/' + pages + '</span>' +
          '<button type="button" class="btn btn-ghost btn-sm" data-page="next" ' + (cur === pages ? 'disabled' : '') + '>Sau</button>'
        : '';
      AD.qsa('[data-page]').forEach(b => b.addEventListener('click', () => {
        state.offset += b.getAttribute('data-page') === 'next' ? state.limit : -state.limit;
        state.offset = Math.max(0, state.offset);
        window.scrollTo({ top: 0, behavior: 'smooth' });
        load();
      }));
    } catch (e) {
      AD.qs('#list').innerHTML = AD.errorBox(e.message, 'retry');
      AD.qs('#retry').addEventListener('click', load);
    }
  }

  /* VPET plays audio in parts E, F, G, H and J, so listening and speaking
     items can carry one MP3 each. Other skills never need sound, so the
     control only appears where it makes sense. */
  const NEEDS_AUDIO = ['listening', 'speaking'];

  function audioBlock(i) {
    if (!NEEDS_AUDIO.includes(i.skill)) return '';
    const kb = i.audioBytes ? Math.max(1, Math.round(i.audioBytes / 1024)) : 0;
    /* Cache-bust on the upload timestamp: replacing a file must not leave the
       browser playing the old one. */
    const src = '/api/admin/questions/' + i.id + '/audio?v=' + encodeURIComponent(i.audioAt || '');
    return '<span class="block mt-2.5 pt-2.5 border-t border-line">' +
      (i.hasAudio
        ? '<span class="flex flex-wrap items-center gap-2">' +
            '<audio controls preload="none" class="h-9 max-w-full" src="' + src + '"></audio>' +
            '<span class="badge badge-muted">MP3 · ' + kb + ' KB</span>' +
            '<label class="btn btn-ghost btn-sm cursor-pointer">Replace' +
              '<input type="file" accept="audio/mpeg" class="sr-only" data-audio-file="' + i.id + '">' +
            '</label>' +
            '<button type="button" class="btn btn-ghost btn-sm" data-audio-del="' + i.id + '">Remove</button>' +
          '</span>'
        : '<span class="flex flex-wrap items-center gap-2">' +
            '<span class="badge badge-hl">No audio</span>' +
            '<label class="btn btn-ghost btn-sm cursor-pointer">Attach MP3' +
              '<input type="file" accept="audio/mpeg" class="sr-only" data-audio-file="' + i.id + '">' +
            '</label>' +
          '</span>') +
    '</span>';
  }

  /* Wired once per render, same as the edit and retire buttons. */
  function bindAudio() {
    AD.qsa('[data-audio-file]').forEach(inp => inp.addEventListener('change', async () => {
      const file = inp.files && inp.files[0];
      if (!file) return;
      const id = inp.getAttribute('data-audio-file');
      try {
        await AD.upload('/admin/questions/' + id + '/audio', file);
        AD.toast('Audio attached');
        load();
      } catch (e) {
        AD.toast(e.message, 'error');
        inp.value = '';
      }
    }));
    AD.qsa('[data-audio-del]').forEach(b => b.addEventListener('click', async () => {
      const id = b.getAttribute('data-audio-del');
      try { await AD.del('/admin/questions/' + id + '/audio'); AD.toast('Audio removed'); load(); }
      catch (e) { AD.toast(e.message, 'error'); }
    }));
  }

  function card(i) {
    const fam = families.find(f => f.id === i.familyId);
    return '<article class="card p-4 flex items-start gap-3.5' + (i.status === 'retired' ? ' opacity-60' : '') + '">' +
      '<span class="min-w-0 flex-1">' +
        '<span class="flex flex-wrap items-center gap-1.5 mb-2">' +
          '<span class="exam-chip" data-family="' + i.familyId + '">' + AD.esc(fam ? fam.name : i.familyId) + '</span>' +
          '<span class="badge badge-muted">' + AD.esc(AD.SKILL_VI[i.skill] || i.skill) + '</span>' +
          '<span class="badge badge-muted">' + AD.esc(i.level) + '</span>' +
          '<span class="badge badge-muted">' + AD.esc(AD.TYPE_VI[i.type] || i.type) + '</span>' +
          (i.status === 'retired' ? '<span class="badge badge-hl">Đã ngưng</span>' : '') +
        '</span>' +
        '<span class="block text-[14.5px] leading-snug">' + AD.esc(i.prompt) + '</span>' +
        (i.options && i.options.length
          ? '<span class="block text-[12.5px] text-muted mt-1.5">' +
              i.options.map(o => (o === i.answer ? '<b class="text-accent-strong">' + AD.esc(o) + '</b>' : AD.esc(o))).join(' · ') + '</span>'
          : '') +
        audioBlock(i) +
      '</span>' +
      '<span class="flex flex-col gap-1.5 shrink-0">' +
        '<button type="button" class="p-2 rounded-full text-muted hover:text-ink transition" data-edit="' + i.id + '" aria-label="Sửa câu hỏi">' + AD.icon('edit', 'w-4 h-4') + '</button>' +
        '<button type="button" class="p-2 rounded-full text-muted hover:text-danger transition" data-toggle="' + i.id + '" data-to="' +
          (i.status === 'active' ? 'retired' : 'active') + '" aria-label="' + (i.status === 'active' ? 'Ngưng dùng' : 'Dùng lại') + '">' +
          AD.icon(i.status === 'active' ? 'x' : 'check', 'w-4 h-4') + '</button>' +
      '</span>' +
    '</article>';
  }

  /* ---------- Thêm / sửa câu ---------- */
  function openEditor(item) {
    const isNew = !item;
    const d = item || { familyId: families[0] && families[0].id, skill: 'listening', level: 'B1', type: 'mcq', prompt: '', options: ['', '', '', ''], answer: '', explanation: '', tags: [] };
    const mm = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">' + (isNew ? 'Thêm câu hỏi' : 'Sửa câu hỏi') + '</h3>' +
      '<div class="grid gap-4 mt-5">' +
        '<div class="grid grid-cols-2 gap-3">' +
          '<div><label class="label" for="q-family">Kỳ thi</label><select class="input" id="q-family">' +
            families.map(f => '<option value="' + f.id + '"' + (f.id === d.familyId ? ' selected' : '') + '>' + AD.esc(f.name) + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="q-skill">Kỹ năng</label><select class="input" id="q-skill">' +
            ['listening','reading','writing','speaking'].map(s => '<option value="' + s + '"' + (s === d.skill ? ' selected' : '') + '>' + AD.SKILL_VI[s] + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="q-level">Độ khó</label><select class="input" id="q-level">' +
            ['A1','A2','B1','B2','C1','C2'].map(l => '<option' + (l === d.level ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>' +
          '<div><label class="label" for="q-type">Dạng câu</label><select class="input" id="q-type">' +
            ['mcq','gap','essay','speaking'].map(t2 => '<option value="' + t2 + '"' + (t2 === d.type ? ' selected' : '') + '>' + AD.TYPE_VI[t2] + '</option>').join('') + '</select></div>' +
        '</div>' +
        '<div><label class="label" for="q-prompt">Nội dung câu hỏi</label>' +
          '<textarea class="input" id="q-prompt" rows="3">' + AD.esc(d.prompt) + '</textarea></div>' +
        '<div id="q-mcq">' +
          '<p class="label">Phương án (đánh dấu đáp án đúng)</p>' +
          '<div class="grid gap-2" id="q-options"></div>' +
        '</div>' +
        '<div><label class="label" for="q-exp">Giải thích <span class="font-medium text-muted">(không bắt buộc)</span></label>' +
          '<textarea class="input" id="q-exp" rows="2">' + AD.esc(d.explanation) + '</textarea></div>' +
        '<div class="banner banner-error" id="q-err"><span id="q-err-text"></span></div>' +
        '<div class="flex gap-2.5"><button type="button" id="q-save" class="btn btn-primary btn-md flex-1">' +
          (isNew ? 'Thêm vào ngân hàng' : 'Lưu thay đổi') + '</button>' +
          '<button type="button" data-close class="btn btn-ghost btn-md">Huỷ</button></div>' +
      '</div>', { wide: true });

    const typeEl = mm.el.querySelector('#q-type');
    const optWrap = mm.el.querySelector('#q-options');
    const mcqBox = mm.el.querySelector('#q-mcq');

    function renderOptions() {
      const opts = (d.options && d.options.length ? d.options : ['', '', '', '']).slice(0, 6);
      while (opts.length < 4) opts.push('');
      optWrap.innerHTML = opts.map((o, i) =>
        '<label class="flex items-center gap-2.5">' +
          '<input type="radio" name="ans" class="w-4 h-4 accent-[color:var(--color-accent)] shrink-0" ' +
            (o && o === d.answer ? 'checked' : '') + ' data-ans="' + i + '" aria-label="Đáp án đúng là phương án ' + (i + 1) + '">' +
          '<input class="input py-2" data-opt="' + i + '" value="' + AD.esc(o) + '" placeholder="Phương án ' + (i + 1) + '" aria-label="Phương án ' + (i + 1) + '">' +
        '</label>').join('');
    }
    function syncType() {
      mcqBox.hidden = typeEl.value !== 'mcq';
    }
    renderOptions(); syncType();
    typeEl.addEventListener('change', syncType);

    mm.el.querySelector('#q-save').addEventListener('click', async () => {
      const err = mm.el.querySelector('#q-err');
      err.classList.remove('show');
      const options = AD.qsa('[data-opt]', mm.el).map(i => i.value.trim()).filter(Boolean);
      const ansIdx = AD.qsa('[data-ans]', mm.el).findIndex(r => r.checked);
      const allOpts = AD.qsa('[data-opt]', mm.el).map(i => i.value.trim());
      const body = {
        familyId: mm.el.querySelector('#q-family').value,
        skill: mm.el.querySelector('#q-skill').value,
        level: mm.el.querySelector('#q-level').value,
        type: typeEl.value,
        prompt: mm.el.querySelector('#q-prompt').value,
        explanation: mm.el.querySelector('#q-exp').value,
        options: typeEl.value === 'mcq' ? options : [],
        answer: typeEl.value === 'mcq' ? (ansIdx >= 0 ? allOpts[ansIdx] : '') : '',
        tags: d.tags || []
      };
      try {
        if (isNew) await AD.post('/admin/questions', body);
        else await AD.put('/admin/questions/' + item.id, body);
        mm.close();
        AD.toast(isNew ? 'Đã thêm câu hỏi' : 'Đã lưu câu hỏi');
        load();
      } catch (e) {
        mm.el.querySelector('#q-err-text').textContent = e.message;
        err.classList.add('show');
      }
    });
  }
  AD.qs('#btn-new').addEventListener('click', () => openEditor(null));

  /* ============================================================
     Nhập hàng loạt: CSV (mặc định) hoặc JSON
     CSV được phân tích ngay tại trình duyệt, xem trước rồi mới gửi lên.
     ============================================================ */

  /** Tách CSV có hỗ trợ dấu ngoặc kép, dấu phẩy trong ô và xuống dòng CRLF/LF */
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');              // bỏ BOM nếu có
    const rows = [];
    let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], next = text[i + 1];
      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') inQuotes = false;
        else field += c;
      } else if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* bỏ qua, xử lý ở \n */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(cell => cell.trim() !== ''));
  }

  const CSV_COLS = ['ky_thi','ky_nang','do_kho','dang_cau','noi_dung',
                    'phuong_an_1','phuong_an_2','phuong_an_3','phuong_an_4','dap_an','giai_thich'];
  const SKILL_ALIAS = { nghe:'listening', doc:'reading', viet:'writing', noi:'speaking',
                        listening:'listening', reading:'reading', writing:'writing', speaking:'speaking' };
  const TYPE_ALIAS = { 'trac nghiem':'mcq', 'dien tu':'gap', 'tu luan':'essay', 'ghi am':'speaking',
                       mcq:'mcq', gap:'gap', essay:'essay', speaking:'speaking' };
  const norm = s => String(s || '').trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');

  /** Một dòng CSV → object câu hỏi + lý do lỗi nếu có */
  function rowToItem(cells, header) {
    const get = name => {
      const i = header.indexOf(name);
      return i >= 0 ? String(cells[i] || '').trim() : '';
    };
    const familyId = norm(get('ky_thi'));
    const skill = SKILL_ALIAS[norm(get('ky_nang'))];
    const level = get('do_kho').toUpperCase();
    const type = TYPE_ALIAS[norm(get('dang_cau'))];
    const prompt = get('noi_dung');
    const options = ['phuong_an_1','phuong_an_2','phuong_an_3','phuong_an_4'].map(get).filter(Boolean);
    const answer = get('dap_an');

    if (!families.some(f => f.id === familyId)) return { error: 'Kỳ thi "' + get('ky_thi') + '" không có trong hệ thống.' };
    if (!skill) return { error: 'Kỹ năng "' + get('ky_nang') + '" không hợp lệ (nghe/đọc/viết/nói).' };
    if (!['A1','A2','B1','B2','C1','C2'].includes(level)) return { error: 'Độ khó "' + get('do_kho') + '" không hợp lệ.' };
    if (!type) return { error: 'Dạng câu "' + get('dang_cau') + '" không hợp lệ.' };
    if (prompt.length < 5) return { error: 'Nội dung câu hỏi quá ngắn.' };
    if (type === 'mcq') {
      if (options.length < 2) return { error: 'Câu trắc nghiệm cần ít nhất 2 phương án.' };
      if (!options.includes(answer)) return { error: 'Đáp án phải trùng một trong các phương án.' };
    }
    return {
      item: { familyId, skill, level, type, prompt,
              options: type === 'mcq' ? options : [],
              answer: type === 'mcq' ? answer : '',
              explanation: get('giai_thich'), tags: ['nhập csv'] }
    };
  }

  AD.qs('#btn-bulk').addEventListener('click', () => {
    const sampleJson = JSON.stringify([{
      familyId: families[0] ? families[0].id : 'ielts', skill: 'reading', level: 'B1', type: 'mcq',
      prompt: 'Nội dung câu hỏi…', options: ['A', 'B', 'C', 'D'], answer: 'A', explanation: ''
    }], null, 2);

    const mm = AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">Nhập câu hỏi hàng loạt</h3>' +
      '<p class="text-muted text-[14px] mt-1.5 leading-relaxed">Tối đa 500 câu mỗi lần. Dòng lỗi được liệt kê riêng, các dòng hợp lệ vẫn nhập được.</p>' +

      '<div role="tablist" aria-label="Cách nhập" class="flex gap-2 border-b border-line mt-5">' +
        '<button role="tab" id="tb-csv" aria-controls="pn-csv" aria-selected="true" class="tabbtn">Từ CSV</button>' +
        '<button role="tab" id="tb-json" aria-controls="pn-json" aria-selected="false" class="tabbtn">Từ JSON</button>' +
      '</div>' +

      /* ----- Tab CSV ----- */
      '<div role="tabpanel" id="pn-csv" aria-labelledby="tb-csv" class="grid gap-4 mt-5">' +
        '<div class="card bg-brand-soft border-0 p-4">' +
          '<p class="text-[13.5px] leading-relaxed">Cột theo thứ tự: <b>ky_thi, ky_nang, do_kho, dang_cau, noi_dung, phuong_an_1..4, dap_an, giai_thich</b>. ' +
            'Kỹ năng nhận cả tiếng Việt (nghe, đọc, viết, nói) lẫn tiếng Anh.</p>' +
          '<a href="/api/admin/questions/template.csv" class="btn btn-soft btn-sm mt-3">' +
            AD.icon('download', 'w-4 h-4') + 'Tải tệp CSV mẫu</a>' +
        '</div>' +
        '<div><label class="label" for="c-file">Chọn tệp CSV</label>' +
          '<input class="input py-2" id="c-file" type="file" accept=".csv,text/csv"></div>' +
        '<div><label class="label" for="c-text">Hoặc dán trực tiếp nội dung CSV</label>' +
          '<textarea class="input font-mono text-[12.5px]" id="c-text" rows="6" spellcheck="false" ' +
            'placeholder="ky_thi,ky_nang,do_kho,dang_cau,noi_dung,..."></textarea></div>' +
        '<button type="button" id="c-preview" class="btn btn-ghost btn-md">Xem trước</button>' +
        '<div id="c-result"></div>' +
      '</div>' +

      /* ----- Tab JSON ----- */
      '<div role="tabpanel" id="pn-json" aria-labelledby="tb-json" hidden class="grid gap-4 mt-5">' +
        '<div><label class="label" for="b-json">Mảng JSON</label>' +
          '<textarea class="input font-mono text-[12.5px]" id="b-json" rows="10" spellcheck="false">' + AD.esc(sampleJson) + '</textarea></div>' +
        '<button type="button" id="b-go" class="btn btn-primary btn-md">Nhập vào ngân hàng</button>' +
      '</div>' +

      '<div class="banner banner-error mt-4" id="b-err"><span id="b-err-text"></span></div>' +
      '<div class="banner banner-success mt-4" id="b-ok"><span id="b-ok-text"></span></div>' +
      '<div class="flex justify-end mt-5"><button type="button" data-close class="btn btn-ghost btn-md">Đóng</button></div>',
      { wide: true });

    const err = mm.el.querySelector('#b-err'), ok = mm.el.querySelector('#b-ok');
    const showErr = html => { mm.el.querySelector('#b-err-text').innerHTML = html; err.classList.add('show'); };
    const clearMsg = () => { err.classList.remove('show'); ok.classList.remove('show'); };

    /* Chuyển tab */
    [['tb-csv','pn-csv'],['tb-json','pn-json']].forEach(([t2, p2], _, all) => {
      mm.el.querySelector('#' + t2).addEventListener('click', () => {
        all.forEach(([t3, p3]) => {
          const on = t3 === t2;
          mm.el.querySelector('#' + t3).setAttribute('aria-selected', String(on));
          mm.el.querySelector('#' + p3).toggleAttribute('hidden', !on);
        });
        clearMsg();
      });
    });

    /* Đọc tệp vào ô văn bản */
    mm.el.querySelector('#c-file').addEventListener('change', ev => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      const reader = new FileReader();
      reader.onload = () => { mm.el.querySelector('#c-text').value = String(reader.result || ''); preview(); };
      reader.onerror = () => showErr('Không đọc được tệp.');
      reader.readAsText(f, 'utf-8');
    });

    let pending = [];
    function preview() {
      clearMsg();
      pending = [];
      const raw = mm.el.querySelector('#c-text').value.trim();
      const box = mm.el.querySelector('#c-result');
      if (!raw) { box.innerHTML = ''; showErr('Chưa có nội dung CSV nào.'); return; }

      const rows = parseCSV(raw);
      if (rows.length < 2) { box.innerHTML = ''; showErr('Cần dòng tiêu đề và ít nhất một dòng dữ liệu.'); return; }

      const header = rows[0].map(h => norm(h).replace(/\s+/g, '_'));
      const missing = ['ky_thi','ky_nang','do_kho','dang_cau','noi_dung'].filter(c => !header.includes(c));
      if (missing.length) { box.innerHTML = ''; showErr('Thiếu cột bắt buộc: ' + missing.join(', ')); return; }

      const bad = [];
      rows.slice(1).forEach((cells, i) => {
        const r = rowToItem(cells, header);
        if (r.error) bad.push({ row: i + 2, error: r.error, preview: (cells[header.indexOf('noi_dung')] || '').slice(0, 60) });
        else pending.push(r.item);
      });

      if (pending.length > 500) {
        box.innerHTML = '';
        showErr('Tệp có ' + pending.length + ' dòng hợp lệ, vượt giới hạn 500 câu mỗi lần. Hãy chia nhỏ tệp.');
        pending = [];
        return;
      }

      box.innerHTML =
        '<div class="flex flex-wrap items-center gap-2.5 mb-3">' +
          '<span class="badge badge-ok">' + pending.length + ' dòng hợp lệ</span>' +
          (bad.length ? '<span class="badge badge-hl">' + bad.length + ' dòng lỗi</span>' : '') +
        '</div>' +
        (pending.length
          ? '<div class="card overflow-hidden mb-3"><div class="max-h-52 overflow-y-auto"><table class="w-full text-[13px]">' +
            '<thead><tr class="text-[11.5px] uppercase tracking-wide text-muted border-b border-line bg-surface">' +
              '<th class="text-left font-bold px-3 py-2">Kỳ thi</th>' +
              '<th class="text-left font-bold px-3 py-2">Kỹ năng</th>' +
              '<th class="text-left font-bold px-3 py-2">Độ khó</th>' +
              '<th class="text-left font-bold px-3 py-2">Nội dung</th>' +
            '</tr></thead><tbody>' +
            pending.slice(0, 50).map(it =>
              '<tr class="border-b border-line last:border-0">' +
                '<td class="px-3 py-2"><span class="exam-chip" data-family="' + it.familyId + '">' +
                  AD.esc((families.find(f => f.id === it.familyId) || {}).name || it.familyId) + '</span></td>' +
                '<td class="px-3 py-2 text-muted">' + AD.esc(AD.SKILL_VI[it.skill]) + '</td>' +
                '<td class="px-3 py-2 text-muted">' + AD.esc(it.level) + '</td>' +
                '<td class="px-3 py-2 truncate max-w-[280px]">' + AD.esc(it.prompt) + '</td>' +
              '</tr>').join('') +
            '</tbody></table></div>' +
            (pending.length > 50 ? '<p class="text-[12.5px] text-muted px-3 py-2 border-t border-line">Xem trước 50 dòng đầu.</p>' : '') +
            '</div>'
          : '') +
        (bad.length
          ? '<div class="card border-[color:var(--color-danger)] p-3 mb-3 max-h-40 overflow-y-auto">' +
            '<p class="text-[12.5px] font-bold uppercase tracking-wide text-muted mb-2">Dòng bị bỏ qua</p>' +
            bad.slice(0, 30).map(b =>
              '<p class="text-[13px] leading-relaxed"><b>Dòng ' + b.row + ':</b> ' + AD.esc(b.error) +
              (b.preview ? ' <span class="text-muted">— ' + AD.esc(b.preview) + '…</span>' : '') + '</p>').join('') +
            (bad.length > 30 ? '<p class="text-[12.5px] text-muted mt-2">…và ' + (bad.length - 30) + ' dòng nữa.</p>' : '') +
            '</div>'
          : '') +
        (pending.length
          ? '<button type="button" id="c-go" class="btn btn-primary btn-md w-full">Nhập ' + pending.length + ' câu hợp lệ</button>'
          : '<p class="text-[14px] text-muted text-center py-2">Không có dòng nào hợp lệ để nhập.</p>');

      const go = mm.el.querySelector('#c-go');
      if (go) go.addEventListener('click', async () => {
        go.disabled = true;
        go.innerHTML = AD.icon('loader', 'w-4 h-4 animate-spin-slow') + 'Đang nhập';
        try {
          const r = await AD.post('/admin/questions/bulk', { items: pending });
          clearMsg();
          mm.el.querySelector('#b-ok-text').textContent =
            'Đã nhập ' + r.inserted + ' câu vào ngân hàng.' + (r.failed ? ' Máy chủ từ chối ' + r.failed + ' dòng.' : '');
          ok.classList.add('show');
          mm.el.querySelector('#c-result').innerHTML = '';
          mm.el.querySelector('#c-text').value = '';
          mm.el.querySelector('#c-file').value = '';
          load();
        } catch (e) {
          go.disabled = false;
          go.textContent = 'Nhập ' + pending.length + ' câu hợp lệ';
          showErr(AD.esc(e.message));
        }
      });
    }
    mm.el.querySelector('#c-preview').addEventListener('click', preview);

    /* Tab JSON giữ nguyên hành vi cũ */
    mm.el.querySelector('#b-go').addEventListener('click', async () => {
      clearMsg();
      let items;
      try {
        items = JSON.parse(mm.el.querySelector('#b-json').value);
        if (!Array.isArray(items)) throw new Error('Dữ liệu phải là một mảng JSON.');
      } catch (e) {
        showErr('JSON không hợp lệ: ' + AD.esc(e.message));
        return;
      }
      try {
        const r = await AD.post('/admin/questions/bulk', { items });
        mm.el.querySelector('#b-ok-text').textContent =
          'Đã nhập ' + r.inserted + ' câu' + (r.failed ? ', bỏ qua ' + r.failed + ' dòng lỗi.' : '.');
        ok.classList.add('show');
        if (r.errors && r.errors.length) {
          showErr(r.errors.map(e2 => 'Dòng ' + e2.row + ': ' + AD.esc(e2.error)).join('<br>'));
        }
        load();
      } catch (e) {
        showErr(AD.esc(e.message));
      }
    });
  });

  load();
})();
</script>
</body>
</html>
