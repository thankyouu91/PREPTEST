<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standard formats · VPET Prep admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
    }catch(e){}})();
  </script>
  <!-- Song ngữ: đặt ngôn ngữ (mặc định tiếng Việt) trước khi vẽ trang -->
  <script src="/i18n.js"></script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="formats" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-[1240px] mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-10">

      <section class="max-w-[70ch] mb-6">
        <h2 class="text-2xl font-extrabold tracking-tight">Standard paper formats</h2>
        <p class="text-muted text-[15px] leading-relaxed mt-2">
          The real structure of each exam. Pick a format and the generator produces a paper with the
          right item count, timing and item types — no blueprint typed in by hand.
          The <b class="text-ink">bank</b> column says how many items are still missing before you can generate.
        </p>
      </section>

      <div class="flex flex-wrap items-center gap-2.5 mb-6">
        <label class="flex items-center gap-2 text-[13.5px] font-semibold text-muted">
          Exam
          <select id="f-family" class="input w-auto py-2"><option value="">All</option></select>
        </label>
        <label class="flex items-center gap-2 text-[13.5px] font-semibold text-muted">
          Level
          <select id="f-level" class="input w-auto py-2">
            <option>A2</option><option selected>B1</option><option>B2</option><option>C1</option>
          </select>
        </label>
        <label class="flex items-center gap-2 text-[13.5px] font-semibold text-muted">
          <input type="checkbox" id="f-strict" class="w-4 h-4 rounded accent-[color:var(--color-accent)]">
          Count only items at this level
        </label>
        <span id="count" class="text-[13px] font-semibold text-muted ms-auto"></span>
      </div>

      <div id="list" class="grid gap-5">
        <div class="card p-5 grid gap-3.5">
          <div class="skeleton h-6 w-11/12"></div><div class="skeleton h-6 w-full"></div><div class="skeleton h-6 w-4/5"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/admin/_admin.js"></script>
<script>
AD.mount({ title: 'Standard paper formats' }).then(async () => {
  const KIND = { full: 'Whole paper', module: 'One skill', mini: 'Shortened' };
  const SKILL_LABEL = { listening: 'Listening', reading: 'Reading', writing: 'Writing', speaking: 'Speaking' };

  /* Load the exam list for the filter */
  try {
    const cat = await (await fetch('/api/catalog', { credentials: 'same-origin' })).json();
    AD.qs('#f-family').innerHTML = '<option value="">All</option>' +
      cat.families.map(f => '<option value="' + f.id + '">' + AD.esc(f.name) + '</option>').join('');
  } catch (e) { /* leave it as "All" */ }

  /* One block of a format: item count, timing, bank coverage, and the parts inside it */
  function sectionRow(s) {
    const b = s.bank;
    const ok = b.short === 0;
    return '<div class="rounded-xl border border-line p-3.5">' +
      '<div class="flex flex-wrap items-center gap-2">' +
        '<span class="badge badge-muted">' + SKILL_LABEL[s.skill] + '</span>' +
        '<b class="text-[14.5px]">' + AD.esc(s.name) + '</b>' +
        '<span class="text-[13px] text-muted">' + s.items + ' items · ' + s.minutes + ' min</span>' +
        '<span class="badge ' + (ok ? 'badge-ok' : 'badge-hl') + ' ms-auto">' +
          (ok ? 'bank is sufficient (' + b.have + ')' : b.short + ' items short') +
        '</span>' +
      '</div>' +
      (s.parts.length
        ? '<ul class="grid gap-1 mt-3 text-[13px] text-muted">' +
            s.parts.map(p =>
              '<li class="flex gap-2"><b class="text-ink shrink-0 w-[9rem]">' + AD.esc(p.label) + '</b>' +
              '<span class="shrink-0 w-14">' + p.items + ' items</span>' +
              '<span class="min-w-0">' + AD.esc(p.note) + '</span></li>').join('') +
          '</ul>'
        : '') +
    '</div>';
  }

  function card(f) {
    return '<article class="card p-5 sm:p-6" data-format="' + f.id + '">' +
      '<div class="flex flex-wrap items-start gap-3">' +
        '<div class="min-w-0">' +
          '<div class="flex flex-wrap items-center gap-2">' +
            '<span class="exam-chip" data-family="' + f.familyId + '">' + AD.esc(f.familyName) + '</span>' +
            '<span class="badge badge-muted">' + KIND[f.kind] + '</span>' +
            '<span class="badge ' + (f.ready ? 'badge-ok' : 'badge-hl') + '">' +
              (f.ready ? 'Ready to generate' : f.shortBy + ' items short') + '</span>' +
          '</div>' +
          '<h3 class="text-lg font-extrabold tracking-tight mt-2.5">' + AD.esc(f.name) + '</h3>' +
          '<p class="text-[13.5px] font-semibold text-muted mt-1">' +
            f.totalItems + ' items · ' + f.totalMinutes + ' min · ' + AD.esc(f.scoring) + '</p>' +
        '</div>' +
        '<div class="flex gap-2 ms-auto">' +
          '<button type="button" class="btn btn-ghost btn-sm" data-detail="' + f.id + '">Details</button>' +
          '<button type="button" class="btn btn-primary btn-sm" data-make="' + f.id + '"' +
            (f.ready ? '' : ' disabled title="Not enough questions in the bank"') + '>Generate</button>' +
        '</div>' +
      '</div>' +
      '<div class="grid gap-2.5 mt-4">' + f.sections.map(sectionRow).join('') + '</div>' +
      (f.notes && f.notes.length
        ? '<details class="mt-4"><summary class="text-[13.5px] font-bold text-brand-strong cursor-pointer">Notes on the exam</summary>' +
          '<ul class="grid gap-1.5 mt-2.5 text-[13.5px] text-muted">' +
            f.notes.map(n => '<li class="flex gap-2"><span class="text-accent-strong">·</span><span>' + AD.esc(n) + '</span></li>').join('') +
          '</ul></details>'
        : '') +
    '</article>';
  }

  let formats = [];

  async function load() {
    const fam = AD.qs('#f-family').value;
    const lvl = AD.qs('#f-level').value;
    const strict = AD.qs('#f-strict').checked ? '1' : '0';
    try {
      const r = await AD.get('/admin/exam-formats?familyId=' + encodeURIComponent(fam) +
        '&level=' + encodeURIComponent(lvl) + '&strict=' + strict);
      formats = r.formats;
      AD.qs('#count').textContent = formats.length + ' format · ' +
        formats.filter(f => f.ready).length + ' ready to generate';
      AD.qs('#list').innerHTML = formats.map(card).join('');
    } catch (e) {
      AD.qs('#list').innerHTML = '<div class="card p-8 text-center"><p class="text-muted">' +
        AD.esc(e.message || 'The format list could not be loaded.') + '</p></div>';
    }
  }

  ['#f-family', '#f-level', '#f-strict'].forEach(sel =>
    AD.qs(sel).addEventListener('change', load));

  /* Generate from a format: the sections go straight over as the blueprint */
  AD.qs('#list').addEventListener('click', async e => {
    const mk = e.target.closest('[data-make]');
    if (mk) return makeTest(mk);
    const dt = e.target.closest('[data-detail]');
    if (dt) return showDetail(dt.getAttribute('data-detail'));
  });

  function showDetail(id) {
    const f = formats.find(x => x.id === id);
    if (!f) return;
    AD.modal(
      '<h3 class="text-lg font-extrabold tracking-tight">' + AD.esc(f.name) + '</h3>' +
      '<p class="text-[13.5px] text-muted mt-1">' + f.totalItems + ' items · ' + f.totalMinutes +
        ' min · for levels ' + f.levels.join(', ') + '</p>' +
      '<p class="label mt-5 mb-2">Instructions shown to the student</p>' +
      '<ul class="grid gap-1.5 text-[13.5px] text-muted">' +
        f.guide.map(g => '<li class="flex gap-2"><span class="text-accent-strong">·</span><span>' + AD.esc(g) + '</span></li>').join('') +
      '</ul>' +
      '<p class="label mt-5 mb-2">How it is marked</p>' +
      '<p class="text-[13.5px] text-muted">' + AD.esc(f.scoring) + '</p>' +
      '<p class="help mt-4">The full structure and score conversion live in docs/SCORING.md.</p>',
      { wide: true });
  }

  async function makeTest(btn) {
    const f = formats.find(x => x.id === btn.getAttribute('data-make'));
    if (!f) return;
    const lvl = AD.qs('#f-level').value;
    btn.disabled = true;
    btn.innerHTML = AD.icon('loader', 'w-4 h-4 animate-spin-slow') + 'Drawing items';
    try {
      const t = await AD.post('/admin/tests/generate', {
        familyId: f.familyId,
        level: lvl,
        title: f.name + ' — ' + lvl,
        scoring: f.scoring,
        guide: f.guide,
        strictLevel: AD.qs('#f-strict').checked,
        blueprint: f.sections.map(s => ({
          name: s.name, skill: s.skill, type: s.type,
          items: s.items, minutes: s.minutes, types: s.types
        }))
      });
      location.href = '/admin/de-thi/' + encodeURIComponent(t.id) + '/';
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Generate';
      const sh = err.data && err.data.shortages;
      AD.toast(err.message + (sh ? ' — ' + sh.map(s => s.section + ' short by ' + (s.need - s.have)).join(', ') : ''), 'error');
    }
  }

  load();
});
</script>
</body>
</html>
