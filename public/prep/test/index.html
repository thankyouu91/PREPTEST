<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test detail · VPET Prep</title>
  <meta name="description" content="The structure of a mock test: its parts, question types, timing and instructions.">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/pjs-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/pjs-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
      var tn=localStorage.getItem('prep.tenant');
      if(tn&&tn!=='default')document.documentElement.setAttribute('data-tenant',tn);
    }catch(e){}})();
  </script>
  <!-- Song ngữ: chạy sớm để đặt ngôn ngữ (mặc định tiếng Việt) trước khi vẽ trang -->
  <script src="/i18n.js"></script>
</head>
<body class="bg-surface text-ink">
<!-- "home": the papers live on the home page now, and "library" was not a
     navigation key at all, so no entry lit up on this screen. -->
<div id="app" data-active="home" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-shell mx-auto px-4 sm:px-6 lg:px-10 pb-6">

      <!-- Loading: waiting on GET /api/catalog -->
      <div id="t-loading" class="mt-10 grid lg:grid-cols-3 gap-6" aria-hidden="true">
        <div class="lg:col-span-2">
          <div class="flex gap-2 mb-5"><div class="skeleton h-6 w-16"></div><div class="skeleton h-6 w-10"></div></div>
          <div class="skeleton h-8 w-3/4 mb-3"></div>
          <div class="skeleton h-4 w-2/5 mb-8"></div>
          <div class="card p-6 grid gap-4">
            <div class="skeleton h-5 w-full"></div>
            <div class="skeleton h-5 w-5/6"></div>
            <div class="skeleton h-5 w-4/6"></div>
          </div>
        </div>
        <div class="card p-6 grid gap-4 content-start">
          <div class="skeleton h-6 w-2/3"></div>
          <div class="skeleton h-4 w-full"></div>
          <div class="skeleton h-11 w-full rounded-full"></div>
        </div>
      </div>

      <!-- Not found -->
      <section id="nf" hidden class="card p-10 mt-10 max-w-lg mx-auto text-center">
        <span class="w-14 h-14 rounded-full bg-brand-soft text-brand-strong inline-flex items-center justify-center mx-auto">
          <svg viewBox="0 0 24 24" class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        </span>
        <h2 class="text-xl font-extrabold tracking-tight mt-4">Test not found</h2>
        <p class="text-muted text-[15px] mt-1.5">This test does not exist, or it has been taken out of the library.</p>
        <a href="/prep/" class="btn btn-primary btn-md mt-6">Back to my papers</a>
      </section>

      <div id="page" hidden>
        <nav class="mt-7" aria-label="Breadcrumb">
          <a href="/prep/" class="inline-flex items-center gap-1.5 text-sm font-bold text-muted hover:text-ink transition">
            <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Test library
          </a>
        </nav>

        <header class="mt-5 max-w-3xl">
          <div class="flex flex-wrap items-center gap-2" id="head-chips"></div>
          <h2 id="t-title" class="text-2xl sm:text-3xl font-extrabold tracking-tight mt-3.5"></h2>
          <p class="flex flex-wrap items-center gap-x-5 gap-y-2 text-[14px] font-semibold text-muted mt-3" id="t-meta"></p>
        </header>

        <div class="grid lg:grid-cols-12 gap-6 mt-8">
          <!-- Right column: status + actions (moves to the top on mobile) -->
          <aside class="lg:col-span-4 lg:order-2">
            <div class="card p-6 lg:sticky lg:top-24" id="action-card"></div>
          </aside>

          <!-- Left column: structure + instructions -->
          <div class="lg:col-span-8 lg:order-1 grid gap-6 content-start">
            <section class="card p-6 sm:p-7" aria-labelledby="h-structure">
              <h3 id="h-structure" class="font-extrabold tracking-tight text-lg">Test structure</h3>
              <div id="sections" class="mt-5 grid gap-1"></div>
              <div class="flex flex-wrap items-center gap-x-6 gap-y-2 border-t border-line mt-5 pt-5 text-[14px] font-bold">
                <span id="t-total"></span>
                <span class="inline-flex items-center gap-2 text-muted font-semibold" id="t-scoring"></span>
              </div>
            </section>

            <section class="card p-6 sm:p-7" aria-labelledby="h-guide">
              <h3 id="h-guide" class="font-extrabold tracking-tight text-lg">Instructions and notes</h3>
              <ul id="guide" class="grid gap-3.5 mt-5"></ul>
            </section>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Overlay: the sitting engine is not wired in here (seam) -->
<div id="soon-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="soon-title">
  <div class="modal-panel text-center">
    <span class="w-16 h-16 rounded-full bg-brand-soft text-brand-strong inline-flex items-center justify-center mx-auto">
      <svg viewBox="0 0 24 24" class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>
    </span>
    <h3 id="soon-title" class="text-xl font-extrabold tracking-tight mt-5">This test is coming soon</h3>
    <p class="text-muted text-[15px] leading-relaxed mt-2">
      The writing team is still finishing the paper. When it is released it opens in your account automatically.
    </p>
    <div class="grid gap-2.5 mt-6">
      <button type="button" id="notify-me" class="btn btn-primary btn-md w-full">Tell me when it is ready</button>
      <button type="button" data-close class="btn btn-ghost btn-md w-full">Got it</button>
    </div>
  </div>
</div>

<script src="/prep/_mock.js"></script>
<script src="/prep/_chrome.js"></script>
<script>
  PREP.boot({ auth: true }).then(() => {
    PrepChrome.mount({ title: 'Test detail' });

    /* Take the id out of /prep/bai-thi/:id/ and look it up in the real catalogue (GET /api/catalog) */
    const m = location.pathname.match(/\/prep\/bai-thi\/([^/]+)\/?/);

    PREP.loadCatalog().then(res => {
      PREP.catalogWarning(res);
      PREP.qs('#t-loading').classList.add('hidden');
      const test = m && PREP.test(decodeURIComponent(m[1]));

      if (!test) {
        PREP.qs('#nf').removeAttribute('hidden');
      } else {
        PREP.qs('#page').removeAttribute('hidden');
        const fam = PREP.family(test.familyId);
        const unlocked = PrepState.isUnlocked(test);
        document.title = test.title + ' · VPET Prep';

        /* Record that this test's structure has been seen (the dashboard "Next steps" checklist reads it) */
        const st = PrepState.load();
        st.seenTestIds = st.seenTestIds || [];
        if (!st.seenTestIds.includes(test.id)) {
          st.seenTestIds.push(test.id);
          PrepState.save(st);
        }

        PREP.qs('#head-chips').innerHTML =
          '<span class="exam-chip" data-family="' + fam.id + '">' + fam.name + '</span>' +
          '<span class="badge badge-muted">' + test.level + '</span>' +
          (test.comingSoon ? '<span class="badge badge-hl">Coming soon</span>' : '') +
          (unlocked ? '<span class="badge badge-ok">Unlocked</span>' : '');
        PREP.qs('#t-title').textContent = test.title;

        /* 0 items = nothing entered for that part yet; say so instead of showing "0 items" */
        const totalQ = PREP.itemCount(test);
        PREP.qs('#t-meta').innerHTML =
          '<span class="inline-flex items-center gap-1.5">' + PREP.icon('layers', 'w-[18px] h-[18px]') + test.sections.length + ' parts</span>' +
          '<span class="inline-flex items-center gap-1.5">' + PREP.icon('clock', 'w-[18px] h-[18px]') + test.durationMin + ' min</span>' +
          '<span class="inline-flex items-center gap-1.5">' + PREP.icon('list', 'w-[18px] h-[18px]') +
            (totalQ ? totalQ + ' questions' : 'paper being written') + '</span>';

        /* The parts */
        const skillIcon = name => {
          const n = name.toLowerCase();
          if (n.includes('listen')) return 'headphones';
          if (n.includes('read')) return 'book';
          if (n.includes('speak')) return 'mic';
          return 'pen';
        };
        PREP.qs('#sections').innerHTML = test.sections.map(s =>
          '<div class="flex items-center gap-4 py-3.5 border-b border-line last:border-0">' +
            '<span class="w-10 h-10 rounded-xl bg-brand-soft text-brand-strong inline-flex items-center justify-center shrink-0">' + PREP.icon(skillIcon(s.name), 'w-5 h-5') + '</span>' +
            '<span class="min-w-0 flex-1">' +
              '<b class="block font-bold text-[15px]">' + PREP.esc(s.name) + '</b>' +
              '<span class="block text-[13px] text-muted font-medium mt-0.5">' + PREP.esc(s.type) + '</span>' +
            '</span>' +
            '<span class="text-right shrink-0 text-[13px] font-bold">' + (s.items ? PREP.t(s.items + ' items', s.items + ' câu') : '-') +
              '<span class="block text-muted font-semibold">' + s.minutes + ' min</span>' +
            '</span>' +
          '</div>').join('');
        PREP.qs('#t-total').textContent = totalQ
          ? PREP.t('Total: ' + totalQ + ' items, ' + test.durationMin + ' min', 'Tổng: ' + totalQ + ' câu, ' + test.durationMin + ' phút')
          : 'Total: ' + test.durationMin + ' min · items still being written';
        PREP.qs('#t-scoring').innerHTML = PREP.icon('award', 'w-[18px] h-[18px]') + PREP.esc(test.scoring);

        PREP.qs('#guide').innerHTML = test.guide.map(g =>
          '<li class="flex gap-3 text-[15px] leading-relaxed">' +
            '<span class="text-accent-strong mt-1 shrink-0">' + PREP.icon('check', 'w-[18px] h-[18px]') + '</span>' +
            '<span>' + PREP.esc(g) + '</span>' +
          '</li>').join('');

        /* Action card */
        const ac = PREP.qs('#action-card');
        if (unlocked) {
          ac.innerHTML =
            '<p class="flex items-center gap-2.5 font-extrabold"><span class="w-9 h-9 rounded-full bg-accent-soft text-accent-strong inline-flex items-center justify-center">' + PREP.icon('unlock', 'w-5 h-5') + '</span>You have unlocked this test</p>' +
            '<p class="text-muted text-[14px] leading-relaxed mt-3">Status: <b class="text-ink">not started</b>. Your marks and progress are kept here after every sitting.</p>' +
            '<button type="button" id="start" class="btn btn-primary btn-lg w-full mt-5">' + PREP.icon('play', 'w-5 h-5') + 'Start the test</button>' +
            /* A real link: part practice has existed since block 4, and this
               button went on saying "coming soon" beside it. */
            '<a href="/prep/luyen/" class="btn btn-ghost btn-md w-full mt-2.5">Practise part by part</a>';
          /* Engine seam: // TODO(backend/exam-engine) - replace the overlay with navigation into the sitting */
          /* The sitting engine exists now: this button opens a real attempt rather
             than the "coming soon" panel. A paper with no items keeps the old
             panel, because opening an empty sitting achieves nothing. */
          PREP.qs('#start').addEventListener('click', () => {
            if (PREP.itemCount(test) > 0) location.href = '/prep/lam-bai/?test=' + encodeURIComponent(test.id);
            else PREP.qs('#soon-modal').classList.add('show');
          });
        } else {
          ac.innerHTML =
            '<p class="flex items-center gap-2.5 font-extrabold"><span class="w-9 h-9 rounded-full bg-brand-soft text-brand-strong inline-flex items-center justify-center">' + PREP.icon('lock', 'w-5 h-5') + '</span>This test is locked</p>' +
            '<p class="text-muted text-[14px] leading-relaxed mt-3">Activate a code for this test, or a ' + fam.name + ' plan, to start practising.</p>' +
            '<a href="/prep/nhap-code/?test=' + test.id + '" class="btn btn-accent btn-lg w-full mt-5">Unlock with a code</a>' +
            '<a href="/prep/mua-code/" class="btn btn-ghost btn-md w-full mt-2.5">See the code plans</a>' +
            '<button type="button" class="btn btn-primary btn-lg w-full mt-5 opacity-45" disabled>' + PREP.icon('play', 'w-5 h-5') + 'Start the test</button>';
        }

        /* Coming-soon modal */
        const modal = PREP.qs('#soon-modal');
        PREP.qsa('[data-close]', modal).forEach(b => b.addEventListener('click', () => modal.classList.remove('show')));
        modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.classList.remove('show'); });
        PREP.qs('#notify-me').addEventListener('click', async () => {
          modal.classList.remove('show');
          /* The account already carries this preference (Profile →
             Notifications, "New papers released"); switching it on IS the
             promise, and the promise is made only once the server has stored
             it. This used to toast "we will email you" over a TODO. */
          const res = await PrepState.setNotify({ newTests: true });
          PrepChrome.toast(res.ok
            ? PREP.t('Noted. You will be emailed when a new paper is released.',
                     'Đã ghi nhận. Bạn sẽ được báo qua email khi có đề mới.')
            : res.error, res.ok ? undefined : 'error');
        });
      }
    });
  });
</script>
</body>
</html>
