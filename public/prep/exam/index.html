<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đang làm bài · VPET Prep</title>
  <meta name="description" content="Màn làm bài thi thử VPET: đồng hồ từng phần, nghe có giới hạn lượt, ghi âm phần nói.">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/pjs-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/pjs-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
      var tn=localStorage.getItem('prep.tenant');
      if(tn&&tn!=='default')document.documentElement.setAttribute('data-tenant',tn);
    }catch(e){}})();
  </script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="library" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-shell mx-auto px-4 sm:px-6 lg:px-10 pb-6">

      <!-- Chờ /api/attempts -->
      <div id="loading" class="grid gap-4 mt-8" aria-hidden="true">
        <div class="card p-6"><div class="skeleton h-6 w-2/5 mb-3"></div><div class="skeleton h-4 w-4/5 mb-2"></div><div class="skeleton h-4 w-3/5"></div></div>
        <div class="card p-6"><div class="skeleton h-5 w-1/3 mb-4"></div><div class="skeleton h-4 w-full mb-2"></div><div class="skeleton h-4 w-full mb-2"></div><div class="skeleton h-4 w-2/3"></div></div>
      </div>

      <!-- Không có bài nào đang làm -->
      <div id="none" hidden class="card p-10 mt-8 text-center">
        <span class="w-14 h-14 rounded-full bg-brand-soft text-brand-strong inline-flex items-center justify-center mx-auto">
          <svg viewBox="0 0 24 24" class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9V3Z"/></svg>
        </span>
        <h2 class="font-extrabold text-lg tracking-tight mt-4">Bạn chưa có bài thi nào đang làm</h2>
        <p id="none-why" class="text-muted text-[15px] mt-1.5">Chọn một bài trong thư viện rồi bấm Bắt đầu làm bài.</p>
        <div class="grid gap-2.5 mt-6 max-w-xs mx-auto">
          <a href="/prep/thu-vien/" class="btn btn-primary btn-md w-full">Vào thư viện</a>
          <a id="none-alt" href="/prep/" class="btn btn-ghost btn-md w-full">Về trang chủ</a>
        </div>
      </div>

      <!-- Đang làm bài -->
      <div id="runner" hidden>
        <!-- Thanh trạng thái: tên bài, đồng hồ phần đang mở, trạng thái lưu -->
        <div class="sticky top-16 z-20 -mx-4 sm:-mx-6 lg:-mx-10 px-4 sm:px-6 lg:px-10 border-b border-line bg-[color:var(--color-surface)]/92 backdrop-blur-md">
          <div class="py-3.5 flex flex-wrap items-center gap-x-4 gap-y-2">
            <b id="ex-title" class="text-[15px] font-extrabold tracking-tight truncate"></b>
            <span id="ex-clock" hidden class="clock" aria-live="off">
              <svg viewBox="0 0 24 24" class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
              <span id="ex-clock-text">--:--</span>
            </span>
            <span id="ex-saved" class="text-[13px] font-semibold text-muted ms-auto" role="status" aria-live="polite"></span>
            <button type="button" id="ex-submit" class="btn btn-primary btn-sm">Nộp bài</button>
          </div>
        </div>

        <!-- Danh sách phần -->
        <nav class="flex gap-2 overflow-x-auto no-scrollbar mt-5 -mx-1 px-1" aria-label="Các phần của bài thi">
          <div id="ex-parts" class="flex gap-2"></div>
        </nav>

        <!-- Phần đang mở -->
        <section id="ex-part" class="mt-6" aria-live="polite"></section>
      </div>

      <!-- Đã nộp -->
      <div id="done" hidden class="card p-10 mt-8 text-center">
        <span class="w-16 h-16 rounded-full bg-accent-soft text-accent-strong inline-flex items-center justify-center mx-auto">
          <svg viewBox="0 0 24 24" class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21.8 10.1A10 10 0 1 1 14 2.2"/><path d="m9 11 3 3L22 4"/></svg>
        </span>
        <h2 class="text-2xl font-extrabold tracking-tight mt-5">Đã nộp bài</h2>
        <p id="done-count" class="text-muted text-[15px] mt-2"></p>
        <p class="text-[13.5px] text-muted/80 font-medium mt-3 max-w-[48ch] mx-auto">
          Trắc nghiệm và điền từ đã chấm xong. Phần Viết và Nói chấm theo rubric nên có sau.
        </p>
        <div class="grid gap-2.5 mt-6 max-w-xs mx-auto">
          <a id="done-result" href="/prep/thu-vien/" class="btn btn-primary btn-md w-full">Xem kết quả</a>
          <a href="/prep/thu-vien/" class="btn btn-ghost btn-md w-full">Chọn bài khác</a>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Xác nhận nộp bài -->
<div id="submit-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="sm-title">
  <div class="modal-panel">
    <h3 id="sm-title" class="text-lg font-extrabold tracking-tight">Nộp bài bây giờ?</h3>
    <p id="sm-body" class="text-muted text-[14.5px] leading-relaxed mt-2"></p>
    <div class="grid gap-2.5 mt-5">
      <button type="button" id="sm-go" class="btn btn-primary btn-md w-full">Nộp bài</button>
      <button type="button" data-close class="btn btn-ghost btn-md w-full">Quay lại làm tiếp</button>
    </div>
  </div>
</div>

<script src="/prep/_mock.js"></script>
<script src="/prep/_chrome.js"></script>
<script src="/prep/exam/_runner.js"></script>
<script>
  PREP.boot({ auth: true }).then(() => {
    PrepChrome.mount({ title: 'Đang làm bài' });
    PrepRunner.mount();
  });
</script>
</body>
</html>
