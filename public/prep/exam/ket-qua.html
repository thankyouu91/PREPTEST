<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kết quả bài thi · VPET Prep</title>
  <meta name="description" content="Kết quả bài thi thử VPET: điểm từng kỹ năng, bậc VSTEP và bảng phân tích từng câu.">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/pjs-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/pjs-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
      var tn=localStorage.getItem('prep.tenant');
      if(tn&&tn!=='default')document.documentElement.setAttribute('data-tenant',tn);
    }catch(e){}})();
  </script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="progress" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-shell mx-auto px-4 sm:px-6 lg:px-10 pb-6">

      <div id="loading" class="grid gap-4 mt-8" aria-hidden="true">
        <div class="card p-8"><div class="skeleton h-8 w-1/3 mb-4"></div><div class="skeleton h-4 w-2/3 mb-2"></div><div class="skeleton h-4 w-1/2"></div></div>
        <div class="card p-6"><div class="skeleton h-5 w-1/4 mb-4"></div><div class="skeleton h-4 w-full mb-2"></div><div class="skeleton h-4 w-4/5"></div></div>
      </div>

      <!-- Chưa nộp / không tìm thấy -->
      <div id="none" hidden class="card p-10 mt-8 text-center">
        <span class="w-14 h-14 rounded-full bg-brand-soft text-brand-strong inline-flex items-center justify-center mx-auto">
          <svg viewBox="0 0 24 24" class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        </span>
        <h2 id="none-title" class="font-extrabold text-lg tracking-tight mt-4">Chưa có kết quả</h2>
        <p id="none-why" class="text-muted text-[15px] mt-1.5"></p>
        <div class="grid gap-2.5 mt-6 max-w-xs mx-auto">
          <a id="none-cta" href="/prep/thu-vien/" class="btn btn-primary btn-md w-full">Vào thư viện</a>
        </div>
      </div>

      <div id="report" hidden>
        <!-- Điểm tổng và bậc -->
        <section class="card p-7 sm:p-9 mt-8">
          <p class="text-[13px] font-bold uppercase tracking-wide text-muted">Kết quả bài thi</p>
          <h2 id="r-title" class="text-2xl font-extrabold tracking-tight mt-1.5"></h2>
          <p id="r-when" class="text-[13.5px] font-medium text-muted mt-1"></p>

          <div class="flex flex-wrap items-end gap-x-8 gap-y-4 mt-6">
            <span>
              <span class="block text-[13px] font-bold uppercase tracking-wide text-muted">Điểm tổng</span>
              <b id="r-overall" class="block text-5xl font-extrabold tracking-tight leading-none mt-1.5">–</b>
              <span class="block text-[13px] font-semibold text-muted mt-1">trên thang 10</span>
            </span>
            <span id="r-band-box" hidden>
              <span class="block text-[13px] font-bold uppercase tracking-wide text-muted">Bậc</span>
              <b id="r-band" class="block text-3xl font-extrabold tracking-tight leading-none mt-2"></b>
            </span>
          </div>

          <div id="r-pending" hidden class="banner banner-warn show mt-6" role="status">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
            <span id="r-pending-text"></span>
          </div>

          <p id="r-disclaimer" class="text-[13px] text-muted/80 font-medium mt-6"></p>
        </section>

        <!-- Điểm từng kỹ năng -->
        <section id="r-skills-box" hidden class="mt-6">
          <h3 class="font-extrabold text-lg tracking-tight">Điểm từng kỹ năng</h3>
          <div id="r-skills" class="grid sm:grid-cols-2 xl:grid-cols-4 gap-4 mt-4"></div>
        </section>

        <!-- Bóc tách từng phần -->
        <section id="r-parts-box" hidden class="mt-8">
          <h3 class="font-extrabold text-lg tracking-tight">Từng phần, từng câu</h3>
          <p class="text-muted text-[14.5px] mt-1.5 max-w-[62ch]">
            Câu trả lời của bạn được giữ nguyên để đối chiếu. Đáp án đúng không hiện ở đây vì đề còn dùng cho lượt sau.
          </p>
          <div id="r-parts" class="grid gap-4 mt-4"></div>
        </section>

        <!-- Báo cáo rút gọn: gói Starter -->
        <section id="r-upgrade" hidden class="card p-7 mt-8">
          <span class="w-12 h-12 rounded-2xl bg-brand-soft text-brand-strong inline-flex items-center justify-center">
            <svg viewBox="0 0 24 24" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </span>
          <h3 class="font-extrabold text-lg tracking-tight mt-4">Bảng phân tích từng phần</h3>
          <p id="r-upgrade-why" class="text-muted text-[15px] leading-relaxed mt-2 max-w-[56ch]"></p>
          <a href="/prep/mua-code/?locked=detailed-report" class="btn btn-primary btn-md mt-5">Xem bảng giá</a>
        </section>

        <div class="flex flex-wrap gap-2.5 mt-8">
          <a href="/prep/thu-vien/" class="btn btn-soft btn-md">Làm bài khác</a>
          <a href="/prep/" class="btn btn-ghost btn-md">Về trang chủ</a>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/prep/_mock.js"></script>
<script src="/prep/_chrome.js"></script>
<script>
  PREP.boot({ auth: true }).then(async () => {
    PrepChrome.mount({ title: 'Kết quả bài thi' });

    /* Id lượt thi nằm trên đường dẫn /prep/ket-qua/:id/ */
    const id = (location.pathname.match(/\/prep\/ket-qua\/(\d+)\//) || [])[1];
    const loading = PREP.qs('#loading');

    function showNone(title, why, ctaHref, ctaText) {
      loading.setAttribute('hidden', '');
      PREP.qs('#none-title').textContent = title;
      PREP.qs('#none-why').textContent = why;
      const cta = PREP.qs('#none-cta');
      if (ctaHref) { cta.href = ctaHref; cta.textContent = ctaText; }
      PREP.qs('#none').removeAttribute('hidden');
    }

    if (!id) return showNone('Không tìm thấy lượt thi', 'Đường dẫn thiếu mã lượt thi.');

    const res = await PrepApi.get('/api/attempts/' + id + '/result');
    if (!res.ok) {
      /* 409 nghĩa là bài chưa nộp — đó không phải lỗi, mà là một việc còn dang
         dở, nên dẫn thẳng về chỗ làm tiếp. */
      if (res.status === 409) {
        return showNone('Bài này chưa nộp', PrepApi.err(res), '/prep/lam-bai/', 'Làm tiếp bài này');
      }
      return showNone('Không xem được kết quả', PrepApi.err(res));
    }

    const r = res.data;
    loading.setAttribute('hidden', '');
    PREP.qs('#report').removeAttribute('hidden');

    const test = PREP.test(r.testId);
    PREP.qs('#r-title').textContent = test ? test.title : r.testId;
    PREP.qs('#r-when').textContent = r.submittedAt ? 'Nộp lúc ' + PREP.fmtDate(r.submittedAt) : '';
    PREP.qs('#r-disclaimer').textContent = r.disclaimer || '';

    /* Điểm tổng chỉ hiện khi đã chấm đủ. Chưa đủ thì để gạch ngang và nói rõ
       còn thiếu gì — hiện một con số nửa vời sẽ bị đọc là kết quả cuối cùng. */
    PREP.qs('#r-overall').textContent = r.overall == null ? '–' : PREP.diem(r.overall);
    if (r.band && r.band.band) {
      PREP.qs('#r-band').textContent = r.band.band + ' · ' + r.band.cefr;
      PREP.qs('#r-band-box').removeAttribute('hidden');
    }
    if (r.pending) {
      PREP.qs('#r-pending-text').textContent =
        'Phần Viết và Nói đang chờ chấm. Điểm tổng và bậc sẽ hiện khi cả bốn kỹ năng chấm xong.';
      PREP.qs('#r-pending').removeAttribute('hidden');
    }

    /* Gói Starter: chỉ có điểm và bậc. Nói rõ vì sao ngắn thay vì để trống. */
    if (!r.detailed) {
      PREP.qs('#r-upgrade-why').textContent =
        r.upgradeHint || 'Bảng phân tích từng phần có ở gói Plus trở lên.';
      PREP.qs('#r-upgrade').removeAttribute('hidden');
      return;
    }

    /* ---- Điểm từng kỹ năng ---- */
    const SKILL_ORDER = ['listening', 'reading', 'writing', 'speaking'];
    const skills = (r.skills || []).slice().sort(
      (a, b) => SKILL_ORDER.indexOf(a.skill) - SKILL_ORDER.indexOf(b.skill));
    if (skills.length) {
      PREP.qs('#r-skills').innerHTML = skills.map(s =>
        '<article class="card p-5">' +
          '<p class="text-[13px] font-bold uppercase tracking-wide text-muted">' +
            PREP.esc(PREP.SKILL_VI[s.skill] || s.skill) + '</p>' +
          (s.pending
            ? '<p class="text-[15px] font-bold text-muted mt-2">Chờ chấm</p>' +
              '<p class="text-[13px] font-medium text-muted mt-1">Chấm bằng rubric, có sau</p>'
            : '<p class="mt-1.5"><b class="text-3xl font-extrabold tracking-tight">' + PREP.diem(s.score) + '</b>' +
              '<span class="text-[13px] font-semibold text-muted"> / 10</span></p>' +
              '<p class="text-[13px] font-medium text-muted mt-1">Đúng ' + s.rawEarned + '/' + s.rawMax + ' câu</p>') +
        '</article>').join('');
      PREP.qs('#r-skills-box').removeAttribute('hidden');
    }

    /* ---- Từng phần, từng câu ---- */
    const parts = r.parts || [];
    if (parts.length) {
      PREP.qs('#r-parts').innerHTML = parts.map(p =>
        '<article class="card overflow-hidden">' +
          '<div class="flex flex-wrap items-center gap-3 px-5 py-4 border-b border-line bg-surface">' +
            '<b class="text-[15px]">' + PREP.esc(p.name) + '</b>' +
            (p.part ? '<span class="badge badge-muted">Phần ' + PREP.esc(p.part) + '</span>' : '') +
            '<span class="ms-auto text-[13.5px] font-bold">' +
              (p.max ? p.earned + '/' + p.max + ' câu đúng' : 'Chờ chấm') + '</span>' +
          '</div>' +
          '<ul class="px-5 py-1">' + p.items.map((it, i) =>
            '<li class="flex items-start gap-3 py-2.5 border-b border-line last:border-0">' +
              '<span class="w-6 shrink-0 text-[12.5px] font-bold text-muted pt-0.5">' + (i + 1) + '</span>' +
              '<span class="min-w-0 flex-1">' +
                '<span class="block text-[14px] leading-snug">' + PREP.esc(it.prompt) + '</span>' +
                '<span class="block text-[12.5px] text-muted font-medium mt-1">' +
                  (it.hasRecording ? 'Đã ghi âm' : (it.given ? 'Bạn trả lời: ' + PREP.esc(it.given) : 'Bỏ trống')) +
                '</span>' +
              '</span>' +
              markChip(it) +
            '</li>').join('') + '</ul>' +
        '</article>').join('');
      PREP.qs('#r-parts-box').removeAttribute('hidden');
    }

    /** Dấu đúng / sai / chờ chấm cho một câu */
    function markChip(it) {
      const answered = !!(it.given && it.given.trim()) || it.hasRecording;
      /* Câu chấm bằng rubric: "chờ chấm" chỉ đúng khi có gì đó để chấm. Không
         nói gì cả mà vẫn ghi "chờ chấm" thì người đọc tưởng mình có bài đang
         xếp hàng, trong khi thực ra bỏ trống. */
      if (it.max == null) {
        return answered
          ? '<span class="badge badge-muted shrink-0">Chờ chấm</span>'
          : '<span class="badge badge-danger shrink-0">Bỏ trống</span>';
      }
      const right = it.earned > 0;
      return '<span class="badge shrink-0 ' + (right ? 'badge-ok' : 'badge-danger') + '">' +
        (right ? 'Đúng' : (answered ? 'Sai' : 'Bỏ trống')) + '</span>';
    }
  });
</script>
</body>
</html>
