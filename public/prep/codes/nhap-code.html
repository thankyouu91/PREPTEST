<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhập code · VPET Prep</title>
  <meta name="description" content="Kích hoạt code để mở khoá bài thi thử.">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/pjs-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/pjs-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
      var tn=localStorage.getItem('prep.tenant');
      if(tn&&tn!=='default')document.documentElement.setAttribute('data-tenant',tn);
    }catch(e){}})();
  </script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="codes" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-xl mx-auto px-4 sm:px-6 pb-6">

      <!-- Bước nhập mã -->
      <section id="redeem-box" class="card p-7 sm:p-9 mt-10">
        <span class="w-14 h-14 rounded-2xl bg-brand-soft text-brand-strong inline-flex items-center justify-center">
          <svg viewBox="0 0 24 24" class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9.5a2.5 2.5 0 0 1 0 5V17a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2.5a2.5 2.5 0 0 1 0-5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2.5"/><path d="M13 10.75v2.5"/><path d="M13 16.5V19"/></svg>
        </span>
        <h2 class="text-2xl font-extrabold tracking-tight mt-5">Nhập code mở khoá</h2>
        <p class="text-muted text-[15px] leading-relaxed mt-2">
          Mã gồm 12 ký tự, in trên thẻ hoặc trong email mua hàng. Ví dụ: <b class="text-ink">VPET-B1MK-24TR</b>
        </p>
        <p id="test-context" hidden class="mt-3 text-[14px] font-semibold text-brand-strong"></p>

        <form id="f" class="mt-6" novalidate>
          <label class="label" for="code">Mã kích hoạt</label>
          <input id="code" class="code-input" type="text" inputmode="latin" autocomplete="off" spellcheck="false"
                 placeholder="XXXX-XXXX-XXXX" maxlength="14" aria-describedby="code-err">
          <div id="code-err" class="banner banner-error mt-3.5" role="alert" aria-live="polite">
            <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            <span id="code-err-text"></span>
          </div>
          <button type="submit" id="submit" class="btn btn-primary btn-lg w-full mt-5">Kích hoạt code</button>
        </form>

        <div class="border-t border-line mt-7 pt-6">
          <p class="text-[13px] font-bold uppercase tracking-wide text-muted mb-3">Mã demo để thử luồng</p>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="chip" data-demo="VPET-B1MK-24TR">VPET-B1MK-24TR</button>
            <button type="button" class="chip" data-demo="IELT-AC12-96HD">IELT-AC12-96HD</button>
            <button type="button" class="chip" data-demo="PREP-HHAN-2025">PREP-HHAN-2025 (hết hạn)</button>
            <button type="button" class="chip" data-demo="PREP-DUNG-ROI1">PREP-DUNG-ROI1 (đã dùng)</button>
          </div>
          <p class="text-[13.5px] font-medium text-muted mt-5">
            Chưa có code? <a href="/prep/mua-code/" class="font-bold text-brand-strong hover:underline">Mua code</a>
          </p>
        </div>
      </section>

      <!-- Success state -->
      <section id="success-box" hidden class="card p-7 sm:p-9 mt-10 text-center">
        <span class="w-16 h-16 rounded-full bg-accent-soft text-accent-strong inline-flex items-center justify-center mx-auto">
          <svg viewBox="0 0 24 24" class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2.5"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
        </span>
        <h2 class="text-2xl font-extrabold tracking-tight mt-5">Mở khoá thành công!</h2>
        <p class="text-muted text-[15px] mt-2">Code <b id="ok-code" class="text-ink"></b> đã kích hoạt:</p>
        <p class="mt-3"><span id="ok-label" class="badge badge-ok text-[13px] px-3.5 py-1.5"></span></p>

        <div id="ok-tests" class="grid gap-2.5 mt-6 text-left"></div>

        <div class="grid gap-2.5 mt-7">
          <a href="/prep/thu-vien/" class="btn btn-primary btn-md w-full">Vào thư viện luyện ngay</a>
          <button type="button" id="redeem-more" class="btn btn-ghost btn-md w-full">Nhập mã khác</button>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="/prep/_mock.js"></script>
<script src="/prep/_chrome.js"></script>
<script>
  PREP.boot({ auth: true }).then(() => {
    PrepChrome.mount({ title: 'Nhập code' });

    const input = PREP.qs('#code');
    const errBox = PREP.qs('#code-err'), errText = PREP.qs('#code-err-text');
    const params = new URLSearchParams(location.search);

    /* Ngữ cảnh: đến từ nút "Mở khoá bằng code" của một bài cụ thể.
       Tên bài lấy từ danh mục thật nên phải đợi GET /api/catalog. */
    PREP.loadCatalog().then(res => {
      PREP.catalogWarning(res);
      const forTest = params.get('test') && PREP.test(params.get('test'));
      if (forTest) {
        const ctx = PREP.qs('#test-context');
        ctx.textContent = 'Bạn đang mở khoá cho bài: ' + forTest.title;
        ctx.removeAttribute('hidden');
      }
    });

    /* Auto-format XXXX-XXXX-XXXX khi gõ */
    input.addEventListener('input', () => {
      const raw = input.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
      input.value = (raw.match(/.{1,4}/g) || []).join('-');
      errBox.classList.remove('show');
      input.classList.remove('input-invalid');
    });
    if (params.get('code')) {
      input.value = params.get('code').toUpperCase().slice(0, 14);
    }

    /* Chip mã demo */
    PREP.qsa('[data-demo]').forEach(b => b.addEventListener('click', () => {
      input.value = b.getAttribute('data-demo');
      errBox.classList.remove('show');
      input.classList.remove('input-invalid');
      input.focus();
    }));

    /* Kích hoạt — còn ở client. // TODO(backend): POST /api/redeem, kiểm mã phía server */
    const f = PREP.qs('#f'), btn = PREP.qs('#submit');
    f.addEventListener('submit', ev => {
      ev.preventDefault();
      const code = input.value.trim();
      if (code.replace(/-/g, '').length !== 12) {
        errText.textContent = 'Mã cần đủ 12 ký tự (dạng XXXX-XXXX-XXXX).';
        errBox.classList.add('show');
        input.classList.add('input-invalid');
        return;
      }
      btn.disabled = true;
      btn.innerHTML = PREP.icon('loader', 'w-5 h-5 animate-spin-slow') + 'Đang kiểm tra mã';
      setTimeout(() => {
        const res = PrepState.redeem(code);
        btn.disabled = false; btn.textContent = 'Kích hoạt code';
        if (!res.ok) {
          errText.textContent = res.error;
          errBox.classList.add('show');
          input.classList.add('input-invalid');
          return;
        }
        /* Success: confetti nhẹ + danh sách bài vừa mở */
        PREP.qs('#ok-code').textContent = code;
        PREP.qs('#ok-label').textContent = PrepState.unlockLabel(res.unlocks);
        const opened = PREP.tests.filter(t =>
          (res.unlocks.testId && t.id === res.unlocks.testId) ||
          (res.unlocks.familyId && t.familyId === res.unlocks.familyId) ||
          (res.unlocks.bundle && res.unlocks.bundle.includes(t.familyId)));
        PREP.qs('#ok-tests').innerHTML = opened.map(t =>
          '<a href="/prep/bai-thi/' + t.id + '/" class="card card-hover px-4 py-3.5 flex items-center gap-3">' +
            '<span class="exam-chip shrink-0" data-family="' + t.familyId + '">' + ((PREP.family(t.familyId) || {}).name || t.familyId) + '</span>' +
            '<span class="font-bold text-[14.5px] truncate">' + PREP.esc(t.title) + '</span>' +
            (t.comingSoon ? '<span class="badge badge-hl ms-auto shrink-0">Sắp có</span>'
                          : '<span class="text-accent-strong ms-auto shrink-0">' + PREP.icon('arrowRight', 'w-5 h-5') + '</span>') +
          '</a>').join('') ||
          '<p class="text-center text-sm text-muted">Bài thuộc gói này sẽ xuất hiện khi admin phát hành đề.</p>';
        PREP.qs('#redeem-box').setAttribute('hidden', '');
        PREP.qs('#success-box').removeAttribute('hidden');
        PREP.confetti();
      }, 900);
    });

    PREP.qs('#redeem-more').addEventListener('click', () => {
      input.value = '';
      PREP.qs('#success-box').setAttribute('hidden', '');
      PREP.qs('#redeem-box').removeAttribute('hidden');
      input.focus();
    });
  });
</script>
</body>
</html>
