<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My codes · VPET Prep</title>
  <meta name="description" content="Your activated codes: what they unlock, when they were activated and when they expire.">
  <meta name="theme-color" content="#1c3d8f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/pjs-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/pjs-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/tailwind-built.css">
  <style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}</style>
  <script>
    (function(){try{
      var t=localStorage.getItem('prep.theme');
      if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
      var tn=localStorage.getItem('prep.tenant');
      if(tn&&tn!=='default')document.documentElement.setAttribute('data-tenant',tn);
    }catch(e){}})();
  </script>
  <!-- Song ngữ: chạy sớm để đặt ngôn ngữ (mặc định tiếng Việt) trước khi vẽ trang -->
  <script src="/i18n.js"></script>
</head>
<body class="bg-surface text-ink">
<div id="app" data-active="codes" class="min-h-[100dvh]">
  <main id="main">
    <div class="max-w-shell mx-auto px-4 sm:px-6 lg:px-10 pb-6">

      <section class="mt-8 flex flex-wrap items-end gap-3">
        <div>
          <h2 class="text-2xl sm:text-[28px] font-extrabold tracking-tight">My codes</h2>
          <p class="text-muted text-[15px] mt-1.5" id="code-count"></p>
        </div>
        <div class="ms-auto flex gap-2.5">
          <a href="/prep/nhap-code/" class="btn btn-primary btn-md">Enter code</a>
          <a href="/prep/mua-code/" class="btn btn-ghost btn-md">Mua code</a>
        </div>
      </section>

      <!-- Where a payment lands. The gateway sends the buyer to
           /payments/:provider/return, which reads the order out of the database
           and redirects here with ?order=&status=. -->
      <div id="pay-banner" class="banner mt-6" role="status">
        <svg viewBox="0 0 24 24" class="w-5 h-5 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <span id="pay-banner-text"></span>
      </div>

      <!-- Table-shaped loading skeleton -->
      <div id="codes-loading" class="card mt-7 p-5 grid gap-4">
        <div class="skeleton h-6 w-full"></div>
        <div class="skeleton h-6 w-11/12"></div>
        <div class="skeleton h-6 w-full"></div>
      </div>

      <!-- Desktop table -->
      <div id="codes-table-wrap" hidden class="card mt-7 overflow-hidden hidden md:block">
        <table class="w-full text-[14px]">
          <thead>
            <tr class="text-left text-[13px] uppercase tracking-wide text-muted border-b border-line">
              <th class="font-bold px-6 py-4">Code</th>
              <th class="font-bold px-4 py-4">Plan</th>
              <th class="font-bold px-4 py-4">Activated</th>
              <th class="font-bold px-4 py-4">Expires</th>
              <th class="font-bold px-6 py-4 text-right">Status</th>
            </tr>
          </thead>
          <tbody id="codes-tbody"></tbody>
        </table>
      </div>

      <!-- Card list mobile -->
      <div id="codes-cards" hidden class="grid gap-4 mt-7 md:hidden"></div>

      <!-- Empty state -->
      <div id="codes-empty" hidden class="card p-8 sm:p-12 mt-7">
        <div class="sm:flex items-center gap-10">
          <svg viewBox="0 0 180 130" class="w-44 mx-auto sm:mx-0 shrink-0" aria-hidden="true" fill="none">
            <rect x="26" y="38" width="112" height="62" rx="12" class="fill-[color:var(--color-card)]" stroke="var(--color-border)" stroke-width="2.5"/>
            <path d="M26 62h112" stroke="var(--color-border)" stroke-width="2.5" stroke-dasharray="6 7"/>
            <circle cx="138" cy="92" r="26" fill="color-mix(in srgb, var(--color-accent) 13%, transparent)"/>
            <g stroke="var(--color-accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M128 92h20M138 82v20"/>
            </g>
            <rect x="40" y="74" width="40" height="9" rx="4.5" fill="color-mix(in srgb, var(--color-primary) 22%, transparent)"/>
          </svg>
          <div class="text-center sm:text-left mt-6 sm:mt-0">
            <h3 class="font-extrabold text-[17px] tracking-tight">No codes activated yet</h3>
            <p class="text-muted text-[15px] leading-relaxed mt-1.5 max-w-[46ch]">
              Get a code from your school or centre, or buy one directly. Once it is activated, what it unlocks shows up here.
            </p>
            <div class="flex flex-wrap justify-center sm:justify-start gap-2.5 mt-5">
              <a href="/prep/nhap-code/" class="btn btn-primary btn-md">Enter code</a>
              <a href="/prep/mua-code/" class="btn btn-ghost btn-md">Mua code</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/prep/_mock.js"></script>
<script src="/prep/_chrome.js"></script>
<script>
  PREP.boot({ auth: true }).then(() => {
    PrepChrome.mount({ title: 'My codes' });

    /* ----- Coming back from a payment -----
       The server has already decided the wording: it looked the order up and
       put its real status in the query. What it says is never taken from the
       gateway's own redirect parameters, which anyone holding the browser can
       type - only the IPN settles an order (see server/payment-api.js).

       "pending" is the ordinary case, not an error. The buyer's browser
       usually gets back before the gateway's server-to-server call lands, so
       the honest thing to say is that the payment is being confirmed. */
    (function payReturn() {
      const params = new URLSearchParams(location.search);
      const status = params.get('status');
      if (!status) return;
      const banner = PREP.qs('#pay-banner');
      const said = {
        paid: ['banner-success', 'Payment received. Your new code is in the list below - enter it to start your term.'],
        pending: ['banner-warn', 'Payment received and being confirmed. This usually takes a few seconds; reload the page and your code will appear below.'],
        failed: ['banner-error', 'That payment did not go through, so nothing was charged and no code was issued. You can try again from the plans page.'],
        unknown: ['banner-warn', 'We could not match that payment to an order. If money left your account, send us the reference and we will sort it out.']
      }[status] || ['banner-warn', 'We could not read the result of that payment.'];
      banner.classList.add(said[0], 'show');
      PREP.qs('#pay-banner-text').textContent = said[1];
      /* Take the parameters back out of the address bar: a reload should not
         re-announce a payment, and the reference does not belong in a
         bookmark or in whatever the next screenshot captures. */
      history.replaceState(null, '', location.pathname);
    })();

    /* Activated codes: the stored ones come from GET /api/me, anything activated in
       the browser sits in a local overlay on top. */
    const s = PrepState.load();
    const codes = (s.myCodes || []).slice().sort((a, b) => new Date(b.redeemedAt) - new Date(a.redeemedAt));

    const stChip = c => {
      if (new Date(c.expiresAt) < new Date()) return '<span class="badge badge-muted">Expired</span>';
      return '<span class="badge badge-ok">Active</span>';
    };
    const codeCell = (c, i) =>
      '<span class="inline-flex items-center gap-1.5 font-bold tracking-wide">' +
        '<span data-code-text="' + i + '">' + PREP.maskCode(c.code) + '</span>' +
        '<button type="button" class="p-1 rounded-full text-muted hover:text-ink transition" data-code-eye="' + i + '" aria-label="Show the full code" aria-pressed="false">' + PREP.icon('eye', 'w-4 h-4') + '</button>' +
        '<button type="button" class="p-1 rounded-full text-muted hover:text-ink transition" data-code-copy="' + i + '" aria-label="Copy code">' + PREP.icon('copy', 'w-4 h-4') + '</button>' +
      '</span>';

    /* What a code unlocks is named from the real catalogue, so this waits on GET /api/catalog */
    PREP.loadCatalog().then(res => {
      PREP.catalogWarning(res);
      PREP.qs('#codes-loading').classList.add('hidden');

      if (!codes.length) {
        PREP.qs('#codes-empty').removeAttribute('hidden');
        PREP.qs('#code-count').textContent = 'No codes yet';
        return;
      }
      PREP.qs('#code-count').textContent = PREP.t(codes.length + ' codes activated', codes.length + ' mã đã kích hoạt');

      PREP.qs('#codes-tbody').innerHTML = codes.map((c, i) =>
        '<tr class="border-b border-line last:border-0">' +
          '<td class="px-6 py-4">' + codeCell(c, i) + '</td>' +
          '<td class="px-4 py-4 font-semibold">' + PREP.esc(PrepState.codeLabel(c)) + '</td>' +
          '<td class="px-4 py-4 text-muted">' + PREP.fmtDate(c.redeemedAt) + '</td>' +
          '<td class="px-4 py-4 text-muted">' + PREP.fmtDate(c.expiresAt) + '</td>' +
          '<td class="px-6 py-4 text-right">' + stChip(c) + '</td>' +
        '</tr>').join('');
      PREP.qs('#codes-table-wrap').removeAttribute('hidden');

      PREP.qs('#codes-cards').innerHTML = codes.map((c, i) =>
        '<article class="card p-5">' +
          '<div class="flex items-center justify-between gap-3">' + codeCell(c, i) + stChip(c) + '</div>' +
          '<p class="font-semibold mt-3">' + PREP.esc(PrepState.codeLabel(c)) + '</p>' +
          '<p class="flex gap-4 text-[13px] font-medium text-muted mt-2">' +
            '<span>Activated: ' + PREP.fmtDate(c.redeemedAt) + '</span>' +
            '<span>Expires: ' + PREP.fmtDate(c.expiresAt) + '</span>' +
          '</p>' +
        '</article>').join('');
      PREP.qs('#codes-cards').removeAttribute('hidden');

      /* Show/hide + copy the code */
      PREP.qsa('[data-code-eye]').forEach(b => b.addEventListener('click', () => {
        const i = b.getAttribute('data-code-eye');
        const on = b.getAttribute('aria-pressed') === 'true';
        PREP.qsa('[data-code-text="' + i + '"]').forEach(el => { el.textContent = on ? PREP.maskCode(codes[i].code) : codes[i].code; });
        PREP.qsa('[data-code-eye="' + i + '"]').forEach(x => {
          x.setAttribute('aria-pressed', String(!on));
          x.innerHTML = PREP.icon(on ? 'eye' : 'eyeOff', 'w-4 h-4');
          x.setAttribute('aria-label', on ? 'Show the full code' : 'Hide the code');
        });
      }));
      PREP.qsa('[data-code-copy]').forEach(b => b.addEventListener('click', () => {
        const i = b.getAttribute('data-code-copy');
        navigator.clipboard && navigator.clipboard.writeText(codes[i].code)
          .then(() => PrepChrome.toast('Code copied'))
          .catch(() => PrepChrome.toast('Could not copy', 'error'));
      }));
    });
  });
</script>
</body>
</html>
